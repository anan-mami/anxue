  // match：真连线（左右两列点选配对，提交校验）
  registerType("match", {
    renderBody: function (q) {
      var lefts = [], rights = [];
      var pairs = q.pairs || [];
      if (pairs.length) { pairs.forEach(function (p) { lefts.push(p.left); rights.push(p.right); }); }
      else if (q.options && q.options.length >= 2) {
        for (var i = 0; i + 1 < q.options.length; i += 2) { lefts.push(q.options[i]); rights.push(q.options[i + 1]); }
      }
      function col(side, arr) {
        return '<div class="match-col ' + side + '">' + arr.map(function (t, i) {
          return '<button class="match-item" type="button" data-side="' + side + '" data-idx="' + i + '">' + esc(t) + '</button>';
        }).join("") + '</div>';
      }
      return '<div class="match-area" id="matchArea"><svg class="match-lines" id="matchLines"></svg>' +
        '<div class="match-cols">' + col("left", lefts) + col("right", rights) + '</div>' +
        '<p class="match-tip">点左边一个，再点右边一个，就能连起来啦～</p></div>';
    },
    bind: function (host, q, qz) {
      var area = host.querySelector("#matchArea");
      var lines = host.querySelector("#matchLines");
      var conns = [], pending = null;
      var lefts = [], rights = [];
      var pairs = q.pairs || [];
      if (pairs.length) { pairs.forEach(function (p) { lefts.push(p.left); rights.push(p.right); }); }
      else if (q.options) { for (var i = 0; i + 1 < q.options.length; i += 2) { lefts.push(q.options[i]); rights.push(q.options[i + 1]); } }
      function svgLine(a, b, cls) {
        // match-area 已 position:relative，子元素 offsetLeft/Top 即相对于它，无需再减
        var x1 = a.offsetLeft + a.offsetWidth / 2;
        var y1 = a.offsetTop + a.offsetHeight / 2;
        var x2 = b.offsetLeft + b.offsetWidth / 2;
        var y2 = b.offsetTop + b.offsetHeight / 2;
        var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", x1); ln.setAttribute("y1", y1); ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
        ln.setAttribute("class", "ml" + (cls ? " " + cls : "")); lines.appendChild(ln);
      }
      function redraw(feedback) {
        lines.innerHTML = "";
        Array.prototype.forEach.call(area.querySelectorAll(".match-item"), function (x) { x.classList.remove("done", "correct", "wrong"); });
        var okPairs = pairs.length ? pairs : lefts.map(function (l, i) { return { left: l, right: rights[i] }; });
        conns.forEach(function (c) {
          var la = area.querySelector('.match-item[data-side="left"][data-idx="' + c.l + '"]');
          var ra = area.querySelector('.match-item[data-side="right"][data-idx="' + c.r + '"]');
          if (!la || !ra) return;
          var isRight = okPairs.some(function (p) { return p.left === lefts[c.l] && p.right === rights[c.r]; });
          if (feedback) {
            svgLine(la, ra, isRight ? "correct" : "wrong");
            la.classList.add(isRight ? "correct" : "wrong");
            ra.classList.add(isRight ? "correct" : "wrong");
          } else {
            svgLine(la, ra);
            la.classList.add("done"); ra.classList.add("done");
          }
        });
      }
      Array.prototype.forEach.call(area.querySelectorAll(".match-item"), function (b) {
        b.addEventListener("click", function () {
          var side = b.getAttribute("data-side"), idx = +b.getAttribute("data-idx");
          if (side === "left") {
            Array.prototype.forEach.call(area.querySelectorAll('.match-item[data-side="left"]'), function (x) { x.classList.remove("pend"); });
            b.classList.add("pend"); pending = idx;
          } else {
            if (pending === null) { Pet.say("先点左边一个哦～", 1500); return; }
            conns = conns.filter(function (c) { return c.r !== idx && c.l !== pending; });
            conns.push({ l: pending, r: idx });
            Array.prototype.forEach.call(area.querySelectorAll('.match-item[data-side="left"]'), function (x) { x.classList.remove("pend"); });
            pending = null; redraw();
          }
        });
      });
      var actions = host.querySelector("#qActions");
      actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
      actions.querySelector("#submitBtn").addEventListener("click", function () {
        var leftCount = area.querySelectorAll('.match-item[data-side="left"]').length;
        if (conns.length < leftCount) { Pet.say("还有没连的哦～", 1800); return; }
        var okPairs = pairs.length ? pairs : lefts.map(function (l, i) { return { left: l, right: rights[i] }; });
        var allRight = conns.every(function (c) {
          return okPairs.some(function (p) { return p.left === lefts[c.l] && p.right === rights[c.r]; });
        });
        redraw(true); // 用颜色标出对错
        if (!allRight) {
          var fb = host.querySelector("#qFeedback");
          fb.innerHTML = '<div class="fb bad">❌ 有几对连错啦，再看看～<br><b>正确连连看：</b>' +
            okPairs.map(function (p) { return esc(p.left) + "—" + esc(p.right); }).join("，") + '</div>';
          return;
        }
        afterAnswer(true, q, qz, host, conns.map(function (c) { return lefts[c.l] + "—" + rights[c.r]; }).join("，"));
      });
    }
  });

  // fill：数字填空（数学，保持原样）
  registerType("fill", {
    renderBody: function (q) { return qInput('type="text" inputmode="numeric" pattern="[0-9]*" placeholder="在这里写出数字答案…"'); },
    bind: function (host, q, qz) { bindText(host, q, qz); }
  });

  // fill_hanzi：汉字作答 —— 答案字在本单元已学生字表→手写板；否则自动降级选汉字
  registerType("fill_hanzi", {
    renderBody: function (q, qz) {
      var chars = unitLearnedChars(qz && qz.ctx ? qz.ctx.unitId : null);
      var canHand = chars.indexOf(q.answer) >= 0;
      if (canHand) {
        return '<div class="hw-wrap" id="hwWrap"><canvas id="hwCanvas" class="hw-canvas" width="600" height="220"></canvas>' +
          '<button class="btn ghost" id="hwClear" type="button">清除重写</button></div>' +
          '<p class="match-tip">用手指或鼠标，在框里写出这个字～</p>';
      }
      var opts = (q.options && q.options.length) ? q.options.slice() : [q.answer];
      if (opts.indexOf(q.answer) < 0) opts.unshift(q.answer);
      return '<div class="q-options btn-grid" id="optGrid">' +
        opts.map(function (o) { return '<button class="opt-btn" type="button" data-val="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") +
        '</div>';
    },
    bind: function (host, q, qz) {
      var chars = unitLearnedChars(qz && qz.ctx ? qz.ctx.unitId : null);
      if (chars.indexOf(q.answer) >= 0) { mountHandwrite(host, q, qz); return; }
      bindChoice(host, q, qz);
    }
  });

  // read_comp：阅读理解（语段 + 多道子题）
  // 子题若有 options → 点选作答（一年级友好）；否则 → 文本输入
  registerType("read_comp", {
    renderBody: function (q) {
      var h = '<div class="read-passage">' + esc(q.passage || "") + '</div>';
      (q.questions || []).forEach(function (sq, i) {
        h += '<div class="read-sub"><div class="read-sub-stem">' + (i + 1) + '. ' + esc(sq.stem) + '</div>';
        if (sq.options && sq.options.length) {
          h += '<div class="q-options btn-grid" id="ransGrid' + i + '">' +
            sq.options.map(function (o) { return '<button class="opt-btn" type="button" data-idx="' + i + '" data-val="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") +
            '</div>';
        } else {
          h += '<input class="q-input read-ans" id="rans' + i + '" type="text" placeholder="写下你的答案…">';
        }
        h += '</div>';
      });
      return h;
    },
    bind: function (host, q, qz) {
      var actions = host.querySelector("#qActions");
      var feedback = host.querySelector("#qFeedback");
      // 选择题子题：绑定点选高亮
      Array.prototype.forEach.call(host.querySelectorAll('[id^="ransGrid"]'), function (grid) {
        Array.prototype.forEach.call(grid.querySelectorAll(".opt-btn"), function (b) {
          b.addEventListener("click", function () {
            Array.prototype.forEach.call(grid.querySelectorAll(".opt-btn"), function (x) { x.classList.remove("selected"); });
            b.classList.add("selected");
          });
        });
      });
      actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
      actions.querySelector("#submitBtn").addEventListener("click", function () {
        var allCorrect = true, parts = [];
        (q.questions || []).forEach(function (sq, i) {
          var ua = "";
          if (sq.options && sq.options.length) {
            var sel = host.querySelector('#ransGrid' + i + ' .opt-btn.selected');
            ua = sel ? sel.getAttribute("data-val") : "";
          } else {
            var inp = host.querySelector("#rans" + i);
            ua = inp ? inp.value : "";
          }
          parts.push(ua);
          if (!S.isAnswerCorrect(ua, sq.answer)) allCorrect = false;
        });
        if (parts.some(function (p) { return !p.trim(); })) { Pet.say("每道题都要答哦～", 1800); return; }
        if (!allCorrect) {
          feedback.innerHTML = '<div class="fb bad">❌ 再想想～<br><b>参考答案：</b>' +
            (q.questions || []).map(function (sq) { return esc(sq.answer); }).join("；") +
            '<br><span class="an">' + esc(q.analysis || "") + '</span></div>';
        }
        afterAnswer(allCorrect, q, qz, host, parts.join(" | "));
      });
    }
  });

  // recite：背诵（录音回放 + 自评）
  registerType("recite", {
    renderBody: function (q) {
      return '<div class="recite-box">' + esc(q.text || q.stem || "") + '</div>' +
        '<div class="rec-box" id="recBox">' +
        '<button class="btn" id="recBtn" type="button">🎤 录音</button>' +
        '<button class="btn ghost" id="playBtn" type="button" style="display:none">▶️ 回放</button>' +
        '<span class="rec-status" id="recStatus">读给爸爸妈妈听，再点下面的按钮自评～</span></div>';
    },
    bind: function (host, q, qz) {
      mountRecorder(host, q, function () {});
      var actions = host.querySelector("#qActions");
      var feedback = host.querySelector("#qFeedback");
      actions.innerHTML = '<button class="btn primary" id="okBtn">我说对了 ✓</button><button class="btn ghost" id="noBtn">再练练</button>';
      actions.querySelector("#okBtn").addEventListener("click", function () {
        feedback.innerHTML = '<div class="fb ok">🌟 真棒，记住啦！</div>';
        afterAnswer(true, q, qz, host, "已背诵");
      });
      actions.querySelector("#noBtn").addEventListener("click", function () {
        feedback.innerHTML = '<div class="fb bad">💡 多读几遍就记住啦～</div>';
        afterAnswer(false, q, qz, host, "未背诵");
      });

  });

  // write：看图/看情景说一句话（录音作答 + 可选辅助书写）
  // 一年级上不会写长句/拼音，以“说”为主；会写的字可写在辅助框里
  registerType("write", {
    renderBody: function (q) {
      return '<div class="rec-box" id="recBox">' +
        '<button class="btn" id="recBtn" type="button">🎤 按住说一句话</button>' +
        '<button class="btn ghost" id="playBtn" type="button" style="display:none">▶️ 回放</button>' +
        '<span class="rec-status" id="recStatus">看图/看情景，用一句话说出来～</span></div>' +
        '<details class="write-extra"><summary>我会写几个字，写在这里</summary>' +
        '<textarea class="q-textarea" id="ans" placeholder="会写的字可以写在这里（不会写用拼音）…"></textarea></details>';
    },
    bind: function (host, q, qz) {
      var recorded = false;
      mountRecorder(host, q, function () { recorded = true; });
      var actions = host.querySelector("#qActions");
      var feedback = host.querySelector("#qFeedback");
      actions.innerHTML = '<button class="btn primary" id="submitBtn">我说好了</button>';
      actions.querySelector("#submitBtn").addEventListener("click", function () {
        var inp = host.querySelector("#ans");
        var written = inp ? inp.value.trim() : "";
        if (!recorded && !written) { Pet.say("先点🎤录音说一句话，或者写几个字哦～", 2200); return; }
        var note = recorded ? "🎤 已录音" : "";
        if (written) note += (note ? "，" : "") + "✏️ 写了：" + written;
        feedback.innerHTML = '<div class="fb ok">✏️ 说得好！请爸爸妈妈听听你说了什么～<br><span class="an">' + esc(note) + '</span></div>';
        afterAnswer(true, q, qz, host, note || "已口头作答");
      });
    }
  });

  // 兜底：任何未注册题型都不白屏，给一个文本输入
  registerType("__default", {
    renderBody: function (q) { return qInput('type="text" placeholder="写下你的答案…"'); },
    bind: function (host, q, qz) { bindText(host, q, qz); }
  });

  function questionHTML(q, qz) {
    var voiceBtn = (q.audio && q.audio.stem) ? '<button type="button" class="speak-btn q-voice-stem">🔊 读题目</button>' : '';
    var h = '<div class="q-stem">' + esc(q.stem) + voiceBtn + '</div>';
    if (q.image) h += '<div class="q-img"><img src="' + esc(q.image) + '" alt="" loading="lazy"></div>';
    var t = QUESTION_TYPES[q.type] || QUESTION_TYPES.__default;
    h += t.renderBody(q, qz);
    return h;
  }

  function bindQuestion(host, q, qz) {
    var stemBtn = host.querySelector(".q-voice-stem");
    if (stemBtn) {
      stemBtn.addEventListener("click", function () { speak(stemBtn, q.stem, q.audio ? q.audio.stem : null); });
    }
    var t = QUESTION_TYPES[q.type] || QUESTION_TYPES.__default;
    t.bind(host, q, qz);
  }

  function afterAnswer(correct, q, qz, host, userAns) {
    S.recordAttempt(q.id, qz.ctx.unitId, qz.ctx.module, qz.ctx.level, userAns != null ? userAns : (correct ? "对" : "错"), correct);
    var feedback = host.querySelector("#qFeedback");
    var fbVoice = (q.audio) ? ' <button type="button" class="speak-btn q-voice-fb">🔊 读解析</button>' : '';
    if (correct) {
      qz.correct += 1;
      feedback.innerHTML = '<div class="fb ok">✅ 答对啦！' + fbVoice + '<br><span class="an">' + esc(q.analysis) + '</span></div>';
      Pet.say(pickEncourage(), 2000);
    } else {
      feedback.innerHTML = '<div class="fb bad">❌ 再想想～<br><b>正确答案：</b>' + esc(q.answer) +
        fbVoice + '<br><span class="an">' + esc(q.analysis) + '</span></div>';
      Pet.say("没关系，看看解析，下次一定行！", 2400);
    }
    var fbBtn = feedback.querySelector(".q-voice-fb");
    if (fbBtn) {
      fbBtn.addEventListener("click", function () {
        speakGroup(fbBtn, [
          { text: "正确答案：" + q.answer, key: q.audio ? q.audio.answer : null },
          { text: q.analysis, key: q.audio ? q.audio.analysis : null }
        ]);
      });
    }
    var actions = host.querySelector("#qActions");
    actions.innerHTML = '<button class="btn primary" id="nextBtn">' + (qz.idx + 1 >= qz.qs.length ? "看结果 🎉" : "下一题 →") + '</button>';
    actions.querySelector("#nextBtn").addEventListener("click", function () {
      qz.idx += 1;
      if (qz.idx >= qz.qs.length) { qz.finished = true; }
      renderQuiz(host);
    });
    updateMistakeCount();
  }

  function renderQuizResult(host) {
    var qz = App.quiz;
    var total = qz.qs.length;
    var acc = total > 0 ? qz.correct / total : 0;
    var thr = S.thresholdFor(BOOK.meta.grade);
    var html = '<div class="quiz-result">' +
      '<div class="result-emoji">' + (acc >= thr ? "🎉" : acc >= 0.7 ? "💪" : "🌱") + '</div>' +
      '<h2>本次 ' + esc(qz.ctx.title) + '</h2>' +
      '<div class="result-ring" style="--p:' + Math.round(acc * 100) + '"><span>' + Math.round(acc * 100) + '%</span></div>' +
      '<p>答对 ' + qz.correct + ' / ' + total + ' 题</p>';

    if (qz.ctx.module === "每日练习" && qz.ctx.level) {
      var passed = S.markLevelSession(BOOK, qz.ctx.unitId, qz.ctx.level, acc);
      if (passed) {
        var nextLv = qz.ctx.level === "基础" ? "提高" : (qz.ctx.level === "提高" ? "拓展" : null);
        html += '<p class="unlock-ok">🎯 本阶已达标！' + (nextLv ? '已解锁「' + nextLv + '」阶～' : '已是最高阶！') + '</p>';
        if (nextLv && S.awardBadge("lvl_" + qz.ctx.unitId + "_" + qz.ctx.level, "过关·" + qz.ctx.level, "⭐")) {
          html += '<p class="badge-get">获得徽章 ⭐ 过关·' + esc(qz.ctx.level) + '</p>';
        }
        toast("🎯 本阶达标！宠物收到 +1 食物，去小屋看看 →");
      } else {
        html += '<p class="unlock-no">还需努力：本阶正确率需达到 ' + Math.round(thr * 100) + '% 才解锁下一阶（本次 ' + Math.round(acc * 100) + '%）。</p>';
        toast("差一点点，再练练基础就能解锁下一阶～");
      }
      S.markDaily("daily_" + qz.ctx.unitId);
    }
    if (qz.ctx.module === "单元测") {
      if (acc >= thr) {
        if (S.awardBadge("ut_" + qz.ctx.unitId, "单元测过关", "🏆")) {
          html += '<p class="badge-get">获得徽章 🏆 单元测过关</p>';
        }
        toast("🏆 单元测过关！宠物收到 +1 食物，去小屋看看 →");
      } else {
        toast("单元测再复习一下，下次拿满分～");
      }
      S.markDaily("unit_test_" + qz.ctx.unitId);
    }
    // 宠物联动展示（一目了然：完成学习→为宠物+1 食物）
    html += '<div class="pet-link"><span>📚 本次学习已为宠物送去 <b>+1 食物</b></span>' +
      '<button class="btn primary" id="goPetBtn" style="margin-left:8px;">🐾 去宠物小屋看看</button></div>';
    html += '<div class="result-actions"><button class="btn" id="againBtn">再做一次</button>' +
      '<button class="btn ghost" id="backBtn">返回</button></div></div>';
    host.innerHTML = html;
    host.querySelector("#againBtn").addEventListener("click", function () { startQuiz(host, qz.qs, qz.ctx); });
    host.querySelector("#backBtn").addEventListener("click", function () {
      if (App.view.page === "mistakes") renderMistakes();
      else renderSubject();
    });
    host.querySelector("#goPetBtn").addEventListener("click", function () { navigate({ page: "pet" }); });
    notifyPetStudy(2);  // 一轮学习完成 → 通知宠物系统（每轮 +2 食物）
  }

  /* ----------------------------- 学情看板 ----------------------------- */
  function renderProgress() {
    var overall = S.overallAccuracy(BOOK);
    var html = '<section class="page progress"><h2>📊 学情看板（' + esc(App.view.subject) + '·' + esc(App.view.semester) + '）</h2>' +
      '<p class="progress-tip">每个单元的颜色只由「基础题」正确率决定：基础题答对 ≥95% 即“已掌握”。</p>' +
      '<div class="ov-card"><div class="ring big" style="--p:' + Math.round(overall * 100) + '"><span>' + Math.round(overall * 100) + '%</span></div>' +
      '<div><p>总正确率</p><p class="sub">错题本待巩固：' + S.mistakeCount() + ' 题</p>' +
      '<p class="legend"><span class="dot green"></span>已掌握≥95%　<span class="dot yellow"></span>待巩固70-95%　<span class="dot red"></span>薄弱&lt;70%</p></div></div>' +
      '<div class="unit-bars">';
    BOOK.toc.forEach(function (t) {
      var uid = findUnitsByTocId(t.id);
      var acc = S.unitAccuracy(BOOK, uid);
      var pct = acc.answered ? Math.round(acc.accuracy * 100) : 0;
      var label = acc.answered ? ({ green: "已掌握", yellow: "待巩固", red: "薄弱" }[acc.color]) : "未开始";
      html += '<div class="ubar-row"><span class="ubar-name">' + esc(t.title) + '</span>' +
        '<span class="ubar-track"><span class="ubar-fill ' + (acc.answered ? acc.color : "none") + '" style="width:' + pct + '%"></span></span>' +
        '<span class="ubar-pct">' + (acc.answered ? pct + '% · ' + label : "—") + '</span></div>';
    });
    html += '</div>';
    var badges = S.state().pet.badges;
    html += '<h3>🏅 徽章墙</h3><div class="badge-wall">';
    if (!badges.length) html += '<p class="sub">还没获得徽章，去练习解锁吧！</p>';
    badges.forEach(function (b) { html += '<span class="badge-item">' + esc(b.icon) + ' ' + esc(b.title) + '</span>'; });
    html += '</div></section>';
    mainEl.innerHTML = html;
  }

  /* ----------------------------- 错题本 ----------------------------- */
  function renderMistakes() {
    var ms = S.getMistakes();
    var html = '<section class="page mistakes"><h2>📕 错题本</h2>';
    if (!ms.length) {
      html += '<div class="empty">🎉 暂时没有错题，继续保持！</div>';
      mainEl.innerHTML = html; return;
    }
    html += '<p class="sub">共 ' + ms.length + ' 道待巩固。点“重做”再练一次，做对即移除。</p><div id="mmBody"></div></section>';
    mainEl.innerHTML = html;
    renderMistakeList(document.getElementById("mmBody"), ms);
  }

  function renderMistakeList(host, ms) {
    var html = '<div class="mm-list">';
    ms.forEach(function (m, idx) {
      var unit = unitById(m.unitId);
      var q = findQuestion(m.qid, unit);
      if (!q) return;
      var voiceBtn = (q.audio) ? '<button type="button" class="speak-btn mm-voice" data-i="' + idx + '">🔊 读一听</button>' : '';
      html += '<div class="mm-card" data-qid="' + esc(m.qid) + '">' +
        '<div class="mm-meta"><span class="tag">' + esc(unit ? unit.unit : m.unitId) + '</span>' +
        '<span class="tag gray">' + esc(m.module) + (m.level ? "·" + esc(m.level) : "") + '</span></div>' +
        '<div class="mm-stem">' + esc(q.stem) + voiceBtn + '</div>' +
        (q.image ? '<div class="mm-img"><img src="' + esc(q.image) + '" alt=""></div>' : '') +
        '<div class="mm-ans"><span class="bad">你的：' + esc(m.userAnswer || "（未答）") + '</span>　<span class="good">正确：' + esc(q.answer) + '</span></div>' +
        '<div class="mm-an">' + esc(q.analysis) + '</div>' +
        '<button class="btn small redo" data-qid="' + esc(m.qid) + '">重做</button>' +
        '</div>';
    });
    html += '</div>';
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll(".redo"), function (b) {
      b.addEventListener("click", function () { redoOne(b.getAttribute("data-qid")); });
    });
    Array.prototype.forEach.call(host.querySelectorAll(".mm-voice"), function (btn) {
      btn.addEventListener("click", function () {
        var m = ms[parseInt(btn.getAttribute("data-i"), 10)];
        var unit = unitById(m.unitId);
        var q = findQuestion(m.qid, unit);
        if (!q || !q.audio) return;
        speakGroup(btn, [
          { text: q.stem, key: q.audio.stem },
          { text: "正确答案：" + q.answer, key: q.audio.answer },
          { text: q.analysis, key: q.audio.analysis }
        ]);
      });
    });
  }

  function findQuestion(qid, unit) {
    if (!unit) return null;
    var all = [];
    ["基础", "提高", "拓展"].forEach(function (lv) { (unit.daily[lv] || []).forEach(function (q) { all.push(q); }); });
    (unit.unit_test || []).forEach(function (q) { all.push(q); });
    return all.filter(function (q) { return q.id === qid; })[0] || null;
  }

  function redoOne(qid) {
    var found = null, fu = null;
    for (var i = 0; i < BOOK.units.length; i++) {
      var q = findQuestion(qid, BOOK.units[i]);
      if (q) { found = q; fu = BOOK.units[i]; break; }
    }
    if (!found) return;
    var host = document.getElementById("mmBody");
    startQuiz(host, [found], { unitId: fu.unit_id, module: "错题本", level: null, title: "错题重做" });
    setTimeout(function () {
      var back = document.getElementById("backBtn");
      if (back) back.addEventListener("click", function () { renderMistakes(); updateMistakeCount(); });
    }, 0);
  }

  /* ----------------------------- 宠物页 ----------------------------- */
  function renderPetPage() {
    mainEl.innerHTML =
      '<section class="page pet-page" style="padding:0;max-width:none;">' +
        '<iframe id="petFrame" src="pet_v2_preview.html" ' +
        'style="width:100%;height:calc(100vh - 120px);border:none;border-radius:16px;background:#fff5ee;display:block;"></iframe>' +
      '</section>';
  }

  /* ----------------------------- 杂项 ----------------------------- */
  function emptyHint(t) { return '<div class="empty">' + esc(t) + '</div>'; }
  function updateMistakeCount() {
    var mc = document.getElementById("mcCount");
    if (mc) mc.textContent = S.mistakeCount();
  }
  function pickEncourage() {
    var arr = ["真棒！", "对的，就是这样！", "你越来越厉害了～", "答对啦，给你点赞！", "继续保持哦！"];
    return arr[Math.floor(Math.random() * arr.length)];
  }
  // 学习完成 → 通知新宠物系统（写共享 localStorage，宠物小屋启动时结算）
  function notifyPetStudy(n) {
    try {
      var key = "pet_study_pending";
      var cur = parseInt(localStorage.getItem(key) || "0", 10);
      localStorage.setItem(key, String(cur + (n || 1)));
    } catch (e) {}
  }
  function greet(tick) {
    if (tick.absentDays >= 2) Pet.say("好久没见你啦，今天来玩" + App.view.subject + "吧！(´•︵•`)", 3600);
    else if (tick.mood === "hungry") Pet.say("我有点饿啦，点右下角 🍚 喂我一下嘛～", 3200);
    else Pet.say("嗨！我们一起学" + App.view.subject + "吧～(✿◡‿◡)", 3000);
  }

  /* ----------------------------- 名字输入 ----------------------------- */
  function showNameModal() {
    var modal = document.getElementById("nameModal");
    var input = document.getElementById("nameInput");
    var save = document.getElementById("nameSaveBtn");
    modal.style.display = "flex";
    input.focus();
    function doSave() {
      var v = input.value.trim();
      if (!v) { input.classList.add("shake"); setTimeout(function(){ input.classList.remove("shake"); }, 500); return; }
      S.state().userName = v;
      S.save();
      modal.style.display = "none";
      render();
      greet(S.petTick());
    }
    save.addEventListener("click", doSave);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") doSave(); });
  }

  /* ----------------------------- 图片点击放大 ----------------------------- */
  function setupImageZoom() {
    document.addEventListener("click", function (e) {
      var t = e.target;
      if (t.tagName === "IMG" && (t.closest(".q-img") || t.closest(".kp-img") || t.closest(".mm-img"))) {
        var box = document.createElement("div");
        box.className = "lightbox";
        box.innerHTML = '<img src="' + esc(t.src) + '" alt="">';
        document.body.appendChild(box);
        box.addEventListener("click", function () { box.remove(); });
      }
    });
  }

  /* ----------------------------- 启动 ----------------------------- */
  function init() {
    buildLayout();
    // 删掉右下角旧 SVG 猫挂件（用户已在新宠物小屋选了自己喜欢的宠物，不显示旧"小喵"）
    if (petHostEl && petHostEl.parentNode) petHostEl.parentNode.removeChild(petHostEl);
    setupImageZoom();
    setBook(); // 首次进入即确定当前册数据
    if (!S.state().userName) {
      renderSubjectNav();
      showNameModal();
    } else {
      render();
      var tick = S.petTick();
      greet(tick);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  window.App = App;
})();

</script></script>
</body>
</html>
