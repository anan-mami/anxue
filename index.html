<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>青岛版一年级学习台</title>
  <style>
/* =========================================================================
 * style.css —— 学习台样式（学习宝藏 dashboard + 科导航 + 模块导航）
 * ========================================================================= */

:root {
  --bg: #f3f7fb;
  --card: #ffffff;
  --text: #2c3e50;
  --muted: #6b7c93;
  --primary: #4a90e2;
  --primary-dark: #357abd;
  --accent: #ff9f43;
  --success: #2ecc71;
  --warn: #f1c40f;
  --danger: #e74c3c;
  --shadow: 0 4px 18px rgba(44, 62, 80, 0.08);
  --radius: 16px;
  --sidebar-w: 96px;
  --topbar-h: 60px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ----------------------------- 名字输入弹窗 ----------------------------- */
.modal {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(44, 62, 80, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-card {
  background: var(--card); border-radius: var(--radius); padding: 32px 28px;
  text-align: center; width: 100%; max-width: 360px; box-shadow: var(--shadow);
}
.modal-emoji { font-size: 56px; margin-bottom: 8px; }
.modal-card h2 { margin: 0 0 8px; font-size: 22px; }
.modal-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.modal-card input {
  width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #dde6f0;
  border-radius: 12px; margin-bottom: 16px; outline: none;
}
.modal-card input:focus { border-color: var(--primary); }
.modal-card .btn { width: 100%; }

/* ----------------------------- 顶部栏 ----------------------------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  background: var(--card); box-shadow: 0 2px 10px rgba(44,62,80,0.06);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 100;
}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; flex: 1; }
.topbar-right { justify-content: flex-end; }
.topbar-center {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 18px; font-weight: 700; color: var(--primary);
}
.brand-logo { font-size: 24px; }
.semester-select {
  padding: 8px 12px; border: 2px solid #dde6f0; border-radius: 10px;
  background: #fff; font-size: 14px; color: var(--text); outline: none;
}
.tbtn {
  padding: 8px 12px; border: none; border-radius: 10px;
  background: #eef4fb; color: var(--text); font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.tbtn:hover { background: #e1ebf7; }
.tbtn.ghost { background: transparent; }
.badge-count {
  background: var(--danger); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ----------------------------- 整体布局 ----------------------------- */
.layout {
  display: flex; min-height: 100vh;
  padding-top: var(--topbar-h);
}
.subject-nav {
  position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
  width: var(--sidebar-w); background: var(--card);
  border-right: 1px solid #e8eef5; padding: 12px 8px;
  display: flex; flex-direction: column; gap: 8px; z-index: 90;
}
.main {
  flex: 1; margin-left: var(--sidebar-w); padding: 20px;
  min-height: calc(100vh - var(--topbar-h));
}

/* ----------------------------- 左侧科导航 ----------------------------- */
.sub-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 4px; border: none; border-radius: 14px;
  background: transparent; color: var(--text); cursor: pointer;
  position: relative; transition: background .15s;
}
.sub-item:hover { background: #f1f6fc; }
.sub-item.active { background: var(--primary); color: #fff; }
.sub-item.disabled { color: var(--muted); opacity: .7; cursor: not-allowed; }
.sub-icon { font-size: 24px; }
.sub-name { font-size: 13px; }
.sub-badge {
  position: absolute; top: 6px; right: 6px;
  background: #cbd5e1; color: #fff; font-size: 10px;
  padding: 1px 5px; border-radius: 8px;
}

/* ----------------------------- 页面通用 ----------------------------- */
.page { max-width: 960px; margin: 0 auto; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
h2 { margin: 0 0 16px; font-size: 22px; }
.empty {
  background: var(--card); border-radius: var(--radius); padding: 48px 24px;
  text-align: center; color: var(--muted); box-shadow: var(--shadow);
}

/* ----------------------------- Dashboard ----------------------------- */
.hero {
  background: linear-gradient(135deg, #e3f2fd 0%, #f0f7ff 100%);
  border-radius: var(--radius); padding: 24px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.hero-text h1 { margin: 0 0 8px; font-size: 24px; }
.hero-text p { margin: 0; color: var(--muted); }
.hero-stat { text-align: center; }
.ring {
  width: 84px; height: 84px; border-radius: 50%;
  background: conic-gradient(var(--success) calc(var(--p, 0) * 1%), #e0e7ef 0);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.ring::after {
  content: ""; width: 66px; height: 66px; border-radius: 50%; background: #fff;
  position: absolute;
}
.ring span { position: relative; z-index: 1; font-weight: 700; font-size: 16px; }
.ring.big { width: 120px; height: 120px; }
.ring.big::after { width: 92px; height: 92px; }
.ring.big span { font-size: 22px; }
.hero-stat label { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }

.dashboard-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px;
}
.dash-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.dash-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(44,62,80,0.12); }
.dash-icon { font-size: 36px; margin-bottom: 8px; }
.dash-card h3 { margin: 0 0 4px; font-size: 17px; }
.dash-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; min-height: 38px; }
.dash-bars { display: flex; flex-direction: column; gap: 8px; }
.dash-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.dash-bar-name { width: 56px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash-bar-track { flex: 1; height: 8px; background: #e8eef5; border-radius: 4px; overflow: hidden; }
.dash-bar-fill { display: block; height: 100%; border-radius: 4px; }
.dash-bar-fill.green { background: var(--success); }
.dash-bar-fill.yellow { background: var(--warn); }
.dash-bar-fill.red { background: var(--danger); }
.dash-bar-fill.none { background: #cbd5e1; }
.quick-start { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.quick-start h3 { margin: 0 0 12px; font-size: 16px; }

/* ----------------------------- Subject 模块导航 ----------------------------- */
.subject-head { margin-bottom: 12px; }
.subject-head h2 { font-size: 20px; color: var(--primary-dark); }
.module-nav {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  background: var(--card); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.mod-wrap {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 12px; border: 2px solid transparent;
}
.mod-wrap.active { background: #eaf3fd; border-color: var(--primary); }
.mod-btn {
  border: none; background: transparent; font-size: 15px; font-weight: 600;
  color: var(--text); cursor: pointer; padding: 4px 6px;
}
.mod-wrap.active .mod-btn { color: var(--primary); }
.unit-select {
  padding: 6px 8px; border: 1px solid #dde6f0; border-radius: 8px;
  background: #fff; font-size: 13px; color: var(--text); outline: none; max-width: 180px;
}

/* ----------------------------- 知识点 / 易错点 ----------------------------- */
.kp-list, .ep-list { display: flex; flex-direction: column; gap: 14px; }
.kp-card, .ep-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); display: flex; gap: 16px;
}
.kp-img { flex: 0 0 260px; }
.kp-img img {
  width: 100%; border-radius: 12px; border: 1px solid #e8eef5;
  cursor: zoom-in; transition: transform .2s ease;
}
.kp-img img:hover { transform: scale(1.02); }
.kp-body h3 { margin: 0 0 8px; font-size: 18px; }
.kp-explain { margin: 0 0 8px; color: var(--text); }
.kp-key { margin: 0; color: var(--primary); font-size: 14px; }
.ep-icon { font-size: 28px; }
.ep-card h3 { margin: 0 0 6px; font-size: 17px; }
.ep-card p { margin: 0; color: var(--muted); font-size: 14px; }

/* ----------------------------- 每日练习 ----------------------------- */
.daily-intro {
  background: #fff8e6; border-left: 4px solid var(--accent); padding: 10px 14px;
  border-radius: 10px; margin-bottom: 14px; font-size: 14px;
}
.lvtabs { display: flex; gap: 10px; margin-bottom: 16px; }
.lvtab {
  padding: 10px 18px; border-radius: 24px; border: 2px solid #dde6f0;
  background: #fff; color: var(--text); font-size: 15px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.lvtab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.lvtab.locked { opacity: .6; }
.lock { font-size: 13px; }
.lvl-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.lvl-tag.pass { background: #d4f8e4; color: #1e8449; }
.lvl-tag.fail { background: #fdebd0; color: #9c640c; }

/* ----------------------------- 练习引擎 ----------------------------- */
.quiz { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.quiz-progress { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.q-card { margin-bottom: 16px; }
.q-stem { font-size: 20px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
.q-img { margin-bottom: 16px; }
.q-img img {
  display: block; max-width: 100%; max-height: 520px;
  width: auto; margin: 0 auto;
  border-radius: 12px; border: 1px solid #e8eef5;
  object-fit: contain; cursor: zoom-in;
  transition: transform .2s ease;
}
.q-img img:hover { transform: scale(1.02); }
.q-options { display: flex; flex-direction: column; gap: 10px; }
/* 大按钮选择题/判断题，适合一年级点选 */
.q-options.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.opt-btn {
  padding: 16px 14px; border: 2px solid #e8eef5; border-radius: 14px;
  cursor: pointer; background: #fafbfc; font-size: 18px; text-align: center;
  transition: all .15s ease;
}
.opt-btn:hover { border-color: var(--primary); background: #f0f7ff; }
.opt-btn.selected {
  border-color: var(--primary); background: var(--primary); color: #fff;
  box-shadow: 0 4px 12px rgba(74,144,226,.28);
}
.q-input {
  width: 100%; padding: 14px; font-size: 24px; text-align: center;
  border: 2px solid #dde6f0; border-radius: 12px; outline: none;
}
.q-input:focus { border-color: var(--primary); }
.q-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
.q-feedback { min-height: 60px; }
.fb { padding: 14px; border-radius: 12px; font-size: 15px; }
.fb.ok { background: #e8f8f0; color: #1e8449; }
.fb.bad { background: #fdedec; color: #c0392b; }
.an { color: var(--muted); display: block; margin-top: 6px; }
.chip {
  display: inline-block; padding: 8px 14px; background: #eef4fb;
  border-radius: 20px; margin: 4px; font-size: 15px;
}
.match-tip { color: var(--muted); font-size: 14px; }

/* ----------------------------- 按钮 ----------------------------- */
.btn {
  padding: 12px 22px; border: none; border-radius: 24px;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: filter .15s;
}
.btn:hover { filter: brightness(1.05); }
.btn.primary { background: var(--primary); }
.btn.ghost { background: #eef4fb; color: var(--text); }
.btn.warn { background: var(--danger); }
.btn.small { padding: 8px 16px; font-size: 14px; }

/* ----------------------------- 结果页 ----------------------------- */
.quiz-result { text-align: center; padding: 24px; }
.result-emoji { font-size: 56px; margin-bottom: 8px; }
.result-ring { margin: 16px auto; }
.unlock-ok { color: var(--success); font-weight: 600; }
.unlock-no { color: var(--danger); }
.badge-get { color: var(--accent); font-weight: 700; }
.result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }

/* ----------------------------- 学情看板 ----------------------------- */
.progress-tip {
  background: #e8f8f0; color: #1e8449; padding: 10px 14px;
  border-radius: 10px; margin-bottom: 14px; font-size: 14px;
}
.ov-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
}
.ov-card .sub { color: var(--muted); font-size: 14px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 10px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
.dot.green { background: var(--success); }
.dot.yellow { background: var(--warn); }
.dot.red { background: var(--danger); }
.dot.none { background: #cbd5e1; }
.unit-bars { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.ubar-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
.ubar-row:last-child { border-bottom: none; }
.ubar-name { width: 160px; font-size: 14px; }
.ubar-track { flex: 1; height: 10px; background: #e8eef5; border-radius: 5px; overflow: hidden; }
.ubar-fill { display: block; height: 100%; border-radius: 5px; }
.ubar-fill.green { background: var(--success); }
.ubar-fill.yellow { background: var(--warn); }
.ubar-fill.red { background: var(--danger); }
.ubar-pct { width: 90px; text-align: right; font-size: 13px; color: var(--muted); }
.badge-wall { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.badge-item {
  background: #fff8e6; color: #8a5a1a; padding: 8px 14px;
  border-radius: 20px; font-size: 14px;
}

/* ----------------------------- 错题本 ----------------------------- */
.mm-list { display: flex; flex-direction: column; gap: 14px; }
.mm-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow);
}
.mm-meta { display: flex; gap: 8px; margin-bottom: 10px; }
.tag {
  background: #eef4fb; color: var(--primary); padding: 4px 10px;
  border-radius: 12px; font-size: 12px;
}
.tag.gray { background: #f1f5f9; color: var(--muted); }
.mm-stem { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.mm-img img { max-width: 220px; border-radius: 10px; }
.mm-ans { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin: 10px 0; }
.mm-ans .bad { color: var(--danger); }
.mm-ans .good { color: var(--success); }
.mm-an { color: var(--muted); font-size: 14px; margin-bottom: 12px; }

/* ----------------------------- 宠物 ----------------------------- */
.pet-host {
  position: fixed; right: 18px; bottom: 18px; z-index: 80;
}
.pet-page .pet-card-big {
  background: var(--card); border-radius: var(--radius); padding: 28px;
  text-align: center; box-shadow: var(--shadow); margin-bottom: 20px;
}
.pet-avatar-big { font-size: 80px; }
.hunger-bar { height: 12px; background: #e8eef5; border-radius: 6px; overflow: hidden; margin: 12px 0 18px; }
.hunger-bar span { display: block; height: 100%; background: var(--success); transition: width .3s; }

/* ----------------------------- 宠物动画（由 pet.js 注入 SVG） ----------------------------- */
.pet { position: relative; text-align: center; }
.pet-name { font-size: 12px; color: var(--muted); margin-top: 4px; }
.pet-feed {
  position: absolute; top: -8px; right: -4px;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: #fff; box-shadow: var(--shadow); font-size: 16px; cursor: pointer;
}
.pet-svg { width: 90px; height: 90px; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
.pet-bubble {
  display: none; position: absolute; right: 96px; bottom: 20px;
  background: #fff; padding: 10px 14px; border-radius: 14px 14px 4px 14px;
  box-shadow: var(--shadow); font-size: 14px; white-space: nowrap;
  animation: popIn .3s ease;
}
.pet-bubble.show { display: block; }
@keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }

/* ----------------------------- 响应式 ----------------------------- */
@media (max-width: 760px) {
  :root { --sidebar-w: 64px; }
  .topbar-left { flex: 0; }
  .topbar-center { font-size: 15px; }
  .brand-title { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbtn span { display: none; }
  .sub-name { display: none; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .module-nav { overflow-x: auto; flex-wrap: nowrap; }
  .unit-select { max-width: 120px; }
  .kp-card { flex-direction: column; }
  .kp-img { flex: auto; }
  .ubar-name { width: 110px; }
}

@media (max-width: 480px) {
  body { font-size: 15px; }
  .main { padding: 14px; }
  .hero { flex-direction: column; align-items: flex-start; gap: 14px; }
  .q-stem { font-size: 18px; }
}

/* ----------------------------- 图片放大查看 ----------------------------- */
.lightbox {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,.88);
  display: flex; align-items: center; justify-content: center;
  padding: 40px; cursor: zoom-out;
}
.lightbox img {
  max-width: 100%; max-height: 100%;
  object-fit: contain; border-radius: 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

/* ----------------------------- 大屏适配（电脑全屏看清） ----------------------------- */
@media (min-width: 1200px) {
  :root { --sidebar-w: 110px; }
  body { font-size: 17px; }
  .page { max-width: 1100px; }
  .main { padding: 28px; }
  .hero-text h1 { font-size: 28px; }
  .q-stem { font-size: 22px; }
  .kp-img { flex: 0 0 320px; }
  .sub-icon { font-size: 28px; }
  .sub-name { font-size: 14px; }
  .dashboard-grid { grid-template-columns: repeat(3, 1fr); gap: 22px; }
}

@media (min-width: 1600px) {
  body { font-size: 18px; }
  .page { max-width: 1280px; }
  .q-stem { font-size: 24px; }
  .kp-img { flex: 0 0 380px; }
  .opt-btn { font-size: 20px; padding: 18px 16px; }
}

/* ----------------------------- 打印 ----------------------------- */
@media print {
  .topbar, .subject-nav, .pet-host, .module-nav, .q-actions, .q-feedback, .overlay, .daily-intro, .lvtabs { display: none !important; }
  .main { margin-left: 0; padding: 0; }
  .quiz, .q-card { box-shadow: none; padding: 0; }
  .q-options { display: block; }
  .opt-btn { border: none; padding: 6px 0; text-align: left; background: transparent; }
  .opt-btn.selected { color: #000; background: transparent; box-shadow: none; }
}

/* ----------------------------- 期中/期末 多套试卷 + 试卷文档视图 ----------------------------- */
.test-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
.test-head h2 { margin: 0; font-size: 20px; }
.paper-tabs { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
.ptab { border: 1px solid var(--line, #e3e8ef); background: #fff; color: #3a4a5a;
  border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
.ptab.active { background: #4f8cff; color: #fff; border-color: #4f8cff; }
.test-tools { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.test-tools .btn { padding: 6px 12px; font-size: 13px; }
.paper-doc { background: #fff; border: 1px solid var(--line, #e3e8ef); border-radius: 10px;
  padding: 22px 26px; line-height: 1.9; font-size: 15px; color: #222;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02); }
.paper-doc .sect { font-weight: 700; margin: 14px 0 6px; font-size: 16px; color: #2a6db0; }
.paper-doc .ln { margin: 2px 0; }
.paper-doc .pgap { height: 6px; }
.paper-doc .empty { color: #999; font-style: italic; padding: 18px; text-align: center; }
.answer-doc { margin-top: 18px; border-top: 2px dashed #c8c8c8; }

/* ---- 真人音朗读按钮 ---- */
.kp-head, .ep-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kp-head h3, .ep-head h3 { margin: 0; }
.speak-btn {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 4px;

nalysis":"从起点向前数5格，正好到小猴卡片。","image":"assets/images/img_ccc4fcdb6245.jpg","audio":{"stem":"m1a_math1a_theme1_theme1_q6_stem","answer":"m1a_math1a_theme1_theme1_q6_answer","analysis":"m1a_math1a_theme1_theme1_q6_analysis"}}],"error_prone":[{"id":"ce_theme1_1","title":"比高矮要站在同一地面","desc":"一个站台阶、一个站平地来比高矮是不公平的，结果不准。比高矮时，两个人要站在同一平面上再比。","image":"assets/images/img_4866efeb1db0.jpg","audio":{"title":"m1a_math1a_theme1_ce_theme1_1_title","desc":"m1a_math1a_theme1_ce_theme1_1_desc"}},{"id":"ce_theme1_2","title":"排队“第几”要先说清从哪边数","desc":"从前面数和从后面数，“第3”不是同一个人。数第几时一定要先说清是从哪边开始数。","image":"assets/images/img_869df8d71d05.jpg","audio":{"title":"m1a_math1a_theme1_ce_theme1_2_title","desc":"m1a_math1a_theme1_ce_theme1_2_desc"}},{"id":"ce_theme1_3","title":"套圈得分：黑棋2分、白棋1分","desc":"容易把分数记反，写成白棋2分。记住：黑棋得2分、白棋得1分，再把几次得分加起来比大小。","image":null,"audio":{"title":"m1a_math1a_theme1_ce_theme1_3_title","desc":"m1a_math1a_theme1_ce_theme1_3_desc"}},{"id":"ce_theme1_4","title":"球印不出图形","desc":"球没有平平的面，滚来滚去印不出图形。只有圆柱、正方体、长方体等“有平的面”的积木，才能印出对应的平面图形。","image":"assets/images/img_fdee8f6a1c70.jpg","audio":{"title":"m1a_math1a_theme1_ce_theme1_4_title","desc":"m1a_math1a_theme1_ce_theme1_4_desc"}}],"mid_test":[],"final_test":[]},{"unit_id":"math1a_u1","unit":"第一单元 快乐的课堂——1~5数的认识和加减法","image":"assets/images/img_e3df0c5c2ee6.jpg","knowledge_points":[{"id":"kp_u1_1","title":"认识1~5各数","image":"assets/images/img_e3df0c5c2ee6.jpg","explain":"打开学习用品箱和体育用品箱看一看，里面有什么？各有几个？学习用品箱里有1把剪刀、2个转笔刀、3个夹子、4块橡皮、5支铅笔；体育用品箱里有3个毽子、4个羽毛球……用圆点表示数量，1个圆点对应数字1，2个圆点对应数字2，一直对应到5。数物体时要一个一个地数，数到几就表示有几个。","key":"数物体时一个一个地数，数到几就是几个；1~5各数用相应个数的圆点表示。","audio":{"title":"m1a_math1a_u1_kp_u1_1_title","explain":"m1a_math1a_u1_kp_u1_1_explain","key":"m1a_math1a_u1_kp_u1_1_key"}},{"id":"kp_u1_2","title":"1~5的分与合","image":"assets/images/img_a5fac4343503.jpg","explain":"在计数器上拨一拨：1添上1是2，2添上1是3，3添上1是4，4添上1是5。这些数怎么写呢？照着样子写一写。5个圆点分成两部分，可以分成1和4、2和3、3和2、4和1；反过来，1和4合起来是5，2和3合起来也是5。想一想：4可以分成几和几？","key":"5可以分成1和4、2和3；两部分合起来就是原来的数。","audio":{"title":"m1a_math1a_u1_kp_u1_2_title","explain":"m1a_math1a_u1_kp_u1_2_explain","key":"m1a_math1a_u1_kp_u1_2_key"}},{"id":"kp_u1_3","title":"比大小、比多少和第几","image":"assets/images/img_3ba0a8f72d27.jpg","explain":"小朋友们在做游戏。一队有5人，一队有4人，5人比4人多，所以5大于4，写作5>4；4小于5，写作4<5。排队时还要注意“第几”：从前往后数，军军排第1，冬冬排第2，心心排第……“第几”说的是位置，“几个”说的是总数。","key":"数量多的数就大；排队要说清从哪边数第几；“第几”是位置，“几个”是总数。","audio":{"title":"m1a_math1a_u1_kp_u1_3_title","explain":"m1a_math1a_u1_kp_u1_3_explain","key":"m1a_math1a_u1_kp_u1_3_key"}},{"id":"kp_u1_4","title":"5以内的加法","image":"assets/images/img_48870e5007e3.jpg","explain":"乐乐折了3个纸风车，丽丽折了2个，两人一共折了几个？把3个和2个合起来，用算式表示就是3+2=5（个）。“+”叫加号，读作“3加2等于5”。还可以写成2+3=5。求一共有多少，把两个数合起来，用加法。","key":"求一共有多少，把两个数合起来，用加法。","audio":{"title":"m1a_math1a_u1_kp_u1_4_title","explain":"m1a_math1a_u1_kp_u1_4_explain","key":"m1a_math1a_u1_kp_u1_4_key"}},{"id":"kp_u1_5","title":"5以内的减法","image":"assets/images/img_fed3fccafc30.jpg","explain":"桌上一共有4个纸风车，拿走了2个，还剩几个？从4个里面去掉2个，用算式表示就是4-2=2（个）。“-”叫减号，读作“4减2等于2”。从总数里去掉一部分，求剩下多少，用减法。","key":"从总数里去掉一部分，求剩下多少，用减法。","audio":{"title":"m1a_math1a_u1_kp_u1_5_title","explain":"m1a_math1a_u1_kp_u1_5_explain","key":"m1a_math1a_u1_kp_u1_5_key"}}],"error_prone":[{"id":"ep_u1_1","title":"第几和几个不一样","desc":"「几个」表示一共有多少，「第几」表示排在哪个位置。看到队伍要先弄清问的是总数还是顺序，别把第3当成一共3人。","image":null,"audio":{"title":"m1a_math1a_u1_ep_u1_1_title","desc":"m1a_math1a_u1_ep_u1_1_desc"}},{"id":"ep_u1_2","title":"比大小先数清数量","desc":"比大小时要数清两组各有多少个，哪个数量多哪个数就大，不能只看着数字样子就下结论。","image":null,"audio":{"title":"m1a_math1a_u1_ep_u1_2_title","desc":"m1a_math1a_u1_ep_u1_2_desc"}},{"id":"ep_u1_3","title":"加法要把两部分合起来","desc":"列加法算式时，总数写在等号后面，是「两部分合起来」。别把其中一部分写在等号后面。","image":null,"audio":{"title":"m1a_math1a_u1_ep_u1_3_title","desc":"m1a_math1a_u1_ep_u1_3_desc"}},{"id":"ep_u1_4","title":"减法总数要在最前面","desc":"减法是从总数里去掉一些，所以算式最前面一定是总数。写成「去掉的数减剩下的数」就错了。","image":null,"audio":{"title":"m1a_math1a_u1_ep_u1_4_title","desc":"m1a_math1a_u1_ep_u1_4_desc"}}],"daily":{"基础":[{"id":"u1_b1","type":"choice","knowledge_point":"kp_u1_1","stem":"下面 p_u3_g2","title":"认识正方体","image":"assets/images/img_d4c3733f6134.jpg","explain":"这些物体的形状是正方体。正方体也有6个面，而且6个面都是大小一样的正方形。像魔方、骰子这样的东西就是正方体。摸一摸，正方体的每个面都是四四方方的。","key":"正方体四四方方，6个面都是大小一样的正方形。","audio":{"title":"m1a_math1a_u3_kp_u3_g2_title","explain":"m1a_math1a_u3_kp_u3_g2_explain","key":"m1a_math1a_u3_kp_u3_g2_key"}},{"id":"kp_u3_g3","title":"认识圆柱","image":"assets/images/img_8434ea5604c3.jpg","explain":"圆柱上下两个面是圆圆的、平平的，侧面是弯弯的。像罐头盒、水杯这样的东西接近圆柱。圆柱可以像柱子一样立着放稳，躺下来还能滚动。比一比，有的圆柱高、有的矮，有的粗、有的细。","key":"圆柱上下两面是圆，侧面弯弯的；能立着站稳，躺着能滚。","audio":{"title":"m1a_math1a_u3_kp_u3_g3_title","explain":"m1a_math1a_u3_kp_u3_g3_explain","key":"m1a_math1a_u3_kp_u3_g3_key"}},{"id":"kp_u3_g4","title":"认识球","image":"assets/images/img_321d022f19cc.jpg","explain":"球是圆圆的，没有平平的面。像皮球、足球、乒乓球这样圆圆的东西就是球。球放在地上会到处滚动，因为它的表面没有平的地方，放不稳。找一找，你身边哪些东西是球？","key":"球圆圆的，没有平平的面，会到处滚动。","audio":{"title":"m1a_math1a_u3_kp_u3_g4_title","explain":"m1a_math1a_u3_kp_u3_g4_explain","key":"m1a_math1a_u3_kp_u3_g4_key"}},{"id":"kp_u3_g5","title":"立体图形的分类","image":"assets/images/img_006127a6c56e.jpg","explain":"我们一起来搭一搭吧！用长方体、正方体、圆柱和球搭出喜欢的作品。搭好后分一分：可以按形状分成方方的一类（长方体、正方体）和圆圆的一类（圆柱、球）；也可以按能不能滚动来分。分类标准不同，结果也可能不同，但都要看清楚每种图形的特点。","key":"按形状或特点把立体图形分类。","audio":{"title":"m1a_math1a_u3_kp_u3_g5_title","explain":"m1a_math1a_u3_kp_u3_g5_explain","key":"m1a_math1a_u3_kp_u3_g5_key"}}],"error_prone":[{"id":"ep_u3_1","title":"圆柱躺着和立着不一样","desc":"圆柱躺着放容易滚动，立着放稳稳当当。判断能不能滚动时，要先看它是怎么放的。","image":null,"audio":{"title":"m1a_math1a_u3_ep_u3_1_title","desc":"m1a_math1a_u3_ep_u3_1_desc"}},{"id":"ep_u3_2","title":"长方体和正方体要分清","desc":"正方体6个面都是一样大的正方形；长方体6个面大都是长方形，面的大小不一定一样。","image":null,"audio":{"title":"m1a_math1a_u3_ep_u3_2_title","desc":"m1a_math1a_u3_ep_u3_2_desc"}},{"id":"ep_u3_3","title":"球没有平平的面","desc":"球是圆圆的，没有平平的面，所以放不稳、会滚动。不要把圆片或圆柱侧面错当成球。","image":null,"audio":{"title":"m1a_math1a_u3_ep_u3_3_title","desc":"m1a_math1a_u3_ep_u3_3_desc"}},{"id":"ep_u3_4","title":"数图形时要按顺序","desc":"数一堆立体图形时，可以一种一种地数，边数边做记号，避免重复或漏掉。","image":null,"audio":{"title":" _smart1_1_desc"}},{"id":"ep_smart1_2","title":"“第几”和“有几”要分清","desc":"“排第3”说明自己前面有2个人；“前面有3个人”是不包括自己。列式时要看清楚题目说的是哪种。","image":null,"audio":{"title":"m1a_math1a_smart1_ep_smart1_2_title","desc":"m1a_math1a_smart1_ep_smart1_2_desc"}},{"id":"ep_smart1_3","title":"画图时要标出重复位置","desc":"用画图法解决重叠问题时，要把从前往后数和从后往前数都标清楚，这样才能一眼看出谁被重复数了。","image":null,"audio":{"title":"m1a_math1a_smart1_ep_smart1_3_title","desc":"m1a_math1a_smart1_ep_smart1_3_desc"}}],"daily":{"基础":[{"id":"smart1_b1","type":"choice","knowledge_point":"kp_smart1_g1","stem":"从前往后数小红排第4，从后往前数小红排第2，这一队一共有几人？","options":["5人","6人","7人"],"answer":"5人","analysis":"4加2等于6，小红被数了两次，再减1，得到5人。","image":null,"audio":{"stem":"m1a_math1a_smart1_smart1_b1_stem","answer":"m1a_math1a_smart1_smart1_b1_answer","analysis":"m1a_math1a_smart1_smart1_b1_analysis"}},{"id":"smart1_b2","type":"fill","knowledge_point":"kp_smart1_g1","stem":"从前往后数小明排第5，从后往前数小明排第3，一共有（ ）人。","answer":"7","analysis":"5加3等于8，小明被数了两次，再减1，得到7人。","image":null,"audio":{"stem":"m1a_math1a_smart1_smart1_b2_stem","answer":"m1a_math1a_smart1_smart1_b2_answer","analysis":"m1a_math1a_smart1_smart1_b2_analysis"}},{"id":"smart1_b3","type":"choice","knowledge_point":"kp_smart1_g2","stem":"小华前面有3人，后面有2人，这一队一共有几人？","options":["5人","6人","7人"],"answer":"6人","analysis":"前面的3人加后面的2人，再加小华自己1人，得到6人。","image":null,"audio":{"stem":"m1a_math1a_smart1_smart1_b3_stem","answer":"m1a_math1a_smart1_smart1_b3_answer","analysis":"m1a_math1a_smart1_smart1_b3_analysis"}},{"id":"smart1_b4","type":"fill","knowledge_point":"kp_smart1_g2","stem":"小丽前面有4人，后面有3人，一共有（ ）人。","answer":"8","analysis":"4加3等于7，再加小丽自己1人，得到8人。","image":null,"audio":{"stem":"m1a_math1a_smart1_smart1_b4_stem","answer":"m1a_math1a_smart1_smart1_b4_answer","analysis":"m1a_math1a_smart1_smart1_b4_analysis"}},{"id":"smart1_b5","type":"choice","knowledge_point":"kp_smart1_g1","stem":"从前往后数小狗排第3，从后往前数小狗排第4，一共有几只小动物？","options":["6只","7只","8只"],"answer":"6只","analysis":"3加4等于7，小狗被数了两次，再减1，得到6只。","image":null,"audio":{"stem":"m1a_math1 alysis":"m1a_math1a_smart1_smart1_q7_analysis"}},{"id":"smart1_q8","type":"choice","knowledge_point":"kp_smart1_g2","stem":"小红前面有4人，后面有2人，小红排第几？","options":["第4","第5","第7"],"answer":"第5","analysis":"前面有4人，小红紧跟在后面，所以排第5。","image":null,"audio":{"stem":"m1a_math1a_smart1_smart1_q8_stem","answer":"m1a_math1a_smart1_smart1_q8_answer","analysis":"m1a_math1a_smart1_smart1_q8_analysis"}}],"mid_test":[],"final_test":[]},{"unit_id":"math1a_u4","unit":"第四单元 漂亮的粘贴画——11~20各数的认识","image":"assets/images/img_36fe45773143.jpg","knowledge_points":[{"id":"kp_u4_g1","title":"认识11~20各数","image":"assets/images/img_36fe45773143.jpg","explain":"漂亮的粘贴画——一起来数一数叶子！先10片10片地圈出来，再添上剩下的。10个一是1个十，1个十和1个一合起来是十一。在计数器上拨一拨：十位上拨1颗珠子表示1个十，个位上拨1颗表示1个一，合起来就是11。","key":"10个一是1个十；11里面有1个十和1个一。","audio":{"title":"m1a_math1a_u4_kp_u4_g1_title","explain":"m1a_math1a_u4_kp_u4_g1_explain","key":"m1a_math1a_u4_kp_u4_g1_key"}},{"id":"kp_u4_g2","title":"11~20的组成","image":"assets/images/img_eeaf7ba43ff9.jpg","explain":"接着往下数：11、12、13……19再添上1就是20。十几都是由1个十和几个一组成的，比如15里面有1个十和5个一。2个十是二十，写作20，读作二十。写数时从高位写起，先写十位再写个位。","key":"十几里面有1个十和几个一；20里面有2个十。","audio":{"title":"m1a_math1a_u4_kp_u4_g2_title","explain":"m1a_math1a_u4_kp_u4_g2_explain","key":"m1a_math1a_u4_kp_u4_g2_key"}},{"id":"kp_u4_g3","title":"11~20的读写","image":"assets/images/img_ac874b94a6e5.jpg","explain":"11~20各数都是两位数。写数时，十位写在左边，个位写在右边：十位是1就写1，个位是几就写几，比如十五写作15。读数也从高位读起，15读作十五。要注意不要把十位和个位写反。","key":"写数先写十位再写个位；十位是1、个位是几就是十几。","audio":{"title":"m1a_math1a_u4_kp_u4_g3_title","explain":"m1a_math1a_u4_kp_u4_g3_explain","key":"m1a_math1a_u4_kp_u4_g3_key"}},{"id":"kp_u4_g4","title":"11~20的比大小","image":"assets/images/img_b9cce15f9e16.jpg","explain":"比一比，14和16谁大？数一数：14、15、16，16大。因为14里面有1个十和4个一，16里面有1个十和6个一，6比4多，所以16大。在数尺上，右边的数总比左边的数大。11~20的数比大小，十位相同就比个位，个位大的数就大。","key":"十位相同比个位，个位大的数就大。","audio":{"title":"m1a_math1a_u4_kp_u4_g4_title","explain":"m1a_math1a_u4_kp_u4_g4_explain","key":"m1a_math1a_u4_kp_u4_g4_key"}},{"id":"kp_u4_g5","title":"10加几和十几减几","image":"assets/images 位不够减，就用破十法：从十位拿出1个十变成10个一，减去减数后，再把剩下的数和原来的几合起来。","audio":{"title":"m1b_math1b_u1_kp_u1_3_title","explain":"m1b_math1b_u1_kp_u1_3_explain","key":"m1b_math1b_u1_kp_u1_3_key"}},{"id":"kp_u1_4","title":"整理和复习","image":"assets/images/img_a6fce229d763.jpg","explain":"把十几减几的算式按规律排成表。横着看，被减数相同，减数越来越小，差越来越大；竖着看，减数相同，被减数越来越大，差也越来越大。找到规律，算得又对又快。","key":"减法算式有规律：减数不变，被减数多1，差也多1；被减数不变，减数少1，差就多1。","audio":{"title":"m1b_math1b_u1_kp_u1_4_title","explain":"m1b_math1b_u1_kp_u1_4_explain","key":"m1b_math1b_u1_kp_u1_4_key"}},{"id":"kp_u1_5","title":"我学会了吗","image":"assets/images/img_0e1ad1f152d6.jpg","explain":"用20以内的退位减法能解决生活中的问题：求男生有几人、还剩几只船、还剩几瓶饮料、一个数比另一个数多（少）几。计算时要注意从总数里去掉一部分，用减法。","key":"求剩余、求一部分、求谁比谁多几或少几，都用减法；计算时可以用破十法或想加算减。","audio":{"title":"m1b_math1b_u1_kp_u1_5_title","explain":"m1b_math1b_u1_kp_u1_5_explain","key":"m1b_math1b_u1_kp_u1_5_key"}}],"error_prone":[{"id":"ep_u1_1","title":"破十后别忘加","desc":"用破十法算15-9时，先算10-9=1，还要把1和个位上的5相加得6，不能只写1。","image":null,"audio":{"title":"m1b_math1b_u1_ep_u1_1_title","desc":"m1b_math1b_u1_ep_u1_1_desc"}},{"id":"ep_u1_2","title":"减法总数要在前","desc":"列减法算式时，总数要写在被减数的位置，去掉的数写在减数的位置，不能把两个数写反。","image":null,"audio":{"title":"m1b_math1b_u1_ep_u1_2_title","desc":"m1b_math1b_u1_ep_u1_2_desc"}},{"id":"ep_u1_3","title":"想加算减别用错加数","desc":"算13-8时，要想8加几等于13，因为8+5=13，所以13-8=5，不能想成8+13。","image":null,"audio":{"title":"m1b_math1b_u1_ep_u1_3_title","desc":"m1b_math1b_u1_ep_u1_3_desc"}},{"id":"ep_u1_4","title":"比多少要用减法","desc":"求“一个数比另一个数多几”或“少几”，要用大数减小数，不是把两个数相加。","image":null,"audio":{"title":"m1b_math1b_u1_ep_u1_4_title","desc":"m1b_math1b_u1_ep_u1_4_desc"}}],"daily":{"基础":[{"id":"u1_b1","type":"fill","knowledge_point":"kp_u1_1","stem":"13减9等于（ ）。","answer":"4","analysis":"13-9=4。","image":null,"audio":{"stem":"m1b_math1b_u1_u1_b1_stem","answer":"m1b_math1b_u1_u1_b1_answer","analysis":"m1b_math1b_u1_u1_b1_analysis"}},{"id":"u1_b2","type":"choice","knowledge_point":"kp_u1_1","stem":"15减9等于多少？","answer":"6","analysis":"15-9=6。","image":null,"options":["5","6 ,{"id":"kp_u4_3","title":"两位数减一位数退位","image":"assets/images/img_cfb12437a5b4.jpg","explain":"要栽30株花，还有9株没栽，已经栽了多少株？30-9=21。个位0减9不够减，从十位退1当10，10-9=1，再加上剩下的20，得21。24-8=16，把24分成10和14，10-8=2，2+14=16。","key":"两位数减一位数退位时，个位不够减，从十位退1当10，和个位合起来再减。","audio":{"title":"m1b_math1b_u4_kp_u4_3_title","explain":"m1b_math1b_u4_kp_u4_3_explain","key":"m1b_math1b_u4_kp_u4_3_key"}},{"id":"kp_u4_4","title":"解决问题：比多少","image":"assets/images/img_06fe298dbf78.jpg","explain":"二年级有10人，三年级比二年级多5人，三年级有多少人？一年级比三年级少多少人？求一个数比另一个数多几或少几，要用大数减小数。二年级10人，三年级15人，一年级比三年级少15-10=5人。","key":"求一个数比另一个数多几或少几，用减法：大数减小数。","audio":{"title":"m1b_math1b_u4_kp_u4_4_title","explain":"m1b_math1b_u4_kp_u4_4_explain","key":"m1b_math1b_u4_kp_u4_4_key"}},{"id":"kp_u4_5","title":"我学会了吗","image":"assets/images/img_a32f805465fc.jpg","explain":"本单元学会了口算两位数加减整十数和两位数加减一位数（包括进位、退位），能解决生活中的求一共、求剩余、比多少等问题。计算时要数位对齐，进位别忘了加1，退位别忘了十位减1。","key":"两位数加减一位数、整十数，相同数位对齐；进位加1，退位减1。","audio":{"title":"m1b_math1b_u4_kp_u4_5_title","explain":"m1b_math1b_u4_kp_u4_5_explain","key":"m1b_math1b_u4_kp_u4_5_key"}}],"error_prone":[{"id":"ep_u4_1","title":"相同数位才能相加减","desc":"26+3是6和3相加，不是2和3相加；26+30是2个十和3个十相加，不要把3加到个位上。","image":null,"audio":{"title":"m1b_math1b_u4_ep_u4_1_title","desc":"m1b_math1b_u4_ep_u4_1_desc"}},{"id":"ep_u4_2","title":"进位别忘加1","desc":"27+6，个位7+6=13，要向十位进1，结果是33，不是23。十位上的2还要加上进上来的1。","image":null,"audio":{"title":"m1b_math1b_u4_ep_u4_2_title","desc":"m1b_math1b_u4_ep_u4_2_desc"}},{"id":"ep_u4_3","title":"退位别忘十位减1","desc":"30-9，个位0减9不够减，从十位退1后，十位上的3要变成2，结果是21，不是31。","image":null,"audio":{"title":"m1b_math1b_u4_ep_u4_3_title","desc":"m1b_math1b_u4_ep_u4_3_desc"}},{"id":"ep_u4_4","title":"比多少用大数减小数","desc":"求“一个数比另一个数多几”或“少几”，要用大数减小数，不能见“多”就加、见“少”就减。","image":null,"audio":{"title":"m1b_math1b_u4_ep_u4_4_title","desc":"m1b_math1b_u4_ep_u4_4_desc"}}],"daily":{"基础":[{"id":"u4_b1","type":"fill","knowledge_point":"kp_u4_1","stem":"26加3等于（ ）。","answer":"29","analysis":"26+3=29。","image":null,"audio":{"stem":"m1b_math1b_u4_u4_b1_stem","a 。”教正确的站坐走躺姿势：站像松树直，坐像铜钟稳，走路像风轻快，躺像弓舒适。"}]},{"image":"assets/images/img_2c21f1732fec.jpg","knowledge_points":[{"title":"会认生字（日月山川）","explain":"本课认读：日、月、山、川、水、火、田、禾（共8个）。"},{"title":"自然事物","explain":"日=太阳，月=月亮，山=高山，川=河流，水=流水，火=火焰，田=田地，禾=禾苗。它们都来自大自然和我们的生活。"}]},{"image":"assets/images/img_1320206ad392.jpg","knowledge_points":[{"title":"巩固练习","explain":"“猜一猜，连一连”：把羊、竹、网、兔、木、鸟这些字和对应图画连起来，再描红“日、月、山、川、水、火、田、禾”复习本课生字。"}]},{"image":"assets/images/img_2dd74de8e762.jpg","knowledge_points":[{"title":"会认生字（语文园地一）","explain":"园地一认读：六、七、八、九、十（共5个）。一到十十个数字全齐啦！"},{"title":"字词句运用","explain":"“日—目”“人—天”比一比，发现字形相近的字；读一读、比一比，把字认得更准。"}]},{"image":"assets/images/img_e0c43f757575.jpg","knowledge_points":[{"title":"日积月累《咏鹅》","explain":"[唐]骆宾王：“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”一首描写白鹅的可爱古诗。"},{"title":"书写提示","explain":"笔顺规则：先横后竖（如“十”）、先撇后捺（如“八”“人”）。按笔顺写字才规范好看。"}]},{"image":"assets/images/img_dd9bb2c49b38.jpg","knowledge_points":[{"title":"口语交际《我说你做》","explain":"一个人发指令，其他人做动作。要点：说话声音洪亮、吐字清楚；别人说话时要认真听。"}]},{"image":"assets/images/img_32cdbb9a7123.jpg","knowledge_points":[{"title":"和大人一起读《剪窗花》","explain":"有趣儿歌：小剪刀手中拿，剪雪花、剪梅花、剪喜鹊、剪鲤鱼，最后剪个胖娃娃。和爸爸妈妈一起读更开心。"}]},{"image":"assets/images/img_033fb7c83ffe.jpg","knowledge_points":[{"title":"快乐读书吧","explain":"学了拼音就能认更多字、读更多书。周末去书店看图画书，多读书、多讲故事，你也能当“故事大王”。"}]}],"error_prone":[{"id":"ep_u1_1","title":"“人”和“入”","desc":"“人”撇长捺短像走路，“入”撇短捺长像进门。写字时先看清再下笔。","image":null},{"id":"ep_u1_2","title":"“目”和“日”","desc":"“目”里有两横，是眼睛；“日”里有一横，是太阳。分清再写。","image":null},{"id":"ep_u1_3","title":"“八”和“人”","desc":"“八”两笔分开；“人”两笔相连。写字时看准再写。","image":null},{"id":"ep_u1_4","title":"“禾”和“木”","desc":"“禾”比“木”多一撇，像禾苗顶上的穗；“木”是树木。分清再写。","image":null}],"daily":{"基础":[{"id":"u1_b1","type":"choice","knowledge_point":"kp_u1_1","stem":"下面哪个字表示“天”？","options":["人","天","大"],"answer":"天","analysis":"“天”是天空，所以选“天”。","image":null},{"id":"u1_b2","type":"match","knowledge_point":"kp_u1_1","stem":"把拼音和汉字连一连：","pairs":[{"left":"tiān","right":"天"},{"left":"dì","right":"地"},{"left":"rén","right":"人"}],"answer":"ti ”的笔顺","desc":"“出”先写竖折，再写中间竖，最后写右竖折。别写错笔顺。","image":null},{"id":"ep_u8_3","title":"“牙”和“呀”","desc":"“牙”加“口”字旁是“呀”。“牙齿”的“牙”、“哎呀”的“呀”，看有没有口字旁。","image":null}],"daily":{"基础":[{"id":"u8_b1","type":"choice","knowledge_point":"kp_u8_1","stem":"谁的尾巴长？","options":["猴子","兔子","松鼠"],"answer":"猴子","analysis":"课文说猴子的尾巴长。","image":null},{"id":"u8_b2","type":"match","knowledge_point":"kp_u8_1","stem":"把动物和尾巴连一连：","pairs":[{"left":"猴子","right":"长"},{"left":"兔子","right":"短"},{"left":"松鼠","right":"一把伞"}],"answer":"猴子—长，兔子—短，松鼠—一把伞","analysis":"三种动物尾巴不一样。","image":null}],"提高":[{"id":"u8_g1","type":"fill_hanzi","knowledge_point":"kp_u8_2","stem":"看拼音写汉字：shuǐ（  ）","answer":"水","analysis":"shuǐ 是“水”，之前学过，可在框里写一写。","image":null},{"id":"u8_g2","type":"fill_hanzi","knowledge_point":"kp_u8_3","stem":"补充：雨点儿从云（  ）里飘落。","answer":"彩","analysis":"课文“从云彩里飘落”，彩字本单元学过。","image":null}],"拓展":[{"id":"u8_t1","type":"read_comp","knowledge_point":"kp_u8_2","stem":"读一读，选一选：","passage":"一只乌鸦口渴了，看见一个瓶子，瓶子里有水。可是瓶口太小，乌鸦喝不着。它想出办法，叼来小石子放进瓶里，水面升高，乌鸦就喝着水了。","questions":[{"stem":"乌鸦怎么喝到水的？","options":["放石子进瓶","打翻瓶子","等下雨"],"answer":"放石子进瓶"},{"stem":"这个故事告诉我们什么？","options":["动脑筋想办法","等别人帮","放弃算了"],"answer":"动脑筋想办法"}],"analysis":"遇到困难要自己想办法。","image":null}]},"unit_test":[{"id":"u8_q1","type":"fill_hanzi","knowledge_point":"kp_u8_1","stem":"写出反义词：长 ——（  ）","answer":"短","analysis":"“长”的反义词是“短”，本单元学过。","image":null},{"id":"u8_q2","type":"recite","knowledge_point":"kp_u8_1","stem":"背《比尾巴》（一、二问），可点🎤录音：","text":"谁的尾巴长？谁的尾巴短？\n谁的尾巴好像一把伞？\n猴子的尾巴长，兔子的尾巴短，\n松鼠的尾巴好像一把伞。","answer":"","analysis":"记住三种动物尾巴的特点。","image":null}],"mid_test":[],"final_test":[],"unit_id":"chinese1a_u8"}],"mid_term":[],"final_exam":[]},"下册":{"meta":{"subject":"语文","version":"统编版·人教版","grade":"一年级","volume":"下册","title":"统编版一年级下册语文学习台","book_name":"语文一下","units_count":8},"toc":[{"id":"u1","title":"第一单元 识字","unit_id":"chinese1b_u1"},{"id":"u2","title":"第二单元 阅读","unit_id":"chinese1b_u2"},{"id":"u3","title":"第三单元 阅读","unit_id":"chinese1b_u3"},{"id":"u4","title":"第四单元 阅读","unit_id":"chinese1b_u4"},{"id":"u5","title":"第五单元 识字","unit_id":"chinese1b_u5"},{"id":"u6","title":"第六单元 阅读","unit_id":"chinese1b_u6"},{"id":"u7","title":"第七单元 阅读","unit_id":"chinese1b_u7"},{"id":"u8","title":"第八单元 阅读","unit_id":"chinese1b_u8"}],"units":[{"unit":"第一单元 识字","learned_chars":["天","地","人","你","我","他","一","二","三","四","五","上","下","口","耳","目","手","足","站","坐","日","月","山","川","水","火","田","禾","a","o","e","i","u","ü","b","p","m","f","d","t","n","l","爸","妈","g","k","h","j","q","x","z","c","s","zh","ch","sh","r","y","w","画","打","棋","鸡","字","词","句","子","桌","纸","ai","ei","ui","ao","ou","iu","ie","üe","er","an","en","in","un","ün","ang","eng","ing","ong","妹","奶","白","皮","小","桥","台","雪","儿","草","家","是","车","秋","气","了","树","叶","片","大","飞","会","个","的","船","两","头","在","里","看","见","闪","星","江","南","可","采","莲","鱼","东","西","北","尖","说","春","青","蛙","夏","弯","冬","就","肚","对","云","雨","风","花","鸟","虫","清","绿","红","秀","柳","桃","林","力","男","尘","从","众","明","双","木","森","条","心","不","金","王","中","立","正","升","国","旗","歌","起","么","美","丽","午","晚","昨","今","年","影","前","后","黑","狗","左","右","它","好","朋","友","长","比","巴","把","尾","谁","短","伞","兔","最","公","写","诗","点","要","过","给","当","串","们","以","成","数","彩","半","空","问","到","方","没","更","出","处","找","办","旁","许","法","放","进","高","住","孩","玩","吧","发","芽","爬","呀","久","回","全","变","牙","用","几","只","石","入","姓","什","晴","情","请","生","时","动","万"],"pages":[{"image":"assets/images/img_81a349665fdc.jpg","knowledge_points":[{"title":"会认生字（春夏秋冬）","explain":"认读：霜、吹、落、降、飘、游、池、入（8个）及春、夏、秋、冬、风、雪。课文用'春风吹、夏雨落、秋霜降、冬雪飘'和'池草青、山花红、鱼出水、鸟入林'介绍四季景物。"},{"title":"词语积累","explain":"春风/夏雨/秋霜/冬雪；青草/红花/游鱼/飞鸟。读准字音，感受四季变化，背诵课文。"}]},{"image":"assets/images/img_bafeec90535e.jpg","knowledge_points":[{"title":"会认生字（春夏秋冬②）","explain":"认读：游、池、入；词语：青草、红花、游鱼、飞鸟。句子：池草青，山花红，鱼出水，鸟入林。"},{"title":"朗读与背诵","explain":"'吹、落、降、飘'都是表示动作的字。朗读课文，背诵课文。"}]},{"image":"assets/images/img_cedac0d4720f.jpg","knowledge_points":[{"title":"会认生字（姓氏歌）","explain":"认读：姓、什、么、李、张、古、胡、吴、双、言、孙、周、诸、葛、方、官、阳（共17个）。用拆字法介绍姓氏：弓长张、古月胡、口天吴、言午许。"},{"title":"姓氏常识","explain":"《姓氏歌》里有许多姓氏：赵、钱、孙、李、周、吴、郑、王，还有复姓诸葛、东方、上官、欧阳。"}]},{"image":"assets/images/img_015728324c4c.jpg","knowledge_points":[{"title":"介绍姓氏的方法","explain":"介绍自己姓什么可用不同方法：'你姓什么？我姓张。什么张？弓长张。'照样子做问答游戏，认一认班里同学的姓。"},{"title":"朗读背诵","explain":"朗读并背诵《姓氏歌》；书写：什、么、古、胡、吴、言、孙等字。"}]},{"image":"assets/images/img_f37dc3854388.jpg","knowledge_points":[{"title":"会认生字（小青蛙）","explain":"认读：河、清、晴、眼、睛、保、护、苗、吃、害、事、情、请、让、病（共15个）。这是'字族文'，青字家族：清、晴、睛、情、请都带'青'。"},{"title":"字族识字","explain":"'青'加不同偏旁成新字：清(氵水)、晴(日)、睛(目)、情(忄心)、请(讠言)。形声字偏旁表义。"}]},{"image":"assets/images/img_3fc717d681cf.jpg","knowledge_points":[{"title":"发现偏旁规律","explain":"读'睛、情、晴、清、请'，发现右边都是'青'，左边偏旁不同意思就不同。填空：天(晴)、心(情)、(请)问、(清)水、眼(睛)。"},{"title":"书写巩固","explain":"认读并书写：河、晴、眼、睛、保、护、苗、吃、事、情、请、让；朗读课文。"}]},{"image":"assets/images/img_77ca23c28e66.jpg","knowledge_points":[{"title":"会认生字（猜字谜一）","explain":"认读：相、遇、喜、欢、怕、攻、令、感、动、万、无、纯、净、左、右、红、时（共17个）。字谜'左边绿右边红，左右相遇起凉风'猜的是'秋'。"},{"title":"字谜讲解","explain":"第一则谜底'秋'：左边'禾'绿（禾苗），右边'火'红（火），秋风吹起凉风。学会根据提示猜左右结构的字。"}]},{"image":"assets/images/img_15a28850f391.jpg","knowledge_points":[{"title":"会认生字（猜字谜二）","explain":"认读：言、互、令、动、万、纯、净、尊、重、透、明。字谜每句加偏旁都含'青'：言+青=请、心+青=情、日+青=晴、水+青=清。"},{"title":"字谜讲解","explain":"第二则每句话对应'青'家族一个字，谜底是'青'。'一加一'猜字可猜'王'。"}]},{"image":"assets/images/img_7f4ac5c18935.jpg","knowledge_points":[{"title":"语文园地一·识字加油站","explain":"认读：识、组、词、计、算、减、式、图、形、卡、合、唱、团。词语：计算、减法、算式、图形、卡片、合唱、团结。注意'长'有 cháng/zhǎng 两读。"},{"title":"字词句运用","explain":"读一读，发现'长—长''见—贝'等读音或字形相近的字，再写一写。"}]},{"image":"assets/images/img_b73a708789fa.jpg","knowledge_points":[{"title":"读《祖国多么广大》","explain":"朗读短文，感受祖国南北气候不同：大兴安岭雪花飞舞，长江两岸柳枝发芽，海南岛上鲜花盛开。我们的祖国多么广大。"},{"title":"记《汉语拼音字母表》","explain":"背诵大写字母 A–Z 与小写 a–z 的对应，为查字典打基础。"}]},{"image":"assets/images/img_80b6a6e8f893.jpg","knowledge_points":[{"title":"日积月累《春晓》","explain":"[唐]孟浩然：'春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。'描写春天早晨景色，背诵这首诗。"},{"title":"书写提示","explain":"笔顺规则：先外后内再封口（如'田、四、白'）。写包围结构的字要注意。"}]},{"image":"assets/images/img_d712405b067e.jpg","kno {"image":"assets/images/img_c9e5bcd61aa6.jpg","knowledge_points":[{"title":"会认生字（小公鸡和小鸭子）","explain":"认读：块、捉、急、直、河、行、死、信、跟、忽、喊、身（及公鸡、鸭子、草地、虫子）。"},{"title":"课文讲解","explain":"小公鸡和小鸭子一块儿出去玩，小公鸡捉虫给小鸭子吃；小鸭子下河捉鱼，救了落水的小公鸡。朋友间要互相帮助。"}]},{"image":"assets/images/img_a5a688a5d454.jpg","knowledge_points":[{"title":"课文续讲","explain":"小鸭子说'公鸡弟弟，我到河里捉鱼给你吃'，小公鸡不信也下水，差点淹死，小鸭子飞快游去救他。"},{"title":"书写","explain":"书写：他、河、说、也、地、听、哥。"}]},{"image":"assets/images/img_b5bb0b2fc687.jpg","knowledge_points":[{"title":"读一读比一比","explain":"'小鸭子游到小公鸡身边'→'小鸭子飞快地游到小公鸡身边'；'小公鸡偷偷地跟在小鸭子后面'。体会副词让句子更生动。"},{"title":"词语","explain":"捉、急、直、哭、跟、忽然、听、喊、快、身、背。"}]},{"image":"assets/images/img_cb274588be46.jpg","knowledge_points":[{"title":"会认生字（树和喜鹊）","explain":"认读：只、窝、孤、单、种、都、邻、居、招、呼、静、乐（及喜鹊、鸟窝）。"},{"title":"课文讲解","explain":"从前一棵树上只有一个鸟窝一只喜鹊，很孤单；后来种了好多树有了邻居，每天叽叽喳喳，很快乐。有朋友才快乐。"}]},{"image":"assets/images/img_0c7c9369232a.jpg","knowledge_points":[{"title":"词语积累","explain":"从前、喜鹊、孤单、叽叽喳喳、后来、邻居、快乐、安安静静（'安安静静'这类四字词语）。"},{"title":"思考","explain":"朗读并思考：树和喜鹊后来为什么很快乐？读一读记一记相关词语。"}]},{"image":"assets/images/img_23c831425f16.jpg","knowledge_points":[{"title":"会认生字（怎么都快乐）","explain":"认读：怎、独、跳、绳、讲、得、羽、球、戏、排、篮、连（及折船、踢毽子、积木、象棋、羽毛球）。"},{"title":"课文讲解","explain":"一个人玩、两个人玩、三个人玩、许多人玩都快乐。一个人折纸船、踢毽子、搭积木；两个人下象棋、讲故事。"}]},{"image":"assets/images/img_0d48307b9d6d.jpg","knowledge_points":[{"title":"课文续讲","explain":"三个人玩讲故事更有劲；许多人玩可以拔河、老鹰捉小鸡、打排球篮球足球，什么游戏都能玩。"}]},{"image":"assets/images/img_26436a32530c.jpg","knowledge_points":[{"title":"读一读记一记","explain":"跳绳、踢足球、听音乐、看书、打排球、玩游戏。书写：玩、得、很、当、音、讲、行、许。朗读注意带感叹号的句子。"}]},{"image":"assets/images/img_ad8cdb577917.jpg","knowledge_points":[{"title":"语文园地三·识字加油站","explain":"学习用字典的音序查字法：从音节索引找大写字母→翻正文→按声调顺序→查到页码。"}]},{"image":"assets/images/img_69b5460c7daf.jpg","knowledge_points":[{"title":"日积月累《赠汪伦》","explain":"[唐]李白：李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。并练习用音序查字法查'止、斤、寸、丁、全、旦'等字组词。"}]},{"image":"assets/images/img_efe854f7a31f.jpg","knowledge_points":[{"title":"口语交际《打电话》","explain":"打电话要注意礼貌、说清事由。如：'阿姨您好，我是张 ","都","捉","姐","您","房","借"],"pages":[{"image":"assets/images/img_03414b0ac665.jpg","knowledge_points":[{"title":"会认生字（棉花姑娘）","explain":"认读：棉、姑、娘、病、她、治、燕、帮、害、别、干、惊、奇。"},{"title":"课文讲解","explain":"棉花姑娘生病了，盼望医生来治病。她请燕子、啄木鸟、青蛙帮忙，可它们都不会捉棉花上的蚜虫。"}]},{"image":"assets/images/img_8262f06f570e.jpg","knowledge_points":[{"title":"课文续讲","explain":"燕子捉空中害虫、啄木鸟捉树干里害虫、青蛙捉水田里害虫，都帮不了棉花姑娘。忽然七星瓢虫飞来。"}]},{"image":"assets/images/img_674cb3646736.jpg","knowledge_points":[{"title":"课文续讲②","explain":"七星瓢虫身上有七个斑点像星星，吃光了蚜虫。不久棉花姑娘病好了，吐出雪白的棉花咧嘴笑。"}]},{"image":"assets/images/img_265f4d26d91e.jpg","knowledge_points":[{"title":"读与思","explain":"连线：捉空中的害虫/捉树干里的害虫/捉水田里的害虫/捉棉花叶子上的害虫。棉花姑娘先后请谁帮忙？最后谁治好她？分角色朗读。"}]},{"image":"assets/images/img_fdeab2821bf4.jpg","knowledge_points":[{"title":"会认生字（咕咚）","explain":"认读：咕、咚、熟、掉、湖、吓、鹿、逃、命、象、野、拦、领。"},{"title":"课文讲解","explain":"木瓜掉进湖里'咕咚'，兔子吓跑，小动物跟着跑，野牛拦住问清，大家到湖边发现是木瓜落水的声音。"}]},{"image":"assets/images/img_8936b2278d4d.jpg","knowledge_points":[{"title":"课文续讲","explain":"大象也跟着跑，野牛拦住问'咕咚在哪'，大伙都说没看见。最后到湖边看到木瓜掉水，都笑了。"}]},{"image":"assets/images/img_f8ec58e0cc48.jpg","knowledge_points":[{"title":"课文总结","explain":"兔子领大家来到湖边，正好又一个木瓜掉进湖里'咕咚'，大伙你看看我我看看你都笑了。明白遇事要弄清真相，不盲从。书写：家、象、野、都、怕、跟、着。"}]},{"image":"assets/images/img_eaea145e2c2b.jpg","knowledge_points":[{"title":"会认生字（小壁虎借尾巴）","explain":"认读：壁、墙、蚊、咬、断、您、拨、甩、赶、房、傻、转。"},{"title":"课文讲解","explain":"小壁虎在墙角捉蚊子，被蛇咬住尾巴，挣断尾巴逃走。没有尾巴多难看，他去借尾巴。"}]},{"image":"assets/images/img_6bbe7556f14f.jpg","knowledge_points":[{"title":"课文续讲","explain":"小壁虎爬到大树上向老牛借尾巴，老牛说要用尾巴赶蝇子；爬到房檐下向燕子借，燕子说要用尾巴掌握方向。"}]},{"image":"assets/images/img_54c7f3b26553.jpg","knowledge_points":[{"title":"课文续讲②","explain":"小壁虎借不到尾巴难过，爬回家找妈妈。妈妈让他转过身子看——他长出新尾巴了！"}]},{"image":"assets/images/img_e8cd8fd7ed01.jpg","knowledge_points":[{"title":"读与思","explain":"读字：壁、借、咬、难、哪、爬、您、拨、赶、摆、过、孩、转。小壁虎找谁借过尾巴？结果怎样？分角色朗读，注意问号。"}]},{"image":"assets/images/img_a3a84369833f.jpg","knowledge_points":[{"title":"语文园地八·识字加油站","explain":"加一加识字：口+少=吵、王+见=现、丁+页=顶、月+半=胖、月+长=胀、日+免=晚、女+子=好、田+心=思、木+几=机、户+方=   <!-- 状态层 -->
  <script>
/* =========================================================================
 * storage.js —— 本地状态层（localStorage，file:// 可用；不可用时回退内存）
 * 负责：作答记录、错题本、学情统计、升降阶解锁、宠物状态、每日任务。
 * 纯逻辑函数无 DOM 依赖，便于复用与测试。
 * ========================================================================= */
(function (global) {
  "use strict";

  var KEY = "LT_STATE_V1";
  var SETTINGS = {
    // 一年级升降阶解锁阈值：基础正确率≥95% 才解锁提高（用户 2026-08-17 拍板）
    unlockThreshold: { "一年级": 0.95 },
    defaultThreshold: 0.95,
    progressColor: { green: 0.95, yellow: 0.70 } // 学情三色分界
  };

  var mem = null; // 内存回退
  function readRaw() {
    try {
      var s = global.localStorage.getItem(KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) { return mem; }
  }
  function writeRaw(obj) {
    try { global.localStorage.setItem(KEY, JSON.stringify(obj)); }
    catch (e) { mem = obj; }
  }

  function blank() {
    return {
      version: 1,
      userName: null,               // 首次进入填写
      attempts: {},                 // qid -> {correct,total,last}
      mistakes: {},                 // qid -> {unitId,module,level,userAnswer,correct:false,ts,resolved}
      // 升降阶解锁状态：以“本次练习”正确率是否达标为准，重做全对即解锁。
      // 结构：{ unitId: { 基础: true, 提高: false, 拓展: false } }
      levelUnlock: {},
      pet: { name: "小喵", hunger: 70, mood: "happy", badges: [], lastVisit: null, lastFed: null, fedToday: false },
      daily: { date: null, done: {} }
    };
  }

  var state = readRaw() || blank();

  function save() { writeRaw(state); }

  /* ---------------------- 工具：答案归一化与判定 ---------------------- */
  function normalize(s) {
    if (s == null) return "";
    return String(s)
      .replace(/[\s　]/g, "")
      .replace(/；/g, ";")
      .replace(/，/g, ",")
      .toLowerCase();
  }
  // 提取连续数字序列（用于排序/比大小题）
  function extractNumberSequence(s) {
    var str = String(s);
    // 若用户只输入一串连续数字（无空格/符号），按单个数字拆分
    if (/^\d+$/.test(str) && str.length > 1) {
      return str.split("").join(",");
    }
    var nums = str.match(/\d+/g);
    return nums ? nums.join(",") : null;
  }
  function isSequenceEqual(u, exp) {
    var un = extractNumberSequence(u);
    var en = extractNumberSequence(exp);
    if (!un || !en) return false;
    return un === en;
  }
  // 期望答案可能含多段（用 ；分隔），每段都出现在用户答案中即判对
  // 若答案可解析为数字序列且一致，也判对（兼容排序题写空格/无比较符）
  function isAnswerCorrect(userAnswer, expected) {
    var uRaw = String(userAnswer == null ? "" : userAnswer);
    var eRaw = String(expected == null ? "" : expected);
    if (isSequenceEqual(uRaw, eRaw)) return true;
    var u = normalize(userAnswer);
    var exp = normalize(expected);
    if (!exp) return false;
    var tokens = exp.split(";").filter(Boolean);
    if (tokens.length === 0) return u === exp;
    return tokens.every(function (t) { return u.indexOf(t) !== -1; });
  }

  /* ---------------------- 作答 / 错题记录 ---------------------- */
  function recordAttempt(qid, unitId, module, level, userAnswer, correct) {
    var a = state.attempts[qid] || { correct: 0, total: 0, last: 0 };
    a.total += 1;
    if (correct) a.correct += 1;
    a.last = Date.now();
    state.attempts[qid] = a;

    if (correct) {
      // 做对则把该题为“已解决”
      if (state.mistakes[qid]) state.mistakes[qid].resolved = true;
    } else {
      state.mistakes[qid] = {
        qid: qid, unitId: unitId, module: module, level: level,
        userAnswer: userAnswer, correct: false, ts: Date.now(), resolved: false
      };
    }
    save();
  }

  function getMistakes() {
    return Object.keys(state.mistakes)
      .map(function (k) { return state.mistakes[k]; })
      .filter(function (m) { return !m.resolved; })
      .sort(function (a, b) { return b.ts - a.ts; });
  }
  function mistakeCount() { return getMistakes().length; }

  /* ---------------------- 升降阶解锁（核心） ---------------------- */
  function thresholdFor(grade) {
    return SETTINGS.unlockThreshold[grade] != null ? SETTINGS.unlockThreshold[grade] : SETTINGS.defaultThreshold;
  }

  // 收集某单元某阶（基础/提高/拓展）的全部题目 id
  function levelQuestionIds(book, unitId, level) {
    var unit = book.units.filter(function (u) { return u.unit_id === unitId; })[0];
    if (!unit || !unit.daily || !unit.daily[level]) return [];
    return unit.daily[level].map(function (q) { return q.id; });
  }

  function computeLevelStats(book, unitId, level) {
    var ids = levelQuestionIds(book, unitId, level);
    var attempted = 0, correct = 0, total = 0;
    ids.forEach(function (id) {
      var a = state.attempts[id];
      if (a && a.total > 0) { attempted += 1; correct += a.correct; total += a.total; }
    });
    var accuracy = total > 0 ? correct / total : 0;
    // passed 不再看累计，只看“单次练习”是否曾达标（由 markLevelSession 记录）
    ensureLevelUnlock(unitId);
    var passed = !!state.levelUnlock[unitId][level];
    var allAttempted = ids.length > 0 && attempted === ids.length;
    return { ids: ids, attempted: attempted, correct: correct, total: total,
             accuracy: accuracy, allAttempted: allAttempted, passed: passed };
  }

  // 某阶是否解锁：基础默认解锁；提高需基础“单次练习”达标；拓展需提高“单次练习”达标
  function ensureLevelUnlock(unitId) {
    if (!state.levelUnlock[unitId]) state.levelUnlock[unitId] = { "基础": false, "提高": false, "拓展": false };
  }

  // 记录一次练习结果：acc 为本次正确率；达标则解锁本阶并开启下一阶
  function markLevelSession(book, unitId, level, acc) {
    ensureLevelUnlock(unitId);
    var thr = thresholdFor(book.meta.grade);
    if (acc >= thr) {
      state.levelUnlock[unitId][level] = true;
      if (level === "基础") state.levelUnlock[unitId]["提高"] = true;
      if (level === "提高") state.levelUnlock[unitId]["拓展"] = true;
      save();
      return true;
    }
    save();
    return false;
  }

  function isLevelUnlocked(book, unitId, level) {
    ensureLevelUnlock(unitId);
    if (level === "基础") return true;
    if (level === "提高") return !!state.levelUnlock[unitId]["基础"];
    if (level === "拓展") return !!state.levelUnlock[unitId]["提高"];
    return false;
  }

  /* ---------------------- 学情三色（按单元，仅以基础题为准） ----------------------
   * 规则（用户 2026-08-17 拍板）：基础题默认即符合本单元难度；基础答对=已掌握。
   * 提高/拓展只用于解锁挑战，不计入单元掌握色。 */
  function unitAccuracy(book, unitId) {
    var unit = book.units.filter(function (u) { return u.unit_id === unitId; })[0];
    if (!unit) return null;
    var ids = (unit.daily && unit.daily["基础"]) ? unit.daily["基础"].map(function (q) { return q.id; }) : [];
    var correct = 0, total = 0;
    ids.forEach(function (id) {
      var a = state.attempts[id];
      if (a && a.total > 0) { correct += a.correct; total += a.total; }
    });
    if (total === 0) return { accuracy: 0, answered: false, color: "none" };
    var acc = correct / total;
    var color = acc >= SETTINGS.progressColor.green ? "green"
              : acc >= SETTINGS.progressColor.yellow ? "yellow" : "red";
    return { accuracy: acc, answered: true, color: color };
  }

  function overallAccuracy(book) {
    var correct = 0, total = 0;
    Object.keys(state.attempts).forEach(function (id) {
      var a = state.attempts[id];
      correct += a.correct; total += a.total;
    });
    return total > 0 ? correct / total : 0;
  }

  /* ---------------------- 宠物 ---------------------- */
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function petTick() {
    var p = state.pet;
    var today = todayStr();
    var absentDays = 0;
    if (p.lastVisit) {
      var diff = Math.floor((Date.now() - new Date(p.lastVisit)) / 86400000);
      absentDays = diff;
    }
    // 每日饥饿衰减
    if (p.lastVisit && p.lastVisit.slice(0, 10) !== today) {
      p.hunger = Math.max(0, p.hunger - 20);
      p.fedToday = false;
    }
    p.lastVisit = new Date().toISOString();
    var mood = "happy";
    if (p.hunger <= 20) mood = "hungry";
    if (absentDays >= 2) mood = "sad";
    p.mood = mood;
    save();
    return { absentDays: absentDays, mood: mood };
  }

  function petFeed() {
    var p = state.pet;
    if (p.fedToday) return { ok: false, msg: "今天已经喂过啦～小喵吃饱了！" };
    p.hunger = 100; p.fedToday = true; p.mood = "happy";
    save();
    return { ok: true, msg: "小喵吃得好香，谢谢你！(｡•ᴗ•｡)" };
  }

  function awardBadge(id, title, icon) {
    var p = state.pet;
    if (p.badges.some(function (b) { return b.id === id; })) return false;
    p.badges.push({ id: id, title: title, icon: icon || "🏅" });
    save();
    return true;
  }

  /* ---------------------- 每日任务 ---------------------- */
  function markDaily(moduleKey) {
    var today = todayStr();
    if (state.daily.date !== today) { state.daily = { date: today, done: {} }; }
    state.daily.done[moduleKey] = true;
    save();
  }
  function dailyDoneToday() {
    var today = todayStr();
    if (state.daily.date !== today) return [];
    return Object.keys(state.daily.done);
  }

  function resetAll() {
    state = blank();
    save();
  }

  global.Store = {
    SETTINGS: SETTINGS,
    state: function () { return state; },
    save: save,
    isAnswerCorrect: isAnswerCorrect,
    normalize: normalize,
    recordAttempt: recordAttempt,
    getMistakes: getMistakes,
    mistakeCount: mistakeCount,
    thresholdFor: thresholdFor,
    computeLevelStats: computeLevelStats,
    isLevelUnlocked: isLevelUnlocked,
    markLevelSession: markLevelSession,
    unitAccuracy: unitAccuracy,
    overallAccuracy: overallAccuracy,
    petTick: petTick,
    petFeed: petFeed,
    awardBadge: awardBadge,
    markDaily: markDaily,
    dailyDoneToday: dailyDoneToday,
    resetAll: resetAll,
    todayStr: todayStr
  };
})(window);

  <!-- 主程序 -->
  <script>
/* =========================================================================
 * app.js —— 年级学习台主程序（平台模型：年级 → 学科 → 册 → 单元 → 模块）
 * 纯原生。数据：window.LEARNING_BOOK.platform（由 _combine_grade.py 生成）。
 * 关键：BOOK 为「当前显示的册」数据，随学科/册切换而重赋值；所有渲染逻辑复用，
 *       学科/册下拉全部由 PLATFORM 动态生成，不硬编码任何 book_id、册名、学科名。
 * 扩展预留：① 加学科 = books.json grade_platforms 加条目（如语文/英语）；
 *           ② 全年级合并 = 后续在 platform 外层加 grades 层，app 读取处同步升级即可。
 * ========================================================================= */
(function () {
  "use strict";

  var PLATFORM = window.LEARNING_BOOK.platform;
  var S = window.Store;
  var BOOK = null; // 当前显示的「册」数据（math1a / math1b 对象），随切换重赋值

  var SUBJECT_ICONS = { "语文": "📖", "数学": "🔢", "英语": "🔤" };
  var ALL_SUBJECTS = ["语文", "数学", "英语"];
  var MODULES = ["同步内容", "易错点", "每日练习", "单元测"];
  var LEVELS = ["基础", "提高", "拓展"];

  var App = {
    view: {
      page: "dashboard", // dashboard | subject | progress | mistakes | pet
      subject: PLATFORM.subjects[0].subject,
      semester: Object.keys(PLATFORM.subjects[0].volumes)[0],
      unitId: null,
      module: "同步内容",
      level: "基础",
      testType: "unit", // unit | mid | final
      testPaper: 0 // 当前选中的期中/期末试卷下标
    },
    quiz: null
  };

  /* ----------------------------- 平台 / 册 切换 ----------------------------- */
  function curSubjectObj() {
    for (var i = 0; i < PLATFORM.subjects.length; i++) {
      if (PLATFORM.subjects[i].subject === App.view.subject) return PLATFORM.subjects[i];
    }
    return PLATFORM.subjects[0];
  }
  function curVolumes() { return curSubjectObj().volumes; }
  function setBook() {
    var vs = curVolumes();
    BOOK = vs[App.view.semester] || vs[Object.keys(vs)[0]];
    if (!BOOK) return;
    if (!App.view.unitId || !unitById(App.view.unitId)) {
      App.view.unitId = BOOK.toc[0].unit_id;
    }
  }

  /* ----------------------------- 工具 ----------------------------- */
  function el(html) {
    var d = document.createElement("div");
    d.innerHTML = html.trim();
    return d.firstChild;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function unitById(id) {
    return BOOK.units.filter(function (u) { return u.unit_id === id; })[0];
  }
  function tocByUnitId(uid) {
    for (var i = 0; i < BOOK.toc.length; i++) {
      if (findUnitsByTocId(BOOK.toc[i].id) === uid) return BOOK.toc[i];
    }
    return null;
  }
  function findUnitsByTocId(tocId) {
    for (var i = 0; i < BOOK.toc.length; i++) {
      if (BOOK.toc[i].id === tocId) return BOOK.toc[i].unit_id;
    }
    return tocId;
  }
  function firstUnitId() {
    return BOOK.toc[0].unit_id;
  }

  /* ----------------------------- DOM 引用 ----------------------------- */
  var appEl, topbarEl, subjectNavEl, mainEl, petHostEl;

  /* ----------------------------- 布局构建 ----------------------------- */
  function buildLayout() {
    appEl = document.getElementById("app");
    appEl.innerHTML =
      '<header class="topbar" id="topbar"></header>' +
      '<div class="layout">' +
        '<nav class="subject-nav" id="subjectNav"></nav>' +
        '<main class="main" id="main"></main>' +
      '</div>' +
      '<div class="pet-host" id="petHost"></div>' +
      '<div class="overlay" id="overlay"></div>';
    topbarEl = document.getElementById("topbar");
    subjectNavEl = document.getElementById("subjectNav");
    mainEl = document.getElementById("main");
    petHostEl = document.getElementById("petHost");
  }

  /* ----------------------------- 顶部栏（含册切换） ----------------------------- */
  function renderTopbar() {
    var userName = S.state().userName || "小朋友";
    var semOpts = Object.keys(curVolumes()).map(function (s) {
      return '<option value="' + esc(s) + '" ' + (App.view.semester === s ? "selected" : "") + '>' + esc(s) + '</option>';
    }).join("");
    topbarEl.innerHTML =
      '<div class="topbar-left">' +
        '<select class="semester-select" id="semesterSelect">' + semOpts + '</select>' +
      '</div>' +
      '<div class="topbar-center">' +
        '<span class="brand-logo">🎒</span>' +
        '<span class="brand-title">' + esc(userName) + '的学习宝藏</span>' +
      '</div>' +
      '<div class="topbar-right">' +
        '<button class="tbtn" data-go="dashboard">🏠</button>' +
        '<button class="tbtn" data-go="progress">📊 学情</button>' +
        '<button class="tbtn" data-go="mistakes">📕 错题本 <span class="badge-count" id="mcCount">0</span></button>' +
        '<button class="tbtn" data-go="pet">🐱 宠物</button>' +
        '<button class="tbtn ghost" id="resetBtn" title="清空本地学习数据">↺</button>' +
      '</div>';

    document.getElementById("semesterSelect").addEventListener("change", function (e) {
      App.view.semester = e.target.value;
      render(); // render() 内 setBook() 会切换当前册数据
    });
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (confirm("确定清空本机所有学习记录（错题、学情、宠物）吗？此操作不可恢复。")) {
        S.resetAll();
        Pet.refresh();
        render();
      }
    });
    Array.prototype.forEach.call(topbarEl.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () { navigate({ page: b.getAttribute("data-go") }); });
    });
    updateMistakeCount();
  }

  /* ----------------------------- 左侧学科导航（动态生成） ----------------------------- */
  function renderSubjectNav() {
    var html = '';
    ALL_SUBJECTS.forEach(function (key) {
      var subj = PLATFORM.subjects.filter(function (s) { return s.subject === key; })[0];
      var available = !!(subj && Object.keys(subj.volumes).length);
      var active = App.view.subject === key && App.view.page !== "dashboard" && App.view.page !== "progress" && App.view.page !== "mistakes" && App.view.page !== "pet";
      var cls = "sub-item" + (active ? " active" : "") + (!available ? " disabled" : "");
      html += '<button class="' + cls + '" data-subject="' + esc(key) + '">' +
        '<span class="sub-icon">' + (SUBJECT_ICONS[key] || "📚") + '</span>' +
        '<span class="sub-name">' + esc(key) + '</span>' +
        (!available ? '<span class="sub-badge">待</span>' : '') +
        '</button>';
    });
    subjectNavEl.innerHTML = html;

    Array.prototype.forEach.call(subjectNavEl.querySelectorAll("[data-subject]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-subject");
        var subj = PLATFORM.subjects.filter(function (s) { return s.subject === key; })[0];
        var available = !!(subj && Object.keys(subj.volumes).length);
        if (!available) {
          Pet.say(key + "还在准备中，先学" + App.view.subject + "吧～", 2400);
          return;
        }
        App.view.subject = key;
        App.view.semester = Object.keys(subj.volumes)[0];
        navigate({ page: "subject", module: "同步内容", unitId: null, level: "基础", testType: "unit" });
      });
    });
  }

  /* ----------------------------- 真人音朗读（可点暂停 / 再点继续） ----------------------------- */
  // 播放状态机：同一按钮切换播放⇄暂停；切换按钮自动停掉上一个并开始新的；切页自动停止。
  var _spk = { btn: null, queue: [], idx: 0, audio: null, useTTS: false, playing: false };

  function _spkSetBtn(btn, playing) {
    if (!btn) return;
    if (playing) {
      if (btn.dataset.label === undefined) btn.dataset.label = btn.textContent;
      btn.classList.add("speaking");
      btn.textContent = "⏸ " + (btn.dataset.label || "");
    } else {
      btn.classList.remove("speaking");
      if (btn.dataset.label !== undefined) btn.textContent = btn.dataset.label;
    }
  }

  function _spkStop() {
    if (_spk.audio) { try { _spk.audio.pause(); } catch (e) {} _spk.audio = null; }
    if (_spk.useTTS) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (_spk.btn) _spkSetBtn(_spk.btn, false);
    _spk.btn = null; _spk.queue = []; _spk.idx = 0; _spk.playing = false; _spk.useTTS = false;
  }

  function _spkPause() {
    if (_spk.audio) { try { _spk.audio.pause(); } catch (e) {} }
    if (_spk.useTTS) { try { window.speechSynthesis.pause(); } catch (e) {} }
    _spk.playing = false;
    if (_spk.btn) _spkSetBtn(_spk.btn, false);
  }

  function _spkResume() {
    if (_spk.audio) { var p = _spk.audio.play(); if (p && p.catch) p.catch(function () {}); }
    if (_spk.useTTS) { try { window.speechSynthesis.resume(); } catch (e) {} }
    _spk.playing = true;
    if (_spk.btn) _spkSetBtn(_spk.btn, true);
  }

  function _spkNext() {
    if (_spk.idx >= _spk.queue.length) { _spkStop(); return; }
    var it = _spk.queue[_spk.idx];
    if (_spk.useTTS) {
      if (!("speechSynthesis" in window)) { _spkStop(); if (window.Pet) Pet.say("当前设备暂不支持语音朗读", 2000); return; }
      try {
        var u = new SpeechSynthesisUtterance(it.text || "");
        u.lang = it.lang || "zh-CN"; u.rate = 0.9; u.pitch = 1.0;
        u.onend = function () { _spk.idx++; _spkNext(); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        _spk.playing = true;
      } catch (e) { _spkStop(); }
      return;
    }
    if (_spk.audio) { try { _spk.audio.pause(); } catch (e) {} }
    var au = new Audio(window.AUDIO_MAP[it.key]);
    _spk.audio = au;
    au.onended = function () { _spk.idx++; _spk.audio = null; _spkNext(); };
    var pp = au.play();
    _spk.playing = true;
    if (pp && pp.catch) pp.catch(function () {
      // 真人音被浏览器拦截：本条回退浏览器语音后继续下一条
      try { window.speechSynthesis.cancel(); var tu = new SpeechSynthesisUtterance(it.text || ""); tu.lang = it.lang || "zh-CN"; tu.rate = 0.9; tu.onend = function () { _spk.idx++; _spkNext(); }; window.speechSynthesis.speak(tu); } catch (e2) { _spk.idx++; _spkNext(); }
    });
  }

  // speakGroup(btn, items): items = [{text, key}]；点一下开始，再点暂停/继续。
  function speakGroup(btn, items) {
    if (!btn || !items || !items.length) return;
    if (_spk.btn === btn) {            // 同一个按钮：切换播放 / 暂停
      if (_spk.playing) _spkPause(); else _spkResume();
      return;
    }
    _spkStop();                         // 切换内容：先停旧的
    _spk.btn = btn;
    _spk.queue = items;
    _spk.idx = 0;
    _spk.useTTS = !items.every(function (it) { return it.text && it.key && window.AUDIO_MAP && window.AUDIO_MAP[it.key]; });
    _spkNext();
    _spkSetBtn(btn, true);
  }

  // speak(btn, text, audioFile): 单段朗读（题目）。
  function speak(btn, text, audioFile) {
    speakGroup(btn, [{ text: text, key: audioFile }]);
  }

  /* ----------------------------- 路由 ----------------------------- */
  function navigate(viewPatch) {
    Object.keys(viewPatch).forEach(function (k) { App.view[k] = viewPatch[k]; });
    App.quiz = null;
    render();
  }

  function render() {
    if (typeof _spkStop === "function") _spkStop(); // 切页时停掉正在播放的语音
    setBook(); // 每次渲染前确保 BOOK 与当前学科/册一致
    renderTopbar();
    renderSubjectNav();
    if (App.view.page === "dashboard") renderDashboard();
    else if (App.view.page === "subject") renderSubject();
    else if (App.view.page === "progress") renderProgress();
    else if (App.view.page === "mistakes") renderMistakes();
    else if (App.view.page === "pet") renderPetPage();
    window.scrollTo(0, 0);
  }

  /* ----------------------------- Dashboard：学习宝藏 ----------------------------- */
  function renderDashboard() {
    var userName = S.state().userName || "小朋友";
    var overall = S.overallAccuracy(BOOK);
    var mistakeN = S.mistakeCount();
    var unitSummary = BOOK.toc.map(function (t) {
      var uid = findUnitsByTocId(t.id);
      var acc = S.unitAccuracy(BOOK, uid);
      return { title: t.title, color: acc.answered ? acc.color : "none", pct: acc.answered ? Math.round(acc.accuracy * 100) : 0 };
    });
    var greenN = unitSummary.filter(function (u) { return u.color === "green"; }).length;
    var yellowN = unitSummary.filter(function (u) { return u.color === "yellow"; }).length;
    var redN = unitSummary.filter(function (u) { return u.color === "red"; }).length;

    var html = '<section class="page dashboard">' +
      '<div class="hero">' +
        '<div class="hero-text">' +
          '<h1>Hi，' + esc(userName) + ' 👋</h1>' +
          '<p>今天继续探索学习宝藏吧！基础题正确率达到 <b>' + Math.round(S.thresholdFor(BOOK.meta.grade) * 100) + '%</b> 即可解锁下一阶。</p>' +
        '</div>' +
        '<div class="hero-stat"><div class="ring" style="--p:' + Math.round(overall * 100) + '"><span>' + Math.round(overall * 100) + '%</span></div><label>总正确率</label></div>' +
      '</div>' +
      '<div class="dashboard-grid">' +
        '<div class="dash-card progress-card" data-go="progress">' +
          '<div class="dash-icon">📊</div>' +
          '<h3>学情分析</h3>' +
          '<p class="dash-sub">已掌握 ' + greenN + ' · 待巩固 ' + yellowN + ' · 薄弱 ' + redN + '</p>' +
          '<div class="dash-bars">' + unitSummary.slice(0, 4).map(function (u) {
            return '<div class="dash-bar"><span class="dash-bar-name">' + esc(u.title.split(" ").pop() || u.title) + '</span>' +
              '<span class="dash-bar-track"><span class="dash-bar-fill ' + u.color + '" style="width:' + u.pct + '%"></span></span></div>';
          }).join("") + '</div>' +
        '</div>' +
        '<div class="dash-card mistakes-card" data-go="mistakes">' +
          '<div class="dash-icon">📕</div>' +
          '<h3>错题本</h3>' +
          '<p class="dash-sub">' + (mistakeN ? '有 ' + mistakeN + ' 道题待巩固' : '暂无错题，继续保持！') + '</p>' +
          '<button class="btn ' + (mistakeN ? "primary" : "ghost") + '">' + (mistakeN ? "去重做" : "真棒") + '</button>' +
        '</div>' +
        '<div class="dash-card pet-card" data-go="pet">' +
          '<div class="dash-icon">🐱</div>' +
          '<h3>我的宠物</h3>' +
          '<p class="dash-sub">通过学习为它获得食物→喂食互动→升级解锁新动作</p>' +
          '<button class="btn">去互动</button>' +
        '</div>' +
      '</div>' +
      '<div class="quick-start">' +
        '<h3>继续学习</h3>' +
        '<button class="btn primary" id="continueMathBtn">🔢 开始' + esc(App.view.subject) + '·' + esc(App.view.semester) + '</button>' +
      '</div>' +
      '</section>';
    mainEl.innerHTML = html;

    Array.prototype.forEach.call(mainEl.querySelectorAll("[data-go]"), function (b) {
      b.addEventListener("click", function () { navigate({ page: b.getAttribute("data-go") }); });
    });
    document.getElementById("continueMathBtn").addEventListener("click", function () {
      navigate({ page: "subject", subject: App.view.subject, module: "同步内容", unitId: null, level: "基础", testType: "unit" });
    });
  }

  /* ----------------------------- Subject 页（含模块导航） ----------------------------- */
  function renderSubject() {
    var unit = unitById(App.view.unitId);
    if (!unit) { App.view.unitId = firstUnitId(); unit = unitById(App.view.unitId); }

    // 模块导航条
    var modHtml = '<div class="module-nav" id="moduleNav">' +
      MODULES.map(function (m) {
        var active = App.view.module === m;
        var extra = "";
        if (m === "同步内容" || m === "易错点" || m === "每日练习" || m === "单元测") {
          extra = unitDropdown(unit.unit_id);
        }
        return '<div class="mod-wrap ' + (active ? "active" : "") + '" data-mod="' + esc(m) + '">' +
          '<button class="mod-btn">' + esc(m) + '</button>' + extra + '</div>';
      }).join("") +
      '</div>';

    var html = '<section class="page subject">' +
      '<div class="subject-head">' +
        '<h2>' + esc(unit.unit) + '</h2>' +
      '</div>' +
      modHtml +
      '<div class="mcontent" id="mcontent"></div>' +
      '</section>';
    mainEl.innerHTML = html;

    // 绑定模块切换
    Array.prototype.forEach.call(document.querySelectorAll("#moduleNav [data-mod]"), function (w) {
      w.querySelector(".mod-btn").addEventListener("click", function () {
        App.view.module = w.getAttribute("data-mod");
        renderSubject();

  // 公共：手写板（Canvas）—— 触屏/鼠标写汉字；离线无法OCR，写完提示家长复核
  function mountHandwrite(host, q, qz) {
    var wrap = host.querySelector("#hwWrap");
    if (!wrap) return;
    var canvas = wrap.querySelector("#hwCanvas");
    var ctx = canvas.getContext("2d");
    var drawing = false, last = null, hasInk = false;
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
    }
    function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
    function move(e) {
      if (!drawing) return; e.preventDefault();
      var p = pos(e); ctx.strokeStyle = "#1f2d3d"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; hasInk = true;
    }
    function end() { drawing = false; }
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    var clearBtn = wrap.querySelector("#hwClear");
    if (clearBtn) clearBtn.addEventListener("click", function () { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; });
    var actions = host.querySelector("#qActions");
    actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
    actions.querySelector("#submitBtn").addEventListener("click", function () {
      if (!hasInk) { Pet.say("先在框里写一写哦～", 1800); return; }
      var fb = host.querySelector("#qFeedback");
      fb.innerHTML = '<div class="fb ok">✍️ 写得真认真！请家长看看你写对了吗～<br><span class="an">' +
        esc(q.analysis || ("正确答案：" + q.answer)) + '</span></div>';
      afterAnswer(true, q, qz, host, "手写-家长复核");
    });
  }

  // 公共：录音（WebRTC MediaRecorder）—— 离线录音回放；不支持则降级隐藏按钮
  function mountRecorder(host, q, onRecorded) {
    var box = host.querySelector("#recBox");
    if (!box) return false;
    var recBtn = box.querySelector("#recBtn");
    var playBtn = box.querySelector("#playBtn");
    var status = box.querySelector("#recStatus");
    var supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    if (!supported) { recBtn.style.display = "none"; status.textContent = "本设备不支持录音，直接点下面的按钮自评吧～"; return false; }
    var stream = null, mr = null, chunks = [], url = null;
    recBtn.addEventListener("click", function () {
      if (!stream) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
          stream = s; mr = new MediaRecorder(s);
          mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
          mr.onstop = function () {
            var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
            if (url) URL.revokeObjectURL(url);
            url = URL.createObjectURL(blob);
            playBtn.style.display = "";
            playBtn.onclick = function () { new Audio(url).play(); };
            status.textContent = "录好了，点 ▶️ 回放听听～";
            if (onRecorded) onRecorded();
          };
          mr.start(); chunks = []; recBtn.textContent = "⏹ 停止"; status.textContent = "正在录音…";
        }).catch(function () { status.textContent = "没拿到麦克风权限，点下面自评吧～"; recBtn.style.display = "none"; });
        return;
      }
      if (mr && mr.state === "recording") { mr.stop(); recBtn.textContent = "🎤 录音"; stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    });
    return true;
  }
