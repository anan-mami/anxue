  function bindQuestion(host, q, qz) {
    var stemBtn = host.querySelector(".q-voice-stem");
    if (stemBtn) {
      stemBtn.addEventListener("click", function () { speak(stemBtn, q.stem, q.audio ? q.audio.stem : null); });
    }
    var t = QUESTION_TYPES[q.type] || QUESTION_TYPES.__default;
    t.bind(host, q, qz);
  }

  function afterAnswer(correct, q, qz, host, userAns) {
    // 答对：每题都扣饱腹 + 加经验 + 累加 doneCount（关键：旧逻辑把"每题通知"吞了，导致做完 15 题宠物装都不动）
    if(correct){
      notifyPetStudy(0, 3);  // 每题扣饱腹3
    }
    // 食物：每天只给 1 份（防爆量；第二天再答对再给 1 份）
    if(correct){
      var todayStr = new Date().toDateString();
      if(localStorage.getItem("pet_food_date") !== todayStr){
        localStorage.setItem("pet_food_date", todayStr);
        notifyPetStudy(1, 0);  // 当天首次答对：+1 食物触发 settle 弹层
      }
    }
    S.recordAttempt(q.id, qz.ctx.unitId, qz.ctx.module, qz.ctx.level, userAns != null ? userAns : (correct ? "对" : "错"), correct);
    var feedback = host.querySelector("#qFeedback");
    var fbVoice = (q.audio) ? ' <button type="button" class="speak-btn q-voice-fb">🔊 读解析</button>' : '';
    if (correct) {
      qz.correct += 1;
      feedback.innerHTML = '<div class="fb ok">✅ 答对啦！' + fbVoice + '<br><span class="an">' + esc(q.analysis) + '</span></div>';
      Pet.say(pickEncourage(), 2000);
    } else {
      feedback.innerHTML = '<div class="fb bad">❌ 再想想～<br><b>正确答案：</b>' + esc(q.answer) +
        fbVoice + '<br><span class="an">' + esc(q.analysis) + '</span></div>';
      Pet.say("没关系，看看解析，下次一定行！", 2400);
    }
    var fbBtn = feedback.querySelector(".q-voice-fb");
    if (fbBtn) {
      fbBtn.addEventListener("click", function () {
        speakGroup(fbBtn, [
          { text: "正确答案：" + q.answer, key: q.audio ? q.audio.answer : null },
          { text: q.analysis, key: q.audio ? q.audio.analysis : null }
        ]);
      });
    }
    var actions = host.querySelector("#qActions");
    actions.innerHTML = '<button class="btn primary" id="nextBtn">' + (qz.idx + 1 >= qz.qs.length ? "看结果 🎉" : "下一题 →") + '</button>';
    actions.querySelector("#nextBtn").addEventListener("click", function () {
      qz.idx += 1;
      if (qz.idx >= qz.qs.length) { qz.finished = true; }
      renderQuiz(host);
    });
    updateMistakeCount();
  }

  function renderQuizResult(host) {
    var qz = App.quiz;
    var total = qz.qs.length;
    var acc = total > 0 ? qz.correct / total : 0;
    var thr = S.thresholdFor(BOOK.meta.grade);
    var html = '<div class="quiz-result">' +
      '<div class="result-emoji">' + (acc >= thr ? "🎉" : acc >= 0.7 ? "💪" : "🌱") + '</div>' +
      '<h2>本次 ' + esc(qz.ctx.title) + '</h2>' +
      '<div class="result-ring" style="--p:' + Math.round(acc * 100) + '"><span>' + Math.round(acc * 100) + '%</span></div>' +
      '<p>答对 ' + qz.correct + ' / ' + total + ' 题</p>';

    if (qz.ctx.module === "每日练习" && qz.ctx.level) {
      var passed = S.markLevelSession(BOOK, qz.ctx.unitId, qz.ctx.level, acc);
      if (passed) {
        var nextLv = qz.ctx.level === "基础" ? "提高" : (qz.ctx.level === "提高" ? "拓展" : null);
        html += '<p class="unlock-ok">🎯 本阶已达标！' + (nextLv ? '已解锁「' + nextLv + '」阶～' : '已是最高阶！') + '</p>';
        if (nextLv && S.awardBadge("lvl_" + qz.ctx.unitId + "_" + qz.ctx.level, "过关·" + qz.ctx.level, "⭐")) {
          html += '<p class="badge-get">获得徽章 ⭐ 过关·' + esc(qz.ctx.level) + '</p>';
        }
        toast("🎯 本阶达标！宠物收到 +1 食物，去小屋看看 →");
      } else {
        html += '<p class="unlock-no">还需努力：本阶正确率需达到 ' + Math.round(thr * 100) + '% 才解锁下一阶（本次 ' + Math.round(acc * 100) + '%）。</p>';
        toast("差一点点，再练练基础就能解锁下一阶～");
      }
      S.markDaily("daily_" + qz.ctx.unitId);
    }
    if (qz.ctx.module === "单元测") {
      if (acc >= thr) {
        if (S.awardBadge("ut_" + qz.ctx.unitId, "单元测过关", "🏆")) {
          html += '<p class="badge-get">获得徽章 🏆 单元测过关</p>';
        }
        toast("🏆 单元测过关！宠物收到 +1 食物，去小屋看看 →");
      } else {
        toast("单元测再复习一下，下次拿满分～");
      }
      S.markDaily("unit_test_" + qz.ctx.unitId);
    }
    // 宠物联动展示（一目了然：完成学习→为宠物+1 食物）
    html += '<div class="pet-link"><div class="pet-link-icon">🐾</div>' +
      '<div class="pet-link-text"><b>本次学习已为宠物送去</b><br>' +
      '<span class="pet-link-reward">+1 食物 · 经验↑ 心情↑</span></div>' +
      '<button class="btn primary" id="goPetBtn" style="margin-left:auto;">🐾 去宠物小屋看看</button></div>';
    html += '<div class="result-actions"><button class="btn" id="againBtn">再做一次</button>' +
      '<button class="btn ghost" id="backBtn">返回</button></div></div>';
    host.innerHTML = html;
    host.querySelector("#againBtn").addEventListener("click", function () { startQuiz(host, qz.qs, qz.ctx); });
    host.querySelector("#backBtn").addEventListener("click", function () {
      if (App.view.page === "mistakes") renderMistakes();
      else renderSubject();
    });
    host.querySelector("#goPetBtn").addEventListener("click", function () { navigate({ page: "pet" }); });
    notifyPetStudy(2, 0);  // 一轮学习完成 → +2 食物触发 settle 弹层
  }

  /* ----------------------------- 学情看板 ----------------------------- */
  function renderProgress() {
    var overall = S.overallAccuracy(BOOK);
    var html = '<section class="page progress"><h2>📊 学情看板（' + esc(App.view.subject) + '·' + esc(App.view.semester) + '）</h2>' +
      '<p class="progress-tip">每个单元的颜色只由「基础题」正确率决定：基础题答对 ≥95% 即“已掌握”。</p>' +
      '<div class="ov-card"><div class="ring big" style="--p:' + Math.round(overall * 100) + '"><span>' + Math.round(overall * 100) + '%</span></div>' +
      '<div><p>总正确率</p><p class="sub">错题本待巩固：' + S.mistakeCount() + ' 题</p>' +
      '<p class="legend"><span class="dot green"></span>已掌握≥95%　<span class="dot yellow"></span>待巩固70-95%　<span class="dot red"></span>薄弱&lt;70%</p></div></div>' +
      '<div class="unit-bars">';
    BOOK.toc.forEach(function (t) {
      var uid = findUnitsByTocId(t.id);
      var acc = S.unitAccuracy(BOOK, uid);
      var pct = acc.answered ? Math.round(acc.accuracy * 100) : 0;
      var label = acc.answered ? ({ green: "已掌握", yellow: "待巩固", red: "薄弱" }[acc.color]) : "未开始";
      html += '<div class="ubar-row"><span class="ubar-name">' + esc(t.title) + '</span>' +
        '<span class="ubar-track"><span class="ubar-fill ' + (acc.answered ? acc.color : "none") + '" style="width:' + pct + '%"></span></span>' +
        '<span class="ubar-pct">' + (acc.answered ? pct + '% · ' + label : "—") + '</span></div>';
    });
    html += '</div>';
    var badges = S.state().pet.badges;
    html += '<h3>🏅 徽章墙</h3><div class="badge-wall">';
    if (!badges.length) html += '<p class="sub">还没获得徽章，去练习解锁吧！</p>';
    badges.forEach(function (b) { html += '<span class="badge-item">' + esc(b.icon) + ' ' + esc(b.title) + '</span>'; });
    html += '</div></section>';
    mainEl.innerHTML = html;
  }

  /* ----------------------------- 错题本 ----------------------------- */
  function renderMistakes() {
    var ms = S.getMistakes();
    var html = '<section class="page mistakes"><h2>📕 错题本</h2>';
    if (!ms.length) {
      html += '<div class="empty">🎉 暂时没有错题，继续保持！</div>';
      mainEl.innerHTML = html; return;
    }
    html += '<p class="sub">共 ' + ms.length + ' 道待巩固。点“重做”再练一次，做对即移除。</p><div id="mmBody"></div></section>';
    mainEl.innerHTML = html;
    renderMistakeList(document.getElementById("mmBody"), ms);
  }

  function renderMistakeList(host, ms) {
    var html = '<div class="mm-list">';
    ms.forEach(function (m, idx) {
      var found = findQuestionGlobal(m.qid);
      if (!found) return;
      var unit = found.unit, q = found.q;
      var voiceBtn = (q.audio) ? '<button type="button" class="speak-btn mm-voice" data-i="' + idx + '">🔊 读一听</button>' : '';
      html += '<div class="mm-card" data-qid="' + esc(m.qid) + '">' +
        '<div class="mm-meta"><span class="tag">' + esc(unit ? unit.unit : m.unitId) + '</span>' +
        '<span class="tag gray">' + esc(m.module) + (m.level ? "·" + esc(m.level) : "") + '</span></div>' +
        '<div class="mm-stem">' + esc(q.stem) + voiceBtn + '</div>' +
        (q.image ? '<div class="mm-img"><img src="' + esc(q.image) + '" alt=""></div>' : '') +
        '<div class="mm-ans"><span class="bad">你的：' + esc(m.userAnswer || "（未答）") + '</span>　<span class="good">正确：' + esc(q.answer) + '</span></div>' +
        '<div class="mm-an">' + esc(q.analysis) + '</div>' +
        '<button class="btn small redo" data-qid="' + esc(m.qid) + '">重做</button>' +
        '</div>';
    });
    html += '</div>';
    host.innerHTML = html;
    Array.prototype.forEach.call(host.querySelectorAll(".redo"), function (b) {
      b.addEventListener("click", function () { redoOne(b.getAttribute("data-qid")); });
    });
    Array.prototype.forEach.call(host.querySelectorAll(".mm-voice"), function (btn) {
      btn.addEventListener("click", function () {
        var m = ms[parseInt(btn.getAttribute("data-i"), 10)];
        var unit = unitById(m.unitId);
        var q = findQuestion(m.qid, unit);
        if (!q || !q.audio) return;
        speakGroup(btn, [
          { text: q.stem, key: q.audio.stem },
          { text: "正确答案：" + q.answer, key: q.audio.answer },
          { text: q.analysis, key: q.audio.analysis }
        ]);
      });
    });
  }

  function findQuestion(qid, unit) {
    if (!unit) return null;
    var all = [];
    ["基础", "提高", "拓展"].forEach(function (lv) { (unit.daily[lv] || []).forEach(function (q) { all.push(q); }); });
    (unit.unit_test || []).forEach(function (q) { all.push(q); });
    return all.filter(function (q) { return q.id === qid; })[0] || null;
  }

  // 跨学科/跨册查找题目（错题本用：错题可能来自任意学科任意册，不能只查当前 BOOK）
  function findQuestionGlobal(qid) {
    var subs = window.LEARNING_BOOK.platform.subjects || [];
    for (var s = 0; s < subs.length; s++) {
      var vols = subs[s].volumes || {};
      for (var vn in vols) {
        var units = (vols[vn] || {}).units || [];
        for (var u = 0; u < units.length; u++) {
          var q = findQuestion(qid, units[u]);
          if (q) return { q: q, unit: units[u] };
        }
      }
    }
    return null;
  }

  function redoOne(qid) {
    var found = findQuestionGlobal(qid);
    if (!found) return;
    var q = found.q, fu = found.unit;
    var host = document.getElementById("mmBody");
    startQuiz(host, [q], { unitId: fu.unit_id, module: "错题本", level: null, title: "错题重做" });
    setTimeout(function () {
      var back = document.getElementById("backBtn");
      if (back) back.addEventListener("click", function () { renderMistakes(); updateMistakeCount(); });
    }, 0);
  }

  /* ----------------------------- 宠物页 ----------------------------- */
  function renderPetPage() {
    mainEl.innerHTML =
      '<section class="page pet-page" style="padding:0;max-width:none;">' +
        '<iframe id="petFrame" src="pet_v2_preview.html" ' +
        'style="width:100%;height:calc(100vh - 120px);border:none;border-radius:16px;background:#fff5ee;display:block;"></iframe>' +
      '</section>';
  }

  /* ----------------------------- 杂项 ----------------------------- */
  function emptyHint(t) { return '<div class="empty">' + esc(t) + '</div>'; }
  function updateMistakeCount() {
    var mc = document.getElementById("mcCount");
    if (mc) mc.textContent = S.mistakeCount();
  }
  function pickEncourage() {
    var arr = ["真棒！", "对的，就是这样！", "你越来越厉害了～", "答对啦，给你点赞！", "继续保持哦！"];
    return arr[Math.floor(Math.random() * arr.length)];
  }
  // 数据备份/恢复（换设备/清缓存后一键还原，含宠物数据）
  function makeBackupCode() {
    try {
      var lt = localStorage.getItem("LT_STATE_V1") || "";
      var pet = localStorage.getItem("pet_v2_preview") || "";
      return btoa(encodeURIComponent(JSON.stringify({ v: 1, lt: lt, pet: pet })));
    } catch (e) { toast("备份失败：" + e.message); return ""; }
  }
  function restoreFromCode(code) {
    try {
      var obj = JSON.parse(decodeURIComponent(atob(code)));
      if (!obj || obj.v !== 1) throw new Error("备份码无效");
      if (obj.lt) localStorage.setItem("LT_STATE_V1", obj.lt);
      if (obj.pet) localStorage.setItem("pet_v2_preview", obj.pet);
      toast("✅ 进度已恢复，即将刷新");
      setTimeout(function () { location.reload(); }, 1500);
    } catch (e) { toast("❌ 恢复失败：" + e.message); }
  }

  /* ==================== 激活码解锁 ==================== */
  var LICENSE = {
    SEED: 'anxue-qd-g1-v1-2026',        // 必须与 0_工具链/_codegen.js 的 SEED 一致
    LOCK_TRIAL: false,                  // 体验版默认不锁；正式收费改成 true
    KEY: 'anxue_license',
    get: function () { try { return localStorage.getItem(this.KEY) || ""; } catch (e) { return ""; } },
    isUnlocked: function () { return !!this.get(); },
    sha256: function (s) {
      var buf = new TextEncoder().encode(s);
      return crypto.subtle.digest('SHA-256', buf).then(function (d) {
        return Array.from(new Uint8Array(d)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    },
    verify: function (code) {
      var c = String(code || "").toUpperCase().replace(/[^A-F0-9]/g, "");
      if (c.length !== 16) return Promise.resolve(false);
      var salt = c.slice(0, 12), sig = c.slice(12);
      return this.sha256(this.SEED + salt).then(function (h) {
        return h.slice(0, 4).toUpperCase() === sig;
      });
    },
    unlock: function (code) {
      return this.verify(code).then(function (ok) {
        if (ok) { try { localStorage.setItem(LICENSE.KEY, String(code).toUpperCase()); } catch (e) {} }
        return ok;
      });
    }
  };
  function openLicModal(msg) {
    var m = document.getElementById("licMask");
    if (!m) return;
    m.style.display = "flex";
    var box = document.getElementById("licInput");
    var msgEl = document.getElementById("licMsg");
    var btn = document.getElementById("licBtn");
    box.value = ""; msgEl.textContent = msg || "";
    box.focus();
    function tryUnlock() {
      var code = box.value.trim();
      if (!code) { msgEl.textContent = "请输入激活码"; return; }
      btn.disabled = true; btn.textContent = "验证中…";
      LICENSE.unlock(code).then(function (ok) {
        btn.disabled = false; btn.textContent = "解锁全部内容";
        if (ok) {
          msgEl.style.color = "#2ecc71";
          msgEl.textContent = "✅ 激活成功！正在刷新…";
          setTimeout(function () { location.reload(); }, 1200);
        } else {
          msgEl.style.color = "#e74c3c";
          msgEl.textContent = "❌ 激活码无效，请检查后重试";
        }
      });
    }
    btn.onclick = tryUnlock;
    box.onkeydown = function (e) { if (e.key === "Enter") tryUnlock(); };
    document.getElementById("licClose").onclick = function () { m.style.display = "none"; };
  }

  // 学习完成 → 通知新宠物系统（写共享 localStorage，宠物小屋启动时结算）
  // 签名：notifyPetStudy(food, full) — 食物奖励累加 + 饱腹扣减通知；直调 iframe 内结算
  function notifyPetStudy(food, full) {
    try {
      if (food) {
        var key = "pet_study_pending";
        var cur = parseFloat(localStorage.getItem(key) || "0");
        localStorage.setItem(key, String(Math.round((cur + food) * 10) / 10));
      }
      if (full) {
        var dk = "pet_full_pending";
        var dcur = parseFloat(localStorage.getItem(dk) || "0");
        localStorage.setItem(dk, String(Math.round((dcur + full) * 10) / 10));
      }
      // 立即尝试直调 iframe 内结算（storage 事件在单窗口 iframe 不触发，需手动同步）
      try{
        var pf = document.getElementById("petFrame");
        if(pf && pf.contentWindow && typeof pf.contentWindow.settlePendingStudy === "function"){
          pf.contentWindow.settlePendingStudy();
        }
      }catch(ee){}
    } catch (e) {}
  }
  function greet(tick) {
    if (tick.absentDays >= 2) Pet.say("好久没见你啦，今天来玩" + App.view.subject + "吧！(´•︵•`)", 3600);
    else if (tick.mood === "hungry") Pet.say("我有点饿啦，点右下角 🍚 喂我一下嘛～", 3200);
    else Pet.say("嗨！我们一起学" + App.view.subject + "吧～(✿◡‿◡)", 3000);
  }

  /* ----------------------------- 名字输入 ----------------------------- */
  function showNameModal() {
    var modal = document.getElementById("nameModal");
    var input = document.getElementById("nameInput");
    var save = document.getElementById("nameSaveBtn");
    modal.style.display = "flex";
    input.focus();
    function doSave() {
      var v = input.value.trim();
      if (!v) { input.classList.add("shake"); setTimeout(function(){ input.classList.remove("shake"); }, 500); return; }
      S.state().userName = v;
      S.save();
      modal.style.display = "none";
      render();
      greet(S.petTick());
    }
    save.addEventListener("click", doSave);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") doSave(); });
  }

  /* ----------------------------- 图片点击放大 ----------------------------- */
  function setupImageZoom() {
    document.addEventListener("click", function (e) {
      var t = e.target;
      if (t.tagName === "IMG" && (t.closest(".q-img") || t.closest(".kp-img") || t.closest(".mm-img"))) {
        var box = document.createElement("div");
        box.className = "lightbox";
        box.innerHTML = '<img src="' + esc(t.src) + '" alt="">';
        document.body.appendChild(box);
        box.addEventListener("click", function () { box.remove(); });
      }
    });
  }

  /* ----------------------------- 启动 ----------------------------- */
  function init() {
    buildLayout();
    // 删掉右下角旧 SVG 猫挂件（用户已在新宠物小屋选了自己喜欢的宠物，不显示旧"小喵"）
    if (petHostEl && petHostEl.parentNode) petHostEl.parentNode.removeChild(petHostEl);
    setupImageZoom();
    setBook(); // 首次进入即确定当前册数据
    if (!S.state().userName) {
      renderSubjectNav();
      showNameModal();
    } else {
      render();
      var tick = S.petTick();
      greet(tick);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();

  window.App = App;
})();

</script></script>
