": "80", "analysis": "30+50=80。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_q4_stem", "answer": "m1b_math1b_u2_u2_q4_answer", "analysis": "m1b_math1b_u2_u2_q4_analysis"}}, {"id": "u2_q5", "type": "choice", "knowledge_point": "kp_u2_4", "stem": "64加5等于多少？", "answer": "69", "analysis": "64+5=69。", "image": null, "options": ["59", "69", "70"], "audio": {"stem": "m1b_math1b_u2_u2_q5_stem", "answer": "m1b_math1b_u2_u2_q5_answer", "analysis": "m1b_math1b_u2_u2_q5_analysis"}}, {"id": "u2_q6", "type": "fill", "knowledge_point": "kp_u2_5", "stem": "百数表中，39下面的数是（ ）。", "answer": "49", "analysis": "39+10=49。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_q6_stem", "answer": "m1b_math1b_u2_u2_q6_answer", "analysis": "m1b_math1b_u2_u2_q6_analysis"}}, {"id": "u2_q7", "type": "judge", "knowledge_point": "kp_u2_1", "stem": "十位上是7、个位上是1的数是71。", "answer": "对", "analysis": "十位7个位1写作71。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_q7_stem", "answer": "m1b_math1b_u2_u2_q7_answer", "analysis": "m1b_math1b_u2_u2_q7_analysis"}}, {"id": "u2_q8", "type": "choice", "knowledge_point": "kp_u2_3", "stem": "下面哪个数最大？", "answer": "82", "analysis": "82>75>68。", "image": null, "options": ["68", "75", "82"], "audio": {"stem": "m1b_math1b_u2_u2_q8_stem", "answer": "m1b_math1b_u2_u2_q8_answer", "analysis": "m1b_math1b_u2_u2_q8_analysis"}}], "mid_test": [], "final_test": [], "pages": [{"image": "assets/math_pages/下册/p153.png", "title": "教材原页 P153", "knowledge_points": [{"title": "21里面有2个十和1个一", "explain": "情境图：丰收的胡萝卜地，用一捆一捆（10个一捆）数。一、二、三……二十，再添1是二十一。我来摆一摆：十位上有2个珠子表示2个十，个位上有1个珠子表示1个一，写作21，读作二十一。", "key": "十位·个位·数位"}]}, {"image": "assets/math_pages/下册/p154.png", "title": "教材原页 P154", "knowledge_points": [{"title": "二十九添1是三十，九十九添1是一百", "explain": "接着数……二十九，再添1是三十（个位满十进1到十位）。继续数……九十九，再添1是多少？从右边起第三位是百位（写作100，读作一百）。还可以十根十根地数：十、二十、三十……九十、一百。两个9表示的意思一样吗（99与100的9不同）。", "key": "满十进1·百位"}]}, {"image": "assets/math_pages/下册/p155.png", "title": "教材原页 P155", "knowledge_points": [{"title": "100有多大", "explain": "10个十是一百。生活中例子：一盒一盒地数鸡蛋（1盒10个，10盒100个）；一包一包地数书（1包10本，10包100本）。练习1数一数；练习2看图写数（2把牙刷→20把，3支牙膏→30支）；练习3读一读写一写（二十七=27, 五十, 六十八, 一百, 27, 五十, 74, 99）。", "key": "10×10=100"}]}, {"image": "assets/math_pages/下册/p156.png", "title": "教材原页 P156", "knowledge_points": [{"title": "数轴填数与计数器表示", "explain": "练习4：数轴上填数（0,10,20,□,50,60,□,80,□；91,□,□,95,□,97,98,□,□）；练习5：填一填（小棒由几个十和几个一组成、计数器各位是几表示的数、100的百位上是1）；练习6：估一估30/50/70颗图钉哪个合适；练习7：国旗护卫队66名写数并说各位意义。", "key": "数轴·估算·数位"}]}, {"image": "assets/math_pages/下册/p157.png", "title": "教材原页 P157", "knowledge_points": [{"title": "100以内数的读写与顺序", "explain": "练习8：全班44人取餐，已取到39号，已取几人还剩几人；练习9：计数器在十位/个位上各加1珠子后表示的数；练习10连一连（100/48/73/56/60/37/65 与 6个十5个一=65, 10个十=100, 十位3个位7=37, 48个一=48）；练习11接龙游戏（45,46,47…；45,50,55…；45,44,43…；45,55,65…）。", "key": "递增·跳数·组成"}]}, {"image": "assets/math_pages/下册/p158.png", "title": "教材原页 P158", "knowledge_points": [{"title": "计数器表示数的多样性", "explain": "练习12：在计数器上拨3个珠子可以表示哪些数（12/21/3/30/102等）。课外实践：数一数《百福图》是不是正好100个福字。文化广角：古埃及象形数字（1-10用竖线/10用拱门/100用绳子螺旋），猜一猜𓂝𓏏𓎆表示24，能用以上记数方法表示58吗。", "key": "百数表+象形数字"}]}, {"image": "assets/math_pages/下册/p159.png", "title": "教材原页 P159", "knowledge_points": [{"title": "比较两位数大小", "explain": "情境图：丽丽摘42个、心心摘35个、乐乐摘48个南瓜。丽丽和心心谁摘得多？42○35。两种方法：用小棒摆摆看（42有4个十，35有3个十，先比十位，十位大的数就大）；在数线上找一找（42在35的右边，所以42比35大）。", "key": "先比十位·再比个位"}]}, {"image": "assets/math_pages/下册/p160.png", "title": "教材原页 P160", "knowledge_points": [{"title": "100以内数的大小比较", "explain": "丽丽和乐乐谁摘得多？妈妈34平平20爸爸87谁摘得多谁摘得少（87>34>20）。怎样比较百以内数的大小？先比十位，十位相同再比个位。练习1：用计数器比大小；练习2圈出每组较大的数（27/31, 54/45, 76/79）；练习3在○里填>或<（23○29, 56○46, 35○53, 9○21）。", "key": "十位优先"}]}, {"image": "assets/math_pages/下册/p161.png", "title": "教材原页 P161", "knowledge_points": [{"title": "多角度比较", "explain": "练习4：火车厢88/79/100/90个西瓜，最多（3号100个）、最少（2号79个），4号比1号和3号少但比2号多，从大到小排序100>90>88>79。练习5：心心跳得比乐乐（40下）多，珍珍跳得比乐乐少，从9/37/45/82中选（45和9）。练习6：数每个字由多少■组成（共/西/国）再比大小。", "key": "多条件比·数格"}]}, {"image": "assets/math_pages/下册/p162.png", "title": "教材原页 P162", "knowledge_points": [{"title": "估算与数的组合", "explain": "练习7选一选：60个鸡蛋正好装满一盒，用这个盒子装鹅蛋能装多少？①<60②=60③>60④不确定（③）。数线上□□最可能是哪个组合（50-60之间52和64/58和64/55和69/58和69，58和69符合位置）。练习8小游戏猜多少；练习9：3、5、9任抽两张组数最大953最小359。聪明小屋找规律0,30,60,□（90）和100,80,60,□,20（40）。", "key": "估·组合·规律"}]}, {"image": "assets/math_pages/下册/p163.png", "title": "教材原页 P163", "knowledge_points": [{"title": "整十数加减整十数", "explain": "情境图：妈妈摘30个、阳阳摘6个、爸爸摘40个石榴。爸爸和妈妈一共摘了多少？40+30=□。我来摆一摆：4个十和3个十合起来是7个十，40+30=70。你能根据40+30=70写出两个减法算式吗？70-40=30, 70-30=40。30+6=36也是类似的合起来思想。", "key": "几个十合起来"}]}, {"image": "assets/math_pages/下册/p164.png", "title": "教材原页 P164", "knowledge_points": [{"title": "整十数加减法", "explain": "根据30+6=36写出两个减法算式（36-30=6, 36-6=30）。练习1看小棒写加减法算式（3捆+2捆=5捆=50, 50-30=20, 50-20=30）；练习2算式（1+5, 6+3, 9-7, 8-2, 10+50, 60+30, 90-70, 80-20）；练习4混合算式；练习5停车场90个已用20个还剩70辆；练习640+9个五角星分给42人够吗。", "key": "加减法对照·应用"}]}, {"image": "assets/math_pages/下册/p165.png", "title": "教材原页 P165", "knowledge_points": [{"title": "认识百数表", "explain": "百数表是一张10×10的方格，按1-100排列。还能提出什么问题？百数表中数的排列有什么规律？横着看：从第2行起，除了最后一列，同一行上其他数与最后一列的十位相同（如11-19十位都是1）。竖着看：同一列上的数个位都相同（如1,11,21,…,91）。", "key": "横看十位同·竖看个位同"}]}, {"image": "assets/math_pages/下册/p166.png", "title": "教材原页 P166", "knowledge_points": [{"title": "斜着看与按规律填数", "explain": "斜着看：我发现11,22,33,44,55,66,77,88,99（红绿交替），斜行十位和个位都增加1。按百数表规律填空：17相邻格、42/43十字格、77阶梯格。练习1按规律填数（21,22,23,_,_,_→24,25,26；21,31,_,_,61,_→41,51,71；22,33,44,_,_,_→55,66,77；60,59,_,_,56,_→58,57,55）。", "key": "对角线·规律填数"}]}, {"image": "assets/math_pages/下册/p167.png", "title": "教材原页 P167", "knowledge_points": [{"title": "百数表推理", "explain": "练习2按百数表排列规律填空格（89上下左右、59十字格、64/73/75/83阶梯、54/63/64/74十字、33/42十字、12/13/23/34）。练习3按要求写数（最小的两位数=10, 最大的两位数=99, 100以内的整十数=10/20/30/.../100）。练习4从1写到100有多少个8（个位是8的10个+十位是8的10个=20个）。练习5报数20人单数/双数各10个；练习6两位数十位个位之和=7的数有16,25,34,43,52,61,70共7个。", "key": "分类·推理"}]}, {"image": "assets/math_pages/下册/p168.png", "title": "教材原页 P168", "knowledge_points": [{"title": "单元总结", "explain": "我学会了吗？电影院3号厅银幕100座，已售/可选；练习2算式（40+40, 9+60, 37-30, 40+7, 56-6, 85-5, 8+50, 60+30）；练习3鸡21天、信天翁82天、鸵鸟42天孵化期比较。问题口袋：我认识的数更多、我能用摆小棒的方法比较数的大小、我会根据数的意义计算整十数加减整十数。丰收园：会观察/会提问/会思考/会表达/会应用。", "key": "百内数·比较·整十加减"}]}]}, {"unit_id": "math1b_u3", "unit": "第三单元 玩转图形——认识平面图形", "image": "assets/images/img_3feb222571c7.jpg", "knowledge_points": [{"id": "kp_u3_1", "title": "用立体图形描平面图形", "image": "assets/images/img_3feb222571c7.jpg", "explain": "把长方体、正方体、圆柱、三棱柱等立体图形平平的面放在纸上，沿着边描一描，就能画出长方形、正方形、圆、三角形等平面图形。球没有平平的面，描不出平面图形。", "key": "立体图形上有平平的面，把面放在纸上沿边描，可以得到对应的平面图形。", "audio": {"title": "m1b_math1b_u3_kp_u3_1_title", "explain": "m1b_math1b_u3_kp_u3_1_explain", "key": "m1b_math1b_u3_kp_u3_1_key"}}, {"id": "kp_u3_2", "title": "认识长方形、正方形、三角形、圆和平行四边形", "image": "assets/images/img_5f0166d9b540.jpg", "explain": "描出来的图形可以按形状分一分：长长方方、四个角都是直角的叫长方形；四边一样长的是正方形；三条边围成的是三角形；由曲线围成的是圆；两组对边分别平行的是平行四边形。", "key": "长方形、正方形都有4条边4个角；三角形有3条边；圆是曲线图形；平行四边形对边平行。", "audio": {"title": "m1b_math1b_u3_kp_u3_2_title", "explain": "m1b_math1b_u3_kp_u3_2_explain", "key": "m1b_math1b_u3_kp_u3_2_key"}}, {"id": "kp_u3_3", "title": "图形拼组", "image": "assets/images/img_fb05ac7bf55c.jpg", "explain": "用学过的平面图形可以拼出有趣的图案。比如“牧童骑黄牛”这幅画，用了长方形、正方形、平行四边形、三角形和圆。拼组时要注意不同图形的边和角怎样对接。", "key": "几种基本图形可以拼成新的图案，拼的时候要看清边的长短和角的大小。", "audio": {"title": "m1b_math1b_u3_kp_u3_3_title", "explain": "m1b_math1b_u3_kp_u3_3_explain", "key": "m1b_math1b_u3_kp_u3_3_key"}}, {"id": "kp_u3_4", "title": "创意拼图案", "image": "assets/images/img_8b792e8d64bb.jpg", "explain": "用平面图形还能拼出凉亭、小房子、救护车、小鸟等图案。拼之前先观察事物由哪些基本图形组成，再选择图形动手拼一拼，可以和别人拼的不一样。", "key": "拼图案要先观察、再想象，选择合适的基本图形进行组合。", "audio": {"title": "m1b_math1b_u3_kp_u3_4_title", "explain": "m1b_math1b_u3_kp_u3_4_explain", "key": "m1b_math1b_u3_kp_u3_4_key"}}, {"id": "kp_u3_5", "title": "七巧板与折纸", "image": "assets/images/img_05be3bf76989.jpg", "explain": "七巧板由7块板组成，其中有5块三角形、1块正方形和1块平行四边形。用七巧板可以拼出小狗、鸵鸟、小鸡等图案。把正方形纸或长方形纸对折两次，还能折出长方形、正方形或三角形。", "key": "七巧板有7块，包括三角形、正方形和平行四边形；折纸可以得到不同的平面图形。", "audio": {"title": "m1b_math1b_u3_kp_u3_5_title", "explain": "m1b_math1b_u3_kp_u3_5_explain", "key": "m1b_math1b_u3_kp_u3_5_key"}}], "error_prone": [{"id": "ep_u3_1", "title": "球描不出平面图形", "desc": "球没有平平的面，滚来滚去，不能像圆柱那样描出圆。只有平平的面才能描出平面图形。", "image": null, "audio": {"title": "m1b_math1b_u3_ep_u3_1_title", "desc": "m1b_math1b_u3_ep_u3_1_desc"}}, {"id": "ep_u3_2", "title": "长方形和正方形要区分", "desc": "长方形是长长方方的，正方形四条边一样长。它们都有4个直角，但边的长短不同。", "image": null, "audio": {"title": "m1b_math1b_u3_ep_u3_2_title", "desc": "m1b_math1b_u3_ep_u3_2_desc"}}, {"id": "ep_u3_3", "title": "三角形有三条边", "desc": "三角形是由三条线段围成的图形，有三条边和三个角，不要和只有曲线的圆混淆。", "image": null, "audio": {"title": "m1b_math1b_u3_ep_u3_3_title", "desc": "m1b_math1b_u3_ep_u3_3_desc"}}, {"id": "ep_u3_4", "title": "数图形要分类", "desc": "数一幅图里有哪些图形时，要按长方形、正方形、三角形、圆、平行四边形分类数，不然容易数漏或数重。", "image": null, "audio": {"title": "m1b_math1b_u3_ep_u3_4_title", "desc": "m1b_math1b_u3_ep_u3_4_desc"}}], "daily": {"基础": [{"id": "u3_b1", "type": "choice", "knowledge_point": "kp_u3_1", "stem": "用圆柱可以描出什么图形？", "answer": "圆", "analysis": "圆柱底面是圆。", "image": null, "options": ["长方形", "圆", "三角形"], "audio": {"stem": "m1b_math1b_u3_u3_b1_stem", "answer": "m1b_math1b_u3_u3_b1_answer", "analysis": "m1b_math1b_u3_u3_b1_analysis"}}, {"id": "u3_b2", "type": "choice", "knowledge_point": "kp_u3_1", "stem": "用正方体可以描出什么图形？", "answer": "正方形", "analysis": "正方体每个面都是正方形。", "image": null, "options": ["长方形", "正方形", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_b2_stem", "answer": "m1b_math1b_u3_u3_b2_answer", "analysis": "m1b_math1b_u3_u3_b2_analysis"}}, {"id": "u3_b3", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "下面哪个是三角形？", "answer": "1", "analysis": "三角形有3条边。", "image": null, "options": ["三角形", "正方形", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_b3_stem", "answer": "m1b_math1b_u3_u3_b3_answer", "analysis": "m1b_math1b_u3_u3_b3_analysis"}}, {"id": "u3_b4", "type": "judge", "knowledge_point": "kp_u3_2", "stem": "长方形和正方形都有4条边。", "answer": "对", "analysis": "它们都有4条边4个角。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_b4_stem", "answer": "m1b_math1b_u3_u3_b4_answer", "analysis": "m1b_math1b_u3_u3_b4_analysis"}}, {"id": "u3_b5", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "圆圆的、没有角的是什么图形？", "answer": "圆", "analysis": "圆没有角。", "image": null, "options": ["圆", "三角形", "长方形"], "audio": {"stem": "m1b_math1b_u3_u3_b5_stem", "answer": "m1b_math1b_u3_u3_b5_answer", "analysis": "m1b_math1b_u3_u3_b5_analysis"}}, {"id": "u3_b6", "type": "choice", "knowledge_point": "kp_u3_3", "stem": "两个同样的三角形可以拼成什么？", "answer": "平行四边形", "analysis": "两个同样的三角形可拼成平行四边形。", "image": null, "options": ["圆", "平行四边形", "三角形"], "audio": {"stem": "m1b_math1b_u3_u3_b6_stem", "answer": "m1b_math1b_u3_u3_b6_answer", "analysis": "m1b_math1b_u3_u3_b6_analysis"}}, {"id": "u3_b7", "type": "judge", "knowledge_point": "kp_u3_1", "stem": "球能描出圆。", "answer": "错", "analysis": "球没有平平的面。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_b7_stem", "answer": "m1b_math1b_u3_u3_b7_answer", "analysis": "m1b_math1b_u3_u3_b7_analysis"}}, {"id": "u3_b8", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "下面哪个是平行四边形？", "answer": "1", "analysis": "平行四边形有两组对边平行。", "image": null, "options": ["平行四边形", "正方形", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_b8_stem", "answer": "m1b_math1b_u3_u3_b8_answer", "analysis": "m1b_math1b_u3_u3_b8_analysis"}}, {"id": "u3_b9", "type": "choice", "knowledge_point": "kp_u3_4", "stem": "用长方形、正方形和三角形可以拼出什么？", "answer": "小房子", "analysis": "可拼成小房子等图案。", "image": null, "options": ["球", "小房子", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_b9_stem", "answer": "m1b_math1b_u3_u3_b9_answer", "analysis": "m1b_math1b_u3_u3_b9_analysis"}}, {"id": "u3_b10", "type": "judge", "knowledge_point": "kp_u3_5", "stem": "七巧板由7块板组成。", "answer": "对", "analysis": "七巧板有7块。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_b10_stem", "answer": "m1b_math1b_u3_u3_b10_answer", "analysis": "m1b_math1b_u3_u3_b10_analysis"}}], "提高": [{"id": "u3_g1", "type": "choice", "knowledge_point": "kp_u3_1", "stem": "用下面哪个物体不能描出平面图形？", "answer": "球", "analysis": "球没有平平的面。", "image": null, "options": ["圆柱", "球", "长方体"], "audio": {"stem": "m1b_math1b_u3_u3_g1_stem", "answer": "m1b_math1b_u3_u3_g1_answer", "analysis": "m1b_math1b_u3_u3_g1_analysis"}}, {"id": "u3_g2", "type": "fill", "knowledge_point": "kp_u3_2", "stem": "正方形有（ ）条边。", "answer": "4", "analysis": "正方形有4条边。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_g2_stem", "answer": "m1b_math1b_u3_u3_g2_answer", "analysis": "m1b_math1b_u3_u3_g2_analysis"}}, {"id": "u3_g3", "type": "choice", "knowledge_point": "kp_u3_3", "stem": "牧童骑黄牛图用了几种图形？", "answer": "5", "analysis": "用了长方形、正方形、平行四边形、三角形、圆共5种。", "image": null, "options": ["3", "4", "5"], "audio": {"stem": "m1b_math1b_u3_u3_g3_stem", "answer": "m1b_math1b_u3_u3_g3_answer", "analysis": "m1b_math1b_u3_u3_g3_analysis"}}, {"id": "u3_g4", "type": "judge", "knowledge_point": "kp_u3_2", "stem": "三角形有3个角。", "answer": "对", "analysis": "三角形有3条边3个角。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_g4_stem", "answer": "m1b_math1b_u3_u3_g4_answer", "analysis": "m1b_math1b_u3_u3_g4_analysis"}}, {"id": "u3_g5", "type": "choice", "knowledge_point": "kp_u3_5", "stem": "七巧板中有几块三角形？", "answer": "5", "analysis": "七巧板有5块三角形。", "image": null, "options": ["3", "5", "7"], "audio": {"stem": "m1b_math1b_u3_u3_g5_stem", "answer": "m1b_math1b_u3_u3_g5_answer", "analysis": "m1b_math1b_u3_u3_g5_analysis"}}, {"id": "u3_g6", "type": "choice", "knowledge_point": "kp_u3_4", "stem": "把一张正方形纸对折两次，可能折出什么图形？", "answer": "正方形", "analysis": "可得到正方形、长方形或三角形。", "image": null, "options": ["圆", "正方形", "球"], "audio": {"stem": "m1b_math1b_u3_u3_g6_stem", "answer": "m1b_math1b_u3_u3_g6_answer", "analysis": "m1b_math1b_u3_u3_g6_analysis"}}], "拓展": [{"id": "u3_t1", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "下面图形中，哪个有四条一样长的边？", "answer": "正方形", "analysis": "正方形四边相等。", "image": null, "options": ["长方形", "正方形", "三角形"], "audio": {"stem": "m1b_math1b_u3_u3_t1_stem", "answer": "m1b_math1b_u3_u3_t1_answer", "analysis": "m1b_math1b_u3_u3_t1_analysis"}}, {"id": "u3_t2", "type": "judge", "knowledge_point": "kp_u3_1", "stem": "长方体有长方形和正方形的面。", "answer": "对", "analysis": "长方体可能有长方形面，特殊的有正方形面。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_t2_stem", "answer": "m1b_math1b_u3_u3_t2_answer", "analysis": "m1b_math1b_u3_u3_t2_analysis"}}, {"id": "u3_t3", "type": "choice", "knowledge_point": "kp_u3_5", "stem": "一套七巧板中，正方形和平行四边形一共有几块？", "answer": "2", "analysis": "1+1=2。", "image": null, "options": ["1", "2", "3"], "audio": {"stem": "m1b_math1b_u3_u3_t3_stem", "answer": "m1b_math1b_u3_u3_t3_answer", "analysis": "m1b_math1b_u3_u3_t3_analysis"}}, {"id": "u3_t4", "type": "choice", "knowledge_point": "kp_u3_3", "stem": "4个同样的正方形可以拼成什么？", "answer": "大正方形", "analysis": "4个小正方形可拼成大正方形。", "image": null, "options": ["圆", "大正方形", "三角形"], "audio": {"stem": "m1b_math1b_u3_u3_t4_stem", "answer": "m1b_math1b_u3_u3_t4_answer", "analysis": "m1b_math1b_u3_u3_t4_analysis"}}, {"id": "u3_t5", "type": "judge", "knowledge_point": "kp_u3_2", "stem": "平行四边形的对边相等。", "answer": "对", "analysis": "平行四边形对边平行且相等。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_t5_stem", "answer": "m1b_math1b_u3_u3_t5_answer", "analysis": "m1b_math1b_u3_u3_t5_analysis"}}, {"id": "u3_t6", "type": "choice", "knowledge_point": "kp_u3_1", "stem": "用三棱柱可以描出什么图形？", "answer": "三角形", "analysis": "三棱柱有三角形的面。", "image": null, "options": ["圆", "三角形", "球"], "audio": {"stem": "m1b_math1b_u3_u3_t6_stem", "answer": "m1b_math1b_u3_u3_t6_answer", "analysis": "m1b_math1b_u3_u3_t6_analysis"}}]}, "unit_test": [{"id": "u3_q1", "type": "choice", "knowledge_point": "kp_u3_1", "stem": "用圆柱能描出什么图形？", "answer": "圆", "analysis": "圆柱底面是圆。", "image": null, "options": ["圆", "正方形", "三角形"], "audio": {"stem": "m1b_math1b_u3_u3_q1_stem", "answer": "m1b_math1b_u3_u3_q1_answer", "analysis": "m1b_math1b_u3_u3_q1_analysis"}}, {"id": "u3_q2", "type": "judge", "knowledge_point": "kp_u3_1", "stem": "球能描出平面图形。", "answer": "错", "analysis": "球没有平平的面。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_q2_stem", "answer": "m1b_math1b_u3_u3_q2_answer", "analysis": "m1b_math1b_u3_u3_q2_analysis"}}, {"id": "u3_q3", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "下面哪个是长方形？", "answer": "1", "analysis": "长方形有四条边、四个直角。", "image": null, "options": ["长方形", "三角形", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_q3_stem", "answer": "m1b_math1b_u3_u3_q3_answer", "analysis": "m1b_math1b_u3_u3_q3_analysis"}}, {"id": "u3_q4", "type": "fill", "knowledge_point": "kp_u3_2", "stem": "三角形有（ ）条边。", "answer": "3", "analysis": "三角形有3条边。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_q4_stem", "answer": "m1b_math1b_u3_u3_q4_answer", "analysis": "m1b_math1b_u3_u3_q4_analysis"}}, {"id": "u3_q5", "type": "choice", "knowledge_point": "kp_u3_5", "stem": "七巧板一共有（ ）块。", "answer": "7", "analysis": "七巧板有7块。", "image": null, "options": ["5", "6", "7"], "audio": {"stem": "m1b_math1b_u3_u3_q5_stem", "answer": "m1b_math1b_u3_u3_q5_answer", "analysis": "m1b_math1b_u3_u3_q5_analysis"}}, {"id": "u3_q6", "type": "judge", "knowledge_point": "kp_u3_3", "stem": "几个平面图形可以拼成新的图案。", "answer": "对", "analysis": "图形可以拼组。", "image": null, "audio": {"stem": "m1b_math1b_u3_u3_q6_stem", "answer": "m1b_math1b_u3_u3_q6_answer", "analysis": "m1b_math1b_u3_u3_q6_analysis"}}, {"id": "u3_q7", "type": "choice", "knowledge_point": "kp_u3_2", "stem": "下面哪个图形没有角？", "answer": "圆", "analysis": "圆没有角。", "image": null, "options": ["长方形", "正方形", "圆"], "audio": {"stem": "m1b_math1b_u3_u3_q7_stem", "answer": "m1b_math1b_u3_u3_q7_answer", "analysis": "m1b_math1b_u3_u3_q7_analysis"}}, {"id": "u3_q8", "type": "choice", "knowledge_point": "kp_u3_4", "stem": "用三角形和长方形可以拼出什么？", "answer": "小鸟", "analysis": "可拼出小鸟等图案。", "image": null, "options": ["球", "圆", "小鸟"], "audio": {"stem": "m1b_math1b_u3_u3_q8_stem", "answer": "m1b_math1b_u3_u3_q8_answer", "analysis": "m1b_math1b_u3_u3_q8_analysis"}}], "mid_test": [], "final_test": [], "pages": [{"image": "assets/math_pages/下册/p169.png", "title": "教材原页 P169", "knowledge_points": [{"title": "立体图形可以描出平面图形", "explain": "同学们在桌上摆长方体、正方体、圆柱、球等立体图形，用它们在纸上描出长方形、正方形、三角形等平面图形。提示我们立体图形可以印出平面图形。", "key": "立体→平面"}]}, {"image": "assets/math_pages/下册/p170.png", "title": "教材原页 P170", "knowledge_points": [{"title": "长方形/正方形/平行四边形/三角形/圆", "explain": "把平面图形分成5类：长方形、正方形、平行四边形、三角形、圆。练习1：观察周围物体的面（蛋糕盒、礼物盒、笔盒、钟面）是什么形状；练习2：把平面图形和名称连一连。", "key": "5种平面图形"}]}, {"image": "assets/math_pages/下册/p171.png", "title": "教材原页 P171", "knowledge_points": [{"title": "按形状分类计数", "explain": "练习3：把形状相同的图形涂上同样的颜色，再数一数长方形、正方形、平行四边形、三角形、圆各有多少个；练习4：把立体和它描出的平面连起来；练习5：用哪个物体描出右边的图形（圆柱→长方形，三棱柱→三角形等）。", "key": "分类数→涂色统计"}]}, {"image": "assets/math_pages/下册/p172.png", "title": "教材原页 P172", "knowledge_points": [{"title": "找规律接着画", "explain": "练习6：按图形排列规律接着画（○□○□…、△○△○…）；练习7：把每行中形状不一样的图形圈起来（找异类）；练习8：在点子图上画长方形、正方形、三角形。聪明小屋：上下两栏组合图形。", "key": "规律循环+找不同"}]}, {"image": "assets/math_pages/下册/p173.png", "title": "教材原页 P173", "knowledge_points": [{"title": "统计图案中的图形", "explain": "情境图配古诗《所见》（牧童骑黄牛、歌声振林樾、意欲捕鸣蝉、忽然闭口立）。你问我答：这幅图由哪几种图形拼成？每种图形分别用了多少个？统计表里数长方形、正方形、平行四边形、三角形、圆各多少。", "key": "分类数图形"}]}, {"image": "assets/math_pages/下册/p174.png", "title": "教材原页 P174", "knowledge_points": [{"title": "看图说图形", "explain": "你能拼出哪些有趣的图案？凉亭（三角形+长方形+平行四边形）、小房子（三角形+正方形+长方形）、救护车、小鸟。练习1分一分数一数大船里各图形多少；练习2拼车和鱼。", "key": "拼图案+数图形"}]}, {"image": "assets/math_pages/下册/p175.png", "title": "教材原页 P175", "knowledge_points": [{"title": "认识七巧板", "explain": "练习3：接下来应该接什么？找规律○▲●…；练习4：巧手折一折，正方形对折两次可折出小正方形/长方形/三角形；长方形对折两次的折法；练习5：一套七巧板有7块，其中三角形5块、正方形1块、平行四边形1块（按题目：3三角形+1正方形+1平行四边形）。", "key": "七巧板=3△+1□+1平行四边形"}]}, {"image": "assets/math_pages/下册/p176.png", "title": "教材原页 P176", "knowledge_points": [{"title": "七巧板照样子拼", "explain": "（3）用七巧板照样子拼小狗、鸵鸟、小鸡；练习6：下面第几个图形可以由2个三角形拼成（①可）；课外实践趣味拼摆：用火柴棒、曲别针拼出帆船、鱼、房子等图案。", "key": "七巧板拼图"}]}, {"image": "assets/math_pages/下册/p177.png", "title": "教材原页 P177", "knowledge_points": [{"title": "单元总结与自我评价", "explain": "数小火车图案里的长方形/正方形/平行四边形/三角形/圆各多少；用立体描平面（正方体→□、长方体→□或长方形、圆柱→□、三棱柱→△）；选图形拼小猫头；自我评价：我知道画在体上、我能辨认长方形正方形三角形、我会用平面图形拼图。丰收园：会观察/会提问/会思考/会表达/会应用。", "key": "数→描→拼→回顾"}]}]}, {"unit_id": "math1b_theme1", "unit": "主题活动：有趣的拼摆", "image": "assets/images/img_3ef4846d9acc.jpg", "knowledge_points": [{"id": "kp_theme1_1", "title": "七巧板与拼摆准备", "image": "assets/images/img_3ef4846d9acc.jpg", "explain": "七巧板是一种中国传统益智拼图玩具。拼摆前要先确定拼摆哪个故事，再想想这个故事里有哪些事物、它们分别是什么形状的，还要准备七巧板。", "key": "拼摆前先选好故事，观察故事里的事物形状，做好材料和计划准备。", "audio": {"title": "m1b_math1b_theme1_kp_theme1_1_title", "explain": "m1b_math1b_theme1_kp_theme1_1_explain", "key": "m1b_math1b_theme1_kp_theme1_1_key"}}, {"id": "kp_theme1_2", "title": "选择故事素材", "image": "assets/images/img_4779072af9ca.jpg", "explain": "可以选“乌鸦喝水”“咏鹅”“小猫钓鱼”等故事来拼摆。先仔细看故事画面：乌鸦、水瓶、白鹅、绿水、小鱼等分别是什么形状，再决定用哪些图形拼。", "key": "根据故事内容选择合适的事物，观察它们的形状特点，为拼摆做准备。", "audio": {"title": "m1b_math1b_theme1_kp_theme1_2_title", "explain": "m1b_math1b_theme1_kp_theme1_2_explain", "key": "m1b_math1b_theme1_kp_theme1_2_key"}}, {"id": "kp_theme1_3", "title": "拼摆故事：小猫钓鱼", "image": "assets/images/img_1d715ec34240.jpg", "explain": "拼“小猫钓鱼”的故事时，小猫的脑袋可以用2个三角形和1个正方形拼，小鱼的头可以用三角形拼。两副七巧板可以拼出一只小猫和一条小鱼。拼的时候边对边、角对角。", "key": "拼图案时，要根据事物的形状选择七巧板中的图形，边和角要对接好。", "audio": {"title": "m1b_math1b_theme1_kp_theme1_3_title", "explain": "m1b_math1b_theme1_kp_theme1_3_explain", "key": "m1b_math1b_theme1_kp_theme1_3_key"}}, {"id": "kp_theme1_4", "title": "介绍作品", "image": "assets/images/img_1cc9ad308448.jpg", "explain": "拼好后要给大家介绍作品：拼的是什么故事，用了哪些图形，各用了多少个。比如拼“咏鹅”或“悯农”时，要说清正方形、三角形、平行四边形各有几个。", "key": "介绍作品要说清故事名称、用到的图形种类和数量。", "audio": {"title": "m1b_math1b_theme1_kp_theme1_4_title", "explain": "m1b_math1b_theme1_kp_theme1_4_explain", "key": "m1b_math1b_theme1_kp_theme1_4_key"}}, {"id": "kp_theme1_5", "title": "七巧板的由来", "image": "assets/images/img_766378b67ba1.jpg", "explain": "七巧板又称“七巧图”“智慧板”，是从古代“燕几”“蝶几”“七巧桌”演变来的。古人为了方便宴请宾客，发明了可以分合的桌子，后来演化出七巧板游戏。拼图前要观察物体形状，和同学合作。", "key": "七巧板是中国传统益智玩具，拼摆前要观察形状，拼摆时可以发挥想象、与人合作。", "audio": {"title": "m1b_math1b_theme1_kp_theme1_5_title", "explain": "m1b_math1b_theme1_kp_theme1_5_explain", "key": "m1b_math1b_theme1_kp_theme1_5_key"}}], "error_prone": [{"id": "ep_theme1_1", "title": "拼摆前要观察形状", "desc": "不要拿到七巧板就随便拼。要先看故事中的事物是什么形状，再选合适的板来拼。", "image": null, "audio": {"title": "m1b_math1b_theme1_ep_theme1_1_title", "desc": "m1b_math1b_theme1_ep_theme1_1_desc"}}, {"id": "ep_theme1_2", "title": "介绍作品要说清图形数量", "desc": "介绍自己的拼摆作品时，不仅要讲是什么故事，还要数一数用了几个正方形、几个三角形、几个平行四边形。", "image": null, "audio": {"title": "m1b_math1b_theme1_ep_theme1_2_title", "desc": "m1b_math1b_theme1_ep_theme1_2_desc"}}, {"id": "ep_theme1_3", "title": "七巧板有7块", "desc": "一副七巧板一共有7块，其中包括5块三角形、1块正方形和1块平行四边形，不要用错或漏掉。", "image": null, "audio": {"title": "m1b_math1b_theme1_ep_theme1_3_title", "desc": "m1b_math1b_theme1_ep_theme1_3_desc"}}, {"id": "ep_theme1_4", "title": "边对边、角对角", "desc": "拼摆时要把图形的边和边靠紧、角和角对齐，不能留缝隙或重叠，这样图案才整齐。", "image": null, "audio": {"title": "m1b_math1b_theme1_ep_theme1_4_title", "desc": "m1b_math1b_theme1_ep_theme1_4_desc"}}], "daily": {"基础": [{"id": "theme1_b1", "type": "choice", "knowledge_point": "kp_theme1_1", "stem": "七巧板是一种什么玩具？", "answer": "中国传统益智拼图玩具", "analysis": "七巧板是中国传统益智拼图玩具。", "image": null, "options": ["积木", "中国传统益智拼图玩具", "洋娃娃"], "audio": {"stem": "m1b_math1b_theme1_theme1_b1_stem", "answer": "m1b_math1b_theme1_theme1_b1_answer", "analysis": "m1b_math1b_theme1_theme1_b1_analysis"}}, {"id": "theme1_b2", "type": "judge", "knowledge_point": "kp_theme1_1", "stem": "拼摆前要先确定拼什么故事。", "answer": "对", "analysis": "拼摆前要做好计划。", "image": null, "audio": {"stem": "m1b_math1b_theme1_theme1_b2_stem", "answer": "m1b_math1b_theme1_theme1_b2_answer", "analysis": "m1b_math1b_theme1_theme1_b2_analysis"}}, {"id": "theme1_b3", "type": "choice", "knowledge_point": "kp_theme1_2", "stem": "下面哪个故事适合用七巧板拼？", "answer": "小猫钓鱼", "analysis": "适合拼出小猫、小鱼等形象。", "image": null, "options": ["只有一个太阳", "小猫钓鱼", "一首数字歌"], "audio": {"stem": "m1b_math1b_theme1_theme1_b3_stem", "answer": "m1b_math1b_theme1_theme1_b3_answer", "analysis": "m1b_math1b_theme1_theme1_b3_analysis"}}, {"id": "theme1_b4", "type": "choice", "knowledge_poi }]}]}, {"unit_id": "math1b_u4", "unit": "第四单元 护绿行动——100以内的加减法（一）", "image": "assets/images/img_003af6910f97.jpg", "knowledge_points": [{"id": "kp_u4_1", "title": "两位数加减一位数、整十数（不进位、不退位）", "image": "assets/images/img_003af6910f97.jpg", "explain": "一组栽了26棵杨树，还要栽3棵，一共要栽多少棵？26+3=29。二组栽了26棵松树，一组栽了30棵，两个小组一共栽了多少棵松树？26+30=56。相同数位相加减：个位和个位算，十位和十位算。", "key": "两位数加减一位数（不进位、不退位）和加减整十数，都要相同数位相加减。", "audio": {"title": "m1b_math1b_u4_kp_u4_1_title", "explain": "m1b_math1b_u4_kp_u4_1_explain", "key": "m1b_math1b_u4_kp_u4_1_key"}}, {"id": "kp_u4_2", "title": "两位数加一位数进位", "image": "assets/images/img_8089dc7da757.jpg", "explain": "一班已经做了27个牌子，还剩6个没做，一共要做多少个牌子？27+6=33。先算7+6=13，满10要向十位进1，再算20+13=33。也可以把6分成3和3，27+3=30，30+3=33。", "key": "两位数加一位数进位时，个位相加满10要向十位进1，十位上的数要加上进上来的1。", "audio": {"title": "m1b_math1b_u4_kp_u4_2_title", "explain": "m1b_math1b_u4_kp_u4_2_explain", "key": "m1b_math1b_u4_kp_u4_2_key"}}, {"id": "kp_u4_3", "title": "两位数减一位数退位", "image": "assets/images/img_cfb12437a5b4.jpg", "explain": "要栽30株花，还有9株没栽，已经栽了多少株？30-9=21。个位0减9不够减，从十位退1当10，10-9=1，再加上剩下的20，得21。24-8=16，把24分成10和14，10-8=2，2+14=16。", "key": "两位数减一位数退位时，个位不够减，从十位退1当10，和个位合起来再减。", "audio": {"title": "m1b_math1b_u4_kp_u4_3_title", "explain": "m1b_math1b_u4_kp_u4_3_explain", "key": "m1b_math1b_u4_kp_u4_3_key"}}, {"id": "kp_u4_4", "title": "解决问题：比多少", "image": "assets/images/img_06fe298dbf78.jpg", "explain": "二年级有10人，三年级比二年级多5人，三年级有多少人？一年级比三年级少多少人？求一个数比另一个数多几或少几，要用大数减小数。二年级10人，三年级15人，一年级比三年级少15-10=5人。", "key": "求一个数比另一个数多几或少几，用减法：大数减小数。", "audio": {"title": "m1b_math1b_u4_kp_u4_4_title", "explain": "m1b_math1b_u4_kp_u4_4_explain", "key": "m1b_math1b_u4_kp_u4_4_key"}}, {"id": "kp_u4_5", "title": "我学会了吗", "image": "assets/images/img_a32f805465fc.jpg", "explain": "本单元学会了口算两位数加减整十数和两位数加减一位数（包括进位、退位），能解决生活中的求一共、求剩余、比多少等问题。计算时要数位对齐，进位别忘了加1，退位别忘了十位减1。", "key": "两位数加减一位数、整十数，相同数位对齐；进位加1，退位减1。", "audio": {"title": "m1b_math1b_u4_kp_u4_5_title", "explain": "m1b_math1b_u4_kp_u4_5_explain", "key": "m1b_math1b_u4_kp_u4_5_key"}}], " _points": [{"title": "会认生字（姓氏歌）", "explain": "认读：姓、什、么、李、张、古、胡、吴、双、言、孙、周、诸、葛、方、官、阳（共17个）。用拆字法介绍姓氏：弓长张、古月胡、口天吴、言午许。"}, {"title": "姓氏常识", "explain": "《姓氏歌》里有许多姓氏：赵、钱、孙、李、周、吴、郑、王，还有复姓诸葛、东方、上官、欧阳。"}]}, {"image": "assets/images/img_015728324c4c.jpg", "knowledge_points": [{"title": "介绍姓氏的方法", "explain": "介绍自己姓什么可用不同方法：'你姓什么？我姓张。什么张？弓长张。'照样子做问答游戏，认一认班里同学的姓。"}, {"title": "朗读背诵", "explain": "朗读并背诵《姓氏歌》；书写：什、么、古、胡、吴、言、孙等字。"}]}, {"image": "assets/images/img_f37dc3854388.jpg", "knowledge_points": [{"title": "会认生字（小青蛙）", "explain": "认读：河、清、晴、眼、睛、保、护、苗、吃、害、事、情、请、让、病（共15个）。这是'字族文'，青字家族：清、晴、睛、情、请都带'青'。"}, {"title": "字族识字", "explain": "'青'加不同偏旁成新字：清(氵水)、晴(日)、睛(目)、情(忄心)、请(讠言)。形声字偏旁表义。"}]}, {"image": "assets/images/img_3fc717d681cf.jpg", "knowledge_points": [{"title": "发现偏旁规律", "explain": "读'睛、情、晴、清、请'，发现右边都是'青'，左边偏旁不同意思就不同。填空：天(晴)、心(情)、(请)问、(清)水、眼(睛)。"}, {"title": "书写巩固", "explain": "认读并书写：河、晴、眼、睛、保、护、苗、吃、事、情、请、让；朗读课文。"}]}, {"image": "assets/images/img_77ca23c28e66.jpg", "knowledge_points": [{"title": "会认生字（猜字谜一）", "explain": "认读：相、遇、喜、欢、怕、攻、令、感、动、万、无、纯、净、左、右、红、时（共17个）。字谜'左边绿右边红，左右相遇起凉风'猜的是'秋'。"}, {"title": "字谜讲解", "explain": "第一则谜底'秋'：左边'禾'绿（禾苗），右边'火'红（火），秋风吹起凉风。学会根据提示猜左右结构的字。"}]}, {"image": "assets/images/img_15a28850f391.jpg", "knowledge_points": [{"title": "会认生字（猜字谜二）", "explain": "认读：言、互、令、动、万、纯、净、尊、重、透、明。字谜每句加偏旁都含'青'：言+青=请、心+青=情、日+青=晴、水+青=清。"}, {"title": "字谜讲解", "explain": "第二则每句话对应'青'家族一个字，谜底是'青'。'一加一'猜字可猜'王'。"}]}, {"image": "assets/images/img_7f4ac5c18935.jpg", "knowledge_points": [{"title": "语文园地一·识字加油站", "explain": "认读：识、组、词、计、算、减、式、图、形、卡、合、唱、团。词语：计算、减法、算式、图形、卡片、合唱、团结。注意'长'有 cháng/zhǎng 两读。"}, {"title": "字词句运用", "explain": "读一读，发现'长—长''见—贝'等读音或字形相近的字，再写一写。"}]}, {"image": "assets/images/img_b73a708789fa.jpg", "knowledge_points": [{"title": "读《祖国多么广大》", "explain": "朗读短文，感受祖国南北气候不同：大兴安岭雪花飞舞，长江两岸柳枝发芽，海南岛上鲜花盛开。我们的祖国多么广大。"}, {"title": "记《汉语拼音字母表》", "explain": "背诵大写字母 A–Z 与小写 a–z 的对应，为查字典打基础。"}]}, {"image": "assets/images/img_80b6a6e8f893.jpg", "knowledge_points": [{"title": "日积月累《春晓》", "explain": "[唐]孟浩然：'春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。'描写春天早晨景色，背诵这首诗。"}, {"title": "书写提示", "explain": "笔顺规则：先外后内再封口（如'田、四、白'）。写包围结构的字要注意。"}]}, {"image": "assets/images/img_d712405b067e.jpg", "knowledge_points": [{"title": "口语交际《请你帮个忙》", "explain": "需要别人帮助要用礼貌用语：请、请问、您、您好、谢谢、不客气。如：'爸爸，请您帮我拿一下那本书好吗？'"}]}, {"image": "assets/images/img_f291cb33ba9b.jpg", "knowledge_points": [{"title": "和大人一起读《妞妞赶牛》", "explain": "传统绕口令，练读'妞妞、牛牛、扭、柳、牛、走'等，读准 n、l 发音，和爸爸妈妈一起读更有趣。"}]}, {"image": "assets/images/img_bf443ce815a5.jpg", "knowledge_points": [{"title": "快乐读书吧《读读童谣和儿歌》", "explain": "童谣儿歌很有节奏，读起来有趣。和小伙伴换书看，多读如'摇摇摇，摇到外婆桥''小老鼠，上灯台'等童谣。"}]}], "error_prone": [{"id": "ep_b1_1", "title": "“请”和“清”", "desc": "言字旁“请”是说话，三点水“清”是水清。都从“青”，偏旁不同义不同。", "image": null}, {"id": "ep_b1_2", "title": "“左”和“右”", "desc": "左手边是左，右手边是右。可记“左工右口”。", "image": null}], "daily": {"基础": [{"id": "b1_b1", "type": "choice", "knowledge_point": "kp_b1_1", "stem": "下面哪个季节会下雪？", "options": ["春天", "冬天", "夏天"], "answer": "冬天", "analysis": "冬雪飘，冬天会下雪。", "image": null}, {"id": "b1_b2", "type": "match", "knowledge_point": "kp_b1_2", "stem": "把姓氏拆一拆连一连：", "pairs": [{"left": "木子", "right": "李"}, {"left": "弓长", "right": "张"}, {"left": "古月", "right": "胡"}], "answer": "木子—李，弓长—张，古月—胡", "analysis": "姓氏歌里这样拆字。", "image": null}], "提高": [{"id": "b1_g1", "type": "fill_hanzi", "knowledge_point": "kp_b1_1", "stem": "看拼音写汉字：chūn（  ）", "answer": "春", "analysis": "chūn 是“春”，本单元学过，可在框里写一写。", "image": null}, {"id": "b1_g2", "type": "fill_hanzi", "knowledge_point": "kp_b1_3", "stem": "补充：小（  ）蛙大眼睛。", "answer": "青", "analysis": "课文“小小青蛙大眼睛”，青字本单元学过。", "image": null}], "拓展": [{"id": "b1_t1", "type": "read_comp", "knowledge_point": "kp_b1_4", "stem": "读谜语，选一选：", "passage": "左边绿，右边红，左右相遇起凉风。绿的喜欢及时雨，红的最怕水来攻。", "questions": [{"stem": "这个字是什么？", "options": ["秋", "春", "冬"], "answer": "秋"}, {"stem": "“绿的”指什么？", "options": ["禾苗", "火", "雪"], "answer": "禾苗"}], "analysis": "左边禾苗绿，右边火红，合起来是“秋”。", "image": null}]}, "unit_test": [{"id": "b1_q1", "type": "fill_h ain": "认读：咕、咚、熟、掉、湖、吓、鹿、逃、命、象、野、拦、领。"}, {"title": "课文讲解", "explain": "木瓜掉进湖里'咕咚'，兔子吓跑，小动物跟着跑，野牛拦住问清，大家到湖边发现是木瓜落水的声音。"}]}, {"image": "assets/images/img_8936b2278d4d.jpg", "knowledge_points": [{"title": "课文续讲", "explain": "大象也跟着跑，野牛拦住问'咕咚在哪'，大伙都说没看见。最后到湖边看到木瓜掉水，都笑了。"}]}, {"image": "assets/images/img_f8ec58e0cc48.jpg", "knowledge_points": [{"title": "课文总结", "explain": "兔子领大家来到湖边，正好又一个木瓜掉进湖里'咕咚'，大伙你看看我我看看你都笑了。明白遇事要弄清真相，不盲从。书写：家、象、野、都、怕、跟、着。"}]}, {"image": "assets/images/img_eaea145e2c2b.jpg", "knowledge_points": [{"title": "会认生字（小壁虎借尾巴）", "explain": "认读：壁、墙、蚊、咬、断、您、拨、甩、赶、房、傻、转。"}, {"title": "课文讲解", "explain": "小壁虎在墙角捉蚊子，被蛇咬住尾巴，挣断尾巴逃走。没有尾巴多难看，他去借尾巴。"}]}, {"image": "assets/images/img_6bbe7556f14f.jpg", "knowledge_points": [{"title": "课文续讲", "explain": "小壁虎爬到大树上向老牛借尾巴，老牛说要用尾巴赶蝇子；爬到房檐下向燕子借，燕子说要用尾巴掌握方向。"}]}, {"image": "assets/images/img_54c7f3b26553.jpg", "knowledge_points": [{"title": "课文续讲②", "explain": "小壁虎借不到尾巴难过，爬回家找妈妈。妈妈让他转过身子看——他长出新尾巴了！"}]}, {"image": "assets/images/img_e8cd8fd7ed01.jpg", "knowledge_points": [{"title": "读与思", "explain": "读字：壁、借、咬、难、哪、爬、您、拨、赶、摆、过、孩、转。小壁虎找谁借过尾巴？结果怎样？分角色朗读，注意问号。"}]}, {"image": "assets/images/img_a3a84369833f.jpg", "knowledge_points": [{"title": "语文园地八·识字加油站", "explain": "加一加识字：口+少=吵、王+见=现、丁+页=顶、月+半=胖、月+长=胀、日+免=晚、女+子=好、田+心=思、木+几=机、户+方=房、全+王=玩、白+水=泉、云+力=动、木+目=相等。"}]}, {"image": "assets/images/img_6ee872791ece.jpg", "knowledge_points": [{"title": "日积月累《画鸡》", "explain": "[明]唐寅：头上红冠不用裁，满身雪白走将来。平生不敢轻言语，一叫千门万户开。说说你的心情（高兴、生气、害怕、难过）。"}]}, {"image": "assets/images/img_099330715af3.jpg", "knowledge_points": [{"title": "和大人一起读《小熊住山洞》", "explain": "小熊一家想砍树造新房，春天满树花、夏天绿叶、秋天红果、冬天鸟儿求情，都舍不得砍。"}]}, {"image": "assets/images/img_ce4f1fc4f00f.jpg", "knowledge_points": [{"title": "和大人一起读②", "explain": "小熊一家一年又一年没砍树，一直住山洞。森林动物感激他们，送来鲜花和果子。"}]}, {"image": "assets/images/img_1cb14b4a173b.jpg", "knowledge_points": [{"title": "和大人一起读③", "explain": "复述《小熊住山洞》——爱护树木、保护环境的美好品德，值得我们学习。"}]}, {"image": "assets/images/img_36e57ae65b82.jpg", "knowledge_points": [{"title":   <!-- 状态层 -->
  <script>
/* =========================================================================
 * storage.js —— 本地状态层（localStorage，file:// 可用；不可用时回退内存）
 * 负责：作答记录、错题本、学情统计、升降阶解锁、宠物状态、每日任务。
 * 纯逻辑函数无 DOM 依赖，便于复用与测试。
 * ========================================================================= */
(function (global) {
  "use strict";

  var KEY = "LT_STATE_V1";
  var SETTINGS = {
    // 一年级升降阶解锁阈值：基础正确率≥95% 才解锁提高（用户 2026-08-17 拍板）
    unlockThreshold: { "一年级": 0.95 },
    defaultThreshold: 0.95,
    progressColor: { green: 0.95, yellow: 0.70 } // 学情三色分界
  };

  var mem = null; // 内存回退
  function readRaw() {
    try {
      var s = global.localStorage.getItem(KEY);
      return s ? JSON.parse(s) : null;
    } catch (e) { return mem; }
  }
  function writeRaw(obj) {
    try { global.localStorage.setItem(KEY, JSON.stringify(obj)); }
    catch (e) { mem = obj; }
  }

  function blank() {
    return {
      version: 1,
      userName: "",                  // 空 = 首次进入必弹名字输入框
      attempts: {},                 // qid -> {correct,total,last}
      mistakes: {},                 // qid -> {unitId,module,level,userAnswer,correct:false,ts,resolved}
      // 升降阶解锁状态：以“本次练习”正确率是否达标为准，重做全对即解锁。
      // 结构：{ unitId: { 基础: true, 提高: false, 拓展: false } }
      levelUnlock: {},
      pet: { name: "小喵", hunger: 70, mood: "happy", badges: [], lastVisit: null, lastFed: null, fedToday: false },
      daily: { date: null, done: {} }
    };
  }

  var state = readRaw() || blank();

  function save() { writeRaw(state); }

  /* ---------------------- 工具：答案归一化与判定 ---------------------- */
  function normalize(s) {
    if (s == null) return "";
    return String(s)
      .replace(/[\s　]/g, "")
      .replace(/；/g, ";")
      .replace(/，/g, ",")
      .toLowerCase();
  }
  // 提取连续数字序列（用于排序/比大小题）
  function extractNumberSequence(s) {
    var str = String(s);
    // 若用户只输入一串连续数字（无空格/符号），按单个数字拆分
    if (/^\d+$/.test(str) && str.length > 1) {
      return str.split("").join(",");
    }
    var nums = str.match(/\d+/g);
    return nums ? nums.join(",") : null;
  }
  function isSequenceEqual(u, exp) {
    var un = extractNumberSequence(u);
    var en = extractNumberSequence(exp);
    if (!un || !en) return false;
    return un === en;
  }
  // 期望答案可能含多段（用 ；分隔），每段都出现在用户答案中即判对
  // 若答案可解析为数字序列且一致，也判对（兼容排序题写空格/无比较符）
  function isAnswerCorrect(userAnswer, expected) {
    var uRaw = String(userAnswer == null ? "" : userAnswer);
    var eRaw = String(expected == null ? "" : expected);
    if (isSequenceEqual(uRaw, eRaw)) return true;
    var u = normalize(userAnswer);
    var exp = normalize(expected);
    if (!exp) return false;
    var tokens = exp.split(";").filter(Boolean);
    if (tokens.length === 0) return u === exp;
    return tokens.every(function (t) { return u.indexOf(t) !== -1; });
  }

  /* ---------------------- 作答 / 错题记录 ---------------------- */
  function recordAttempt(qid, unitId, module, level, userAnswer, correct) {
    var a = state.attempts[qid] || { correct: 0, total: 0, last: 0 };
    a.total += 1;
    if (correct) a.correct += 1;
    a.last = Date.now();
    state.attempts[qid] = a;

    if (correct) {
      // 做对则把该题为“已解决”
      if (state.mistakes[qid]) state.mistakes[qid].resolved = true;
    } else {
      state.mistakes[qid] = {
        qid: qid, unitId: unitId, module: module, level: level,
        userAnswer: userAnswer, correct: false, ts: Date.now(), resolved: false
      };
    }
    save();
  }

  function getMistakes() {
    return Object.keys(state.mistakes)
      .map(function (k) { return state.mistakes[k]; })
      .filter(function (m) { return !m.resolved; })
      .sort(function (a, b) { return b.ts - a.ts; });

  function thresholdFor(grade) {
    return SETTINGS.unlockThreshold[grade] != null ? SETTINGS.unlockThreshold[grade] : SETTINGS.defaultThreshold;
  }

  // 收集某单元某阶（基础/提高/拓展）的全部题目 id
  function levelQuestionIds(book, unitId, level) {
    var unit = book.units.filter(function (u) { return u.unit_id === unitId; })[0];
    if (!unit || !unit.daily || !unit.daily[level]) return [];
    return unit.daily[level].map(function (q) { return q.id; });
  }

  function computeLevelStats(book, unitId, level) {
    var ids = levelQuestionIds(book, unitId, level);
    var attempted = 0, correct = 0, total = 0;
    ids.forEach(function (id) {
      var a = state.attempts[id];
      if (a && a.total > 0) { attempted += 1; correct += a.correct; total += a.total; }
    });
    var accuracy = total > 0 ? correct / total : 0;
    // passed 不再看累计，只看“单次练习”是否曾达标（由 markLevelSession 记录）
    ensureLevelUnlock(unitId);
    var passed = !!state.levelUnlock[unitId][level];
    var allAttempted = ids.length > 0 && attempted === ids.length;
    return { ids: ids, attempted: attempted, correct: correct, total: total,
             accuracy: accuracy, allAttempted: allAttempted, passed: passed };
  }

  // 某阶是否解锁：基础默认解锁；提高需基础“单次练习”达标；拓展需提高“单次练习”达标
  function ensureLevelUnlock(unitId) {
    if (!state.levelUnlock[unitId]) state.levelUnlock[unitId] = { "基础": false, "提高": false, "拓展": false };
  }

  // 记录一次练习结果：acc 为本次正确率；达标则解锁本阶并开启下一阶
  function markLevelSession(book, unitId, level, acc) {
    ensureLevelUnlock(unitId);
    var thr = thresholdFor(book.meta.grade);
    if (acc >= thr) {
      state.levelUnlock[unitId][level] = true;
      if (level === "基础") state.levelUnlock[unitId]["提高"] = true;
      if (level === "提高") state.levelUnlock[unitId]["拓展"] = true;
      save();
      return true;
    }
    save();
    return false;
  }

  function isLevelUnlocked(book, unitId, level) {
    ensureLevelUnlock(unitId);
    if (level === "基础") return true;
    if (level === "提高") return !!state.levelUnlock[unitId]["基础"];
    if (level === "拓展") return !!state.levelUnlock[unitId]["提高"];
    return false;
  }

  /* ---------------------- 学情三色（按单元，仅以基础题为准） ----------------------
   * 规则（用户 2026-08-17 拍板）：基础题默认即符合本单元难度；基础答对=已掌握。
   * 提高/拓展只用于解锁挑战，不计入单元掌握色。 */
  function unitAccuracy(book, unitId) {
    var unit = book.units.filter(function (u) { return u.unit_id === unitId; })[0];
    if (!unit) return null;
    var ids = (unit.daily && unit.daily["基础"]) ? unit.daily["基础"].map(function (q) { return q.id; }) : [];
    var correct = 0, total = 0;
    ids.forEach(function (id) {
      var a = state.attempts[id];
      if (a && a.total > 0) { correct += a.correct; total += a.total; }
    });
    if (total === 0) return { accuracy: 0, answered: false, color: "none" };
    var acc = correct / total;
    var color = acc >= SETTINGS.progressColor.green ? "green"
              : acc >= SETTINGS.progressColor.yellow ? "yellow" : "red";
    return { accuracy: acc, answered: true, color: color };
  }

  function overallAccuracy(book) {
    var correct = 0, total = 0;
    Object.keys(state.attempts).forEach(function (id) {
      var a = state.attempts[id];
      correct += a.correct; total += a.total;
    });
    return total > 0 ? correct / total : 0;
  }

  /* ---------------------- 宠物 ---------------------- */
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function petTick() {
    var p = state.pet;
    var today = todayStr();
    var absentDays = 0;
    if (p.lastVisit) {
      var diff = Math.floor((Date.now() - new Date(p.lastVisit)) / 86400000);
      absentDays = diff;
    }
    // 每日饥饿衰减
    if (p.lastVisit && p.lastVisit.slice(0, 10) !== today) {
      p.hunger = Math.max(0, p.hunger - 20);
      p.fedToday = false;
    }
    p.lastVisit = new Date().toISOString();
    var mood = "happy";
    if (p.hunger <= 20) mood = "hungry";
    if (absentDays >= 2) mood = "sad";
    p.mood = mood;
    save();
    return { absentDays: absentDays, mood: mood };
  }

  function petFeed() {
    var p = state.pet;
    if (p.fedToday) return { ok: false, msg: "今天已经喂过啦～小喵吃饱了！" };
    p.hunger = 100; p.fedToday = true; p.mood = "happy";
    save();
    return { ok: true, msg: "小喵吃得好香，谢谢你！(｡•ᴗ•｡)" };
  }

  function awardBadge(id, title, icon) {
    var p = state.pet;
    if (p.badges.some(function (b) { return b.id === id; })) return false;
    p.badges.push({ id: id, title: title, icon: icon || "🏅" });
    save();
    return true;
  }

  /* ---------------------- 每日任务 ---------------------- */
  function markDaily(moduleKey) {
    var today = todayStr();
    if (state.daily.date !== today) { state.daily = { date: today, done: {} }; }
    state.daily.done[moduleKey] = true;
    save();
  }
  function dailyDoneToday() {
    var today = todayStr();
    if (state.daily.date !== today) return [];
    return Object.keys(state.daily.done);
  }

  function resetAll() {
    state = blank();
    save();
  }

  global.Store = {
    SETTINGS: SETTINGS,
    state: function () { return state; },
    save: save,
    isAnswerCorrect: isAnswerCorrect,
    normalize: normalize,
    recordAttempt: recordAttempt,
    getMistakes: getMistakes,
    mistakeCount: mistakeCount,
    thresholdFor: thresholdFor,
    computeLevelStats: computeLevelStats,
    isLevelUnlocked: isLevelUnlocked,
    markLevelSession: markLevelSession,
    unitAccuracy: unitAccuracy,
    overallAccuracy: overallAccuracy,
    petTick: petTick,
    petFeed: petFeed,
    awardBadge: awardBadge,
    markDaily: markDaily,
    dailyDoneToday: dailyDoneToday,
    resetAll: resetAll,
    todayStr: todayStr
  };
})(window);

(function () {

  // 中文语音首选缓存：TTS 回退时用，避免浏览器默认（非中文）音色
  var _zhVoice = null;
  function _pickZhVoice() {

      if (!vs || !vs.length) return;
      var zh = vs.filter(function (v) { return /^(zh|cmn|yue)/i.test(v.lang) || /中文|普通话|国语|Chinese|Mandarin/i.test(v.name || ""); });

    if (_spk.audio) { try { _spk.audio.pause(); } catch (e) {} }
    if (_spk.useTTS) { try { window.speechSynthesis.pause(); } catch (e) {} }
    _spk.playing = false;
    if (_spk.btn) _spkSetBtn(_spk.btn, false);
  }

  function _spkResume() {
    if (_spk.audio) { var p = _spk.audio.play(); if (p && p.catch) p.catch(function () {}); }
    if (_spk.useTTS) { try { window.speechSynthesis.resume(); } catch (e) {} }
    _spk.playing = true;
    if (_spk.btn) _spkSetBtn(_spk.btn, true);
  }

  function _spkNext() {
    if (_spk.idx >= _spk.queue.length) { _spkStop(); return; }
    var it = _spk.queue[_spk.idx];
    if (_spk.useTTS) {
      if (!("speechSynthesis" in window)) { _spkStop(); if (window.Pet) Pet.say("当前设备暂不支持语音朗读", 2000); return; }
      try {
        var u = new SpeechSynthesisUtterance(it.text || "");
        u.lang = it.lang || "zh-CN"; u.rate = 0.9; u.pitch = 1.0;
        if (_zhVoice) { try { u.voice = _zhVoice; } catch (e) {} }
        u.onend = function () { _spk.idx++; _spkNext(); };
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
        _spk.playing = true;
      } catch (e) { _spkStop(); }
      return;
    }
    if (_spk.audio) { try { _spk.audio.pause(); } catch (e) {} }
    var au = new Audio(window.AUDIO_MAP[it.key]);
    _spk.audio = au;
    au.onended = function () { _spk.idx++; _spk.audio = null; _spkNext(); };
    var pp = au.play();
    _spk.playing = true;
    if (pp && pp.catch) pp.catch(function () {
      // 真人音被浏览器拦截：本条回退浏览器语音后继续下一条
      try { window.speechSynthesis.cancel(); var tu = new SpeechSynthesisUtterance(it.text || ""); tu.lang = it.lang || "zh-CN"; tu.rate = 0.9; if (_zhVoice) { try { tu.voice = _zhVoice; } catch (e) {} } tu.onend = function () { _spk.idx++; _spkNext(); }; window.speechSynthesis.speak(tu); } catch (e2) { _spk.idx++; _spkNext(); }
    });
  }

  // speakGroup(btn, items): items = [{text, key}]；点一下开始，再点暂停/继续。
  function speakGroup(btn, items) {
    if (!btn || !items || !items.length) return;
    if (_spk.btn === btn) {            // 同一个按钮：切换播放 / 暂停
      if (_spk.playing) _spkPause(); else _spkResume();
      return;
    }
    _spkStop();                         // 切换内容：先停旧的
    _spk.btn = btn;
    _spk.queue = items;
    _spk.idx = 0;
    _spk.useTTS = !items.every(function (it) { return it.text && it.key && window.AUDIO_MAP && window.AUDIO_MAP[it.key]; });
    _spkNext();
    _spkSetBtn(btn, true);
  }

  // speak(btn, text, audioFile): 单段朗读（题目）。
  function speak(btn, text, audioFile) {
    speakGroup(btn, [{ text: text, key: audioFile }]);
  }

  function unitDropdown(selectedUid) {
    var opts = BOOK.toc.map(function (t) {
      var uid = findUnitsByTocId(t.id);
      return '<option value="' + esc(uid) + '" ' + (selectedUid === uid ? "selected" : "") + '>' + esc(t.title) + '</option>';
    }).join("");
    return '<select class="unit-select" id="unitSelect">' + opts + '</select>';
  }

    function renderChineseSync(c, unit) {
    var pages = unit.pages || [];
    if (!pages.length) { c.innerHTML = emptyHint("本单元暂无同步内容"); return; }
    var total = pages.length;
    function kpList(p) {
      var kps = p && p.knowledge_points;
      if (typeof kps === "string") { try { kps = JSON.parse(kps); } catch (e) { kps = []; } }
      if (!Array.isArray(kps)) kps = [];
      return kps;
    }
    var pagesHtml = pages.map(function (p, i) {
      var kps = kpList(p);
      var kpItems = kps.map(function (kp) {
        return '<div class="kp-item"><div class="kp-item-title">' + esc(kp.title || "") + '</div>' +
          '<div class="kp-item-explain">' + esc(kp.explain || "") + '</div></div>';
      }).join("");
      var speakBtn = kps.length
        ? '<button type="button" class="speak-btn" data-speak="' + i + '" data-unit="' + esc(unit.unit_id) + '" data-page="' + i + '">🔊 读一读</button>'
        : '';
      return '<div class="sync-page" id="syncPage' + i + '">' +
          '<div class="sync-book">' +
            '<figure class="tb-page-card"><img class="tb-page-img" src="' + esc(p.image) + '" alt="教材原页 第 ' + (i + 1) + ' 页" loading="lazy"></figure>' +
          '</div>' +
          '<aside class="sync-aside">' +
            '<div class="kp-panel">' +
              '<div class="kp-panel-head">' +
                '<span class="kp-panel-title">📝 第 ' + (i + 1) + ' 页 · 知识点</span>' +
                speakBtn +
              '</div>' +
              (kpItems || '<p class="kp-empty">本页暂未整理知识点</p>') +
            '</div>' +
          '</aside>' +
        '</div>';
    }).join("");
    var selOpts = pages.map(function (p, i) { return '<option value="' + i + '">第 ' + (i + 1) + ' 页</option>'; }).join("");
    var kpSection = "";
    var hasPageKp = pages.some(function (p) { return kpList(p).length; });
    if (!hasPageKp && unit.knowledge_points && unit.knowledge_points.length) {
      var kpCards = unit.knowledge_points.map(function (kp, ki) {
        var voice = (kp.audio) ? '<button type="button" class="speak-btn kp-voice" data-i="' + ki + '">🔊 读一读</button>' : '';
        return '<div class="kp-card">' +
          (kp.image ? '<div class="kp-img"><img src="' + esc(kp.image) + '" alt="教材原图" loading="lazy"></div>' : '') +
          '<div class="kp-body"><div class="kp-head"><h3>' + esc(kp.title) + '</h3>' + voice + '</div>' +
          '<p class="kp-explain">' + esc(kp.explain) + '</p>' +
          (kp.key ? '<p class="kp-key">💡 ' + esc(kp.key) + '</p>' : '') + '</div></div>';
      }).join("");
      kpSection = '<div class="kp-list unit-kp-list"><div class="kp-panel-head"><span class="kp-panel-title">📝 单元知识点</span></div>' + kpCards + '</div>';
    }
    c.innerHTML = '<div class="sync-viewer">' +
      '<div class="sync-bar">' +
        '<span class="sync-label">📖 教材逐页复刻（共 ' + total + ' 页 · 向下滑动浏览）</span>' +
        '<select class="sync-select" id="syncJump" aria-label="跳转到第几页">' + selOpts + '</select>' +
      '</div>' +
      '<div class="sync-scroll" id="syncScroll">' + pagesHtml + '</div>' +
      kpSection +
    '</div>';
    var sel = document.getElementById("syncJump");
    if (sel) sel.addEventListener("change", function () {
      var el = document.getElementById("syncPage" + sel.value);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    Array.prototype.forEach.call(c.querySelectorAll(".speak-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var i = parseInt(btn.getAttribute("data-speak"), 10);
        var kps = kpList(pages[i]);
        var t = kps.map(function (kp) { return (kp.title ? kp.title + "：" : "") + (kp.explain || ""); }).join("。");
        var key = (btn.getAttribute("data-unit") || "") + "_" + (btn.getAttribute("data-page") || i);
        speakGroup(btn, [{ text: t, key: key }]);
      });
    });
    Array.prototype.forEach.call(c.querySelectorAll(".kp-voice"), function (btn) {
      btn.addEventListener("click", function () {
        var kp = unit.knowledge_points[parseInt(btn.getAttribute("data-i"), 10)];
        if (!kp || !kp.audio) return;
        speakGroup(btn, [
          { text: kp.title, key: kp.audio.title },
          { text: kp.explain, key: kp.audio.explain },
          { text: kp.key, key: kp.audio.key }
        ]);
      });
    });
  }

  function renderEnglishKp(kp, idx) {
    var h = '<div class="kp-card eng-kp"><div class="kp-body"><div class="kp-head"><h3>' + esc(kp.title) + '</h3></div>';

    if (kp.words && kp.words.length) {
      h += '<div class="eng-grid">';
      kp.words.forEach(function (w) {
        h += '<div class="eng-card">' +

          '</div>';
      });
      h += '</div>';
    }
    // 句子：每句独立卡片

      h += '<div class="eng-sent-list">';
      kp.sentences.forEach(function (s) {
        h += '<div class="eng-sent-card">' +

          '</div>';

  function renderSync(c, unit) {
    if (unit.pages && unit.pages.length) { renderChineseSync(c, unit); return; }
    var kps = unit.knowledge_points || [];

        '<p class="kp-explain">' + esc(kp.explain) + '</p>' +
        (kp.key ? '<p class="kp-key">💡 ' + esc(kp.key) + '</p>' : '') + '</div></div>';

    html += '</div>';

  function renderErrorProne(c, unit) {

  function renderDaily(c, unit) {
    var tabs = LEVELS.map(function (lv) {
      var unlocked = S.isLevelUnlocked(BOOK, unit.unit_id, lv);
      var st = S.computeLevelStats(BOOK, unit.unit_id, lv);
      var lock = unlocked ? "" : ' <span class="lock">🔒</span>';
      var tag = st.allAttempted ? '<span class="lvl-tag ' + (st.passed ? "pass" : "fail") + '">' + (st.passed ? "已达标" : "未达标 " + Math.round(st.accuracy * 100) + "%") + '</span>' : "";
      return '<button class="lvtab ' + (App.view.level === lv ? "active" : "") + (unlocked ? "" : " locked") + '" data-lvl="' + esc(lv) + '">' +
        esc(lv) + lock + tag + '</button>';
    }).join("");
    var intro = '<p class="daily-intro">每天先做完“基础”，正确率达到 <b>' + Math.round(S.thresholdFor(BOOK.meta.grade) * 100) + '%</b> 才能解锁“提高”；“提高”达标再解锁“拓展”。</p>';
    var html = '<div class="daily">' + intro + '<div class="lvtabs">' + tabs + '</div><div id="lvBody"></div></div>';

// 期中/期末的数据结构是 [{title, paper(HTML), answer(HTML|null)}]，
  // 不再走交互引擎（题型不受一年级红线约束，按原素材忠实还原）。
  function normalizePapers(raw) {
    return raw || [];
  }

  /* ----------------------------- 练习引擎（复用） ----------------------------- */
  function startQuiz(host, questions, ctx) {
    App.quiz = { qs: questions.slice(), idx: 0, correct: 0, ctx: ctx, finished: false };
    renderQuiz(host);
  }

  function renderQuiz(host) {
    var qz = App.quiz;
    if (!qz) return;
    if (qz.finished) { renderQuizResult(host); return; }
    var q = qz.qs[qz.idx];
    var total = qz.qs.length;
    var html = '<div class="quiz">' +
      '<div class="quiz-progress">第 ' + (qz.idx + 1) + ' / ' + total + ' 题　✅' + qz.correct + '　❌' + (qz.idx - qz.correct) + '</div>' +
      '<div class="quiz-pet-tip">🐾 答对一题，宠物就收到 <b>+1 🍎</b>！答对 10/20/30 题还能解锁 🎩🧣⚽</div>' +
      '<div class="q-card" id="qCard">' + questionHTML(q, qz) + '</div>' +
      '<div class="q-actions" id="qActions"></div>' +
      '<div class="q-feedback" id="qFeedback"></div>' +
      '</div>';
    host.innerHTML = html;
    bindQuestion(host, q, qz);
  }

    /* ----------------------------- 题型注册表（可扩展核心） -----------------------------
   * 每种题型 = { renderBody(q, qz), bind(host,q,qz) }；bind 最终调用 afterAnswer(...)。
   * 新增题型 = 加一条 registerType，核心调度（renderQuiz / afterAnswer / 结果页）零改动。 */
  var QUESTION_TYPES = {};
  function registerType(name, def) { QUESTION_TYPES[name] = def; }
  function qInput(extra) {
    return '<input class="q-input" id="ans" ' + (extra || "") + ' autocomplete="off">';
  }

  // 查找某单元“已学(会写)汉字”表，供 fill_hanzi 手写/选字自动分流
  function unitLearnedChars(unitId) {
    try {
      var subs = window.LEARNING_BOOK.platform.subjects || [];
      for (var s = 0; s < subs.length; s++) {
        var vols = subs[s].volumes || {};
        for (var vn in vols) {
          var us = (vols[vn] || {}).units || [];
          for (var u = 0; u < us.length; u++) {
            if (us[u].unit_id === unitId) return us[u].learned_chars || [];
          }
        }
      }
    } catch (e) {}
    return [];
  }

  // 公共：选项型作答（choice / judge / 选汉字降级）
  function bindChoice(host, q, qz) {
    var actions = host.querySelector("#qActions");
    var grid = host.querySelector("#optGrid");
    if (grid) Array.prototype.forEach.call(grid.querySelectorAll(".opt-btn"), function (b) {
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(grid.querySelectorAll(".opt-btn"), function (x) { x.classList.remove("selected"); });
        b.classList.add("selected");
      });
    });
    actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
    actions.querySelector("#submitBtn").addEventListener("click", function () {
      var sel = host.querySelector(".opt-btn.selected");
      if (!sel) { Pet.say("先点选一个答案吧～", 1800); return; }
      var correct = S.isAnswerCorrect(sel.getAttribute("data-val"), q.answer);
      afterAnswer(correct, q, qz, host, sel.getAttribute("data-val"));
    });
  }
  // 公共：文本输入型作答（fill / 兜底）
  function bindText(host, q, qz) {
    var actions = host.querySelector("#qActions");
    actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
    actions.querySelector("#submitBtn").addEventListener("click", function () {
      var inp = host.querySelector("#ans");
      var userAns = inp ? inp.value : "";
      if (!userAns.trim()) { Pet.say("先把答案写上去哦～", 1800); return; }
      var correct = S.isAnswerCorrect(userAns, q.answer);
      afterAnswer(correct, q, qz, host, userAns);
    });
  }

  // 公共：手写板（Canvas）—— 触屏/鼠标写汉字；离线无法OCR，写完提示家长复核
  function mountHandwrite(host, q, qz) {
    var wrap = host.querySelector("#hwWrap");
    if (!wrap) return;
    var canvas = wrap.querySelector("#hwCanvas");
    var ctx = canvas.getContext("2d");
    var drawing = false, last = null, hasInk = false;
    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var p = (e.touches && e.touches[0]) ? e.touches[0] : e;
      return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
    }
    function start(e) { e.preventDefault(); drawing = true; last = pos(e); }
    function move(e) {
      if (!drawing) return; e.preventDefault();
      var p = pos(e); ctx.strokeStyle = "#1f2d3d"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
      last = p; hasInk = true;
    }
    function end() { drawing = false; }
    canvas.addEventListener("pointerdown", start);
    canvas.addEventListener("pointermove", move);
    window.addEventListener("pointerup", end);
    var clearBtn = wrap.querySelector("#hwClear");
    if (clearBtn) clearBtn.addEventListener("click", function () { ctx.clearRect(0, 0, canvas.width, canvas.height); hasInk = false; });
    var actions = host.querySelector("#qActions");
    actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
    actions.querySelector("#submitBtn").addEventListener("click", function () {
      if (!hasInk) { Pet.say("先在框里写一写哦～", 1800); return; }
      var fb = host.querySelector("#qFeedback");
      fb.innerHTML = '<div class="fb ok">✍️ 写得真认真！请家长看看你写对了吗～<br><span class="an">' +
        esc(q.analysis || ("正确答案：" + q.answer)) + '</span></div>';
      afterAnswer(true, q, qz, host, "手写-家长复核");
    });
  }

  // 公共：录音（WebRTC MediaRecorder）—— 离线录音回放；不支持则降级隐藏按钮
  function mountRecorder(host, q, onRecorded) {
    var box = host.querySelector("#recBox");
    if (!box) return false;
    var recBtn = box.querySelector("#recBtn");
    var playBtn = box.querySelector("#playBtn");
    var status = box.querySelector("#recStatus");
    var supported = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
    if (!supported) { recBtn.style.display = "none"; status.textContent = "本设备不支持录音，直接点下面的按钮自评吧～"; return false; }
    var stream = null, mr = null, chunks = [], url = null;
    recBtn.addEventListener("click", function () {
      if (!stream) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function (s) {
          stream = s; mr = new MediaRecorder(s);
          mr.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
          mr.onstop = function () {
            var blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" });
            if (url) URL.revokeObjectURL(url);
            url = URL.createObjectURL(blob);
            playBtn.style.display = "";
            playBtn.onclick = function () { new Audio(url).play(); };
            status.textContent = "录好了，点 ▶️ 回放听听～";
            if (onRecorded) onRecorded();
          };
          mr.start(); chunks = []; recBtn.textContent = "⏹ 停止"; status.textContent = "正在录音…";
        }).catch(function () { status.textContent = "没拿到麦克风权限，点下面自评吧～"; recBtn.style.display = "none"; });
        return;
      }
      if (mr && mr.state === "recording") { mr.stop(); recBtn.textContent = "🎤 录音"; stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    });
    return true;
  }

  // choice / judge
  registerType("choice", {

      var opts = q.options || [];
      return '<div class="q-options btn-grid" id="optGrid">' +

        '</div>';
    },
    bind: function (host, q, qz) { bindChoice(host, q, qz); }

  // match：真连线（左右两列点选配对，提交校验）
  registerType("match", {
    renderBody: function (q) {
      var lefts = [], rights = [];
      var pairs = q.pairs || [];
      if (pairs.length) { pairs.forEach(function (p) { lefts.push(p.left); rights.push(p.right); }); }
      else if (q.options && q.options.length >= 2) {
        for (var i = 0; i + 1 < q.options.length; i += 2) { lefts.push(q.options[i]); rights.push(q.options[i + 1]); }
      }
      function col(side, arr) {
        return '<div class="match-col ' + side + '">' + arr.map(function (t, i) {
          return '<button class="match-item" type="button" data-side="' + side + '" data-idx="' + i + '">' + esc(t) + '</button>';
        }).join("") + '</div>';
      }
      return '<div class="match-area" id="matchArea"><svg class="match-lines" id="matchLines"></svg>' +
        '<div class="match-cols">' + col("left", lefts) + col("right", rights) + '</div>' +
        '<p class="match-tip">点左边一个，再点右边一个，就能连起来啦～</p></div>';
    },
    bind: function (host, q, qz) {
      var area = host.querySelector("#matchArea");
      var lines = host.querySelector("#matchLines");
      var conns = [], pending = null;
      var lefts = [], rights = [];
      var pairs = q.pairs || [];
      if (pairs.length) { pairs.forEach(function (p) { lefts.push(p.left); rights.push(p.right); }); }
      else if (q.options) { for (var i = 0; i + 1 < q.options.length; i += 2) { lefts.push(q.options[i]); rights.push(q.options[i + 1]); } }
      function svgLine(a, b, cls) {
        // match-area 已 position:relative，子元素 offsetLeft/Top 即相对于它，无需再减
        var x1 = a.offsetLeft + a.offsetWidth / 2;
        var y1 = a.offsetTop + a.offsetHeight / 2;
        var x2 = b.offsetLeft + b.offsetWidth / 2;
        var y2 = b.offsetTop + b.offsetHeight / 2;
        var ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", x1); ln.setAttribute("y1", y1); ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
        ln.setAttribute("class", "ml" + (cls ? " " + cls : "")); lines.appendChild(ln);
      }
      function redraw(feedback) {
        lines.innerHTML = "";
        Array.prototype.forEach.call(area.querySelectorAll(".match-item"), function (x) { x.classList.remove("done", "correct", "wrong"); });
        var okPairs = pairs.length ? pairs : lefts.map(function (l, i) { return { left: l, right: rights[i] }; });
        conns.forEach(function (c) {
          var la = area.querySelector('.match-item[data-side="left"][data-idx="' + c.l + '"]');
          var ra = area.querySelector('.match-item[data-side="right"][data-idx="' + c.r + '"]');
          if (!la || !ra) return;
          var isRight = okPairs.some(function (p) { return p.left === lefts[c.l] && p.right === rights[c.r]; });
          if (feedback) {
            svgLine(la, ra, isRight ? "correct" : "wrong");
            la.classList.add(isRight ? "correct" : "wrong");
            ra.classList.add(isRight ? "correct" : "wrong");
          } else {
            svgLine(la, ra);
            la.classList.add("done"); ra.classList.add("done");
          }
        });
      }
      Array.prototype.forEach.call(area.querySelectorAll(".match-item"), function (b) {
        b.addEventListener("click", function () {
          var side = b.getAttribute("data-side"), idx = +b.getAttribute("data-idx");
          if (side === "left") {
            Array.prototype.forEach.call(area.querySelectorAll('.match-item[data-side="left"]'), function (x) { x.classList.remove("pend"); });
            b.classList.add("pend"); pending = idx;
          } else {
            if (pending === null) { Pet.say("先点左边一个哦～", 1500); return; }
            conns = conns.filter(function (c) { return c.r !== idx && c.l !== pending; });
            conns.push({ l: pending, r: idx });
            Array.prototype.forEach.call(area.querySelectorAll('.match-item[data-side="left"]'), function (x) { x.classList.remove("pend"); });
            pending = null; redraw();
          }
        });
      });
      var actions = host.querySelector("#qActions");
      actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
      actions.querySelector("#submitBtn").addEventListener("click", function () {
        var leftCount = area.querySelectorAll('.match-item[data-side="left"]').length;
        if (conns.length < leftCount) { Pet.say("还有没连的哦～", 1800); return; }
        var okPairs = pairs.length ? pairs : lefts.map(function (l, i) { return { left: l, right: rights[i] }; });
        var allRight = conns.every(function (c) {
          return okPairs.some(function (p) { return p.left === lefts[c.l] && p.right === rights[c.r]; });
        });
        redraw(true); // 用颜色标出对错
        if (!allRight) {
          var fb = host.querySelector("#qFeedback");
          fb.innerHTML = '<div class="fb bad">❌ 有几对连错啦，再看看～<br><b>正确连连看：</b>' +
            okPairs.map(function (p) { return esc(p.left) + "—" + esc(p.right); }).join("，") + '</div>';
          return;
        }
        afterAnswer(true, q, qz, host, conns.map(function (c) { return lefts[c.l] + "—" + rights[c.r]; }).join("，"));
      });
    }
  });

  // fill：数字填空（数学，保持原样）
  registerType("fill", {

    bind: function (host, q, qz) { bindText(host, q, qz); }

  // fill_hanzi：汉字作答 —— 答案字在本单元已学生字表→手写板；否则自动降级选汉字
  registerType("fill_hanzi", {
    renderBody: function (q, qz) {
      var chars = unitLearnedChars(qz && qz.ctx ? qz.ctx.unitId : null);
      var canHand = chars.indexOf(q.answer) >= 0;
      if (canHand) {
        return '<div class="hw-wrap" id="hwWrap"><canvas id="hwCanvas" class="hw-canvas" width="600" height="220"></canvas>' +
          '<button class="btn ghost" id="hwClear" type="button">清除重写</button></div>' +
          '<p class="match-tip">用手指或鼠标，在框里写出这个字～</p>';
      }
      var opts = (q.options && q.options.length) ? q.options.slice() : [q.answer];
      if (opts.indexOf(q.answer) < 0) opts.unshift(q.answer);
      return '<div class="q-options btn-grid" id="optGrid">' +
        opts.map(function (o) { return '<button class="opt-btn" type="button" data-val="' + esc(o) + '">' + esc(o) + '</button>'; }).join("") +
        '</div>';
    },
    bind: function (host, q, qz) {
      var chars = unitLearnedChars(qz && qz.ctx ? qz.ctx.unitId : null);
      if (chars.indexOf(q.answer) >= 0) { mountHandwrite(host, q, qz); return; }

  // read_comp：阅读理解（语段 + 多道子题）
  // 子题若有 options → 点选作答（一年级友好）；否则 → 文本输入
  registerType("read_comp", {

      var h = '<div class="read-passage">' + esc(q.passage || "") + '</div>';
      (q.questions || []).forEach(function (sq, i) {
        h += '<div class="read-sub"><div class="read-sub-stem">' + (i + 1) + '. ' + esc(sq.stem) + '</div>';
        if (sq.options && sq.options.length) {
          h += '<div class="q-options btn-grid" id="ransGrid' + i + '">' +

            '</div>';
        } else {
          h += '<input class="q-input read-ans" id="rans' + i + '" type="text" placeholder="写下你的答案…">';
        }
        h += '</div>';
      });
      return h;
    },
    bind: function (host, q, qz) {
      var actions = host.querySelector("#qActions");
      var feedback = host.querySelector("#qFeedback");
      // 选择题子题：绑定点选高亮
      Array.prototype.forEach.call(host.querySelectorAll('[id^="ransGrid"]'), function (grid) {
        Array.prototype.forEach.call(grid.querySelectorAll(".opt-btn"), function (b) {

            b.classList.add("selected");
          });
        });
      });
      actions.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
      actions.querySelector("#submitBtn").addEventListener("click", function () {
        var allCorrect = true, parts = [];
        (q.questions || []).forEach(function (sq, i) {
          var ua = "";

        if (!allCorrect) {
          feedback.innerHTML = '<div class="fb bad">❌ 再想想～<br><b>参考答案：</b>' +
            (q.questions || []).map(function (sq) { return esc(sq.answer); }).join("；") +
            '<br><span class="an">' + esc(q.analysis || "") + '</span></div>';
        }
        afterAnswer(allCorrect, q, qz, host, parts.join(" | "));
      });
    }
  });

  // recite：背诵（录音回放 + 自评）
  registerType("recite", {

  // write：看图/看情景说一句话（录音作答 + 可选辅助书写）

  // 兜底：任何未注册题型都不白屏，给一个文本输入

  function questionHTML(q, qz) {
    var voiceBtn = (q.audio && q.audio.stem) ? '<button type="button" class="speak-btn q-voice-stem">🔊 读题目</button>' : '';
    var h = '<div class="q-stem">' + esc(q.stem) + voiceBtn + '</div>';
    if (q.image) h += '<div class="q-img"><img src="' + esc(q.image) + '" alt="" loading="lazy"></div>';
    var t = QUESTION_TYPES[q.type] || QUESTION_TYPES.__default;
