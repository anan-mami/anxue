<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>青岛版一年级学习台</title>
  <style>
/* =========================================================================
 * style.css —— 学习台样式（学习宝藏 dashboard + 科导航 + 模块导航）
 * ========================================================================= */

:root {
  --bg: #f6fbef;
  --card: #ffffff;
  --text: #2c3e50;
  --muted: #7e8a78;
  --primary: #4ecb71;
  --primary-dark: #3aa55a;
  --accent: #ffb84a;
  --success: #2ecc71;
  --warn: #f1c40f;
  --danger: #e74c3c;
  --shadow: 0 4px 18px rgba(44, 62, 80, 0.08);
  --radius: 16px;
  --sidebar-w: 96px;
  --topbar-h: 60px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ----------------------------- 名字输入弹窗 ----------------------------- */
.modal {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(44, 62, 80, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-card {
  background: var(--card); border-radius: var(--radius); padding: 32px 28px;
  text-align: center; width: 100%; max-width: 360px; box-shadow: var(--shadow);
}
.modal-emoji { font-size: 56px; margin-bottom: 8px; }
.modal-card h2 { margin: 0 0 8px; font-size: 22px; }
.modal-card p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.modal-card input {
  width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #dde6f0;
  border-radius: 12px; margin-bottom: 16px; outline: none;
}
.modal-card input:focus { border-color: var(--primary); }
.modal-card .btn { width: 100%; }

/* ----------------------------- 顶部栏 ----------------------------- */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  background:linear-gradient(135deg,#4ecb71,#7ad88a);
  box-shadow: 0 4px 16px rgba(78,203,113,.25);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; z-index: 100;
}
.topbar .tbtn{color:#fff; background:rgba(255,255,255,.18);}
.topbar .tbtn:hover{background:rgba(255,255,255,.32);}
.topbar .tbtn.ghost{background:transparent;}
.topbar .brand-title{color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.25); font-weight:700;}

  /* ===== 英语卡片网格（顶层规则！必须放在 .topbar 之外才能对同步内容区的卡片生效） ===== */
  .eng-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin:10px 0;}
  .eng-card{background:linear-gradient(135deg,#fff8ee,#fffaef); border:2px solid #ffe2b8; border-radius:12px; padding:12px 8px 10px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:6px; transition:transform .15s}
  .eng-card:hover{transform:translateY(-2px); box-shadow:0 4px 10px rgba(255,184,74,.18);}
  .eng-en{font-size:17px; font-weight:800; color:#2c7a4b; line-height:1.25; letter-spacing:.3px; word-break:break-word;}
  .eng-zh{font-size:12px; color:#8a6d3b; line-height:1.3;}
  .voice-btn-circle{position:static; width:30px; height:30px; padding:0; background:var(--primary); color:#fff; border-radius:50%; font-size:14px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(78,203,113,.35); border:none; cursor:pointer;}
  .voice-btn-circle:active{transform:scale(.92);}
  .eng-sent-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin:8px 0;}
  .eng-sent-card{background:#fff; border:2px solid #cfe9d5; border-left:5px solid var(--primary); border-radius:10px; padding:10px 12px; display:grid; grid-template-columns:1fr auto; gap:6px; align-items:center; position:relative;}
  .eng-sent-en{font-size:14px; font-weight:700; color:#1f6e3d; line-height:1.3;}
  .eng-sent-zh{font-size:12px; color:#6b7c93; margin-top:2px;}
  .eng-sent-card .voice-btn-circle{position:static; margin-left:auto;}
  .eng-dialogues{margin-top:8px;}
.topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; flex: 1; }
.topbar-right { justify-content: flex-end; }
.topbar-center {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 16px; font-weight: 700; color: var(--primary);
  min-width: 0; flex: 0 1 auto;
}
.brand-logo { font-size: 22px; line-height: 1; }
.brand-title {
  color:#fff !important;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  font-weight:700;
  white-space: nowrap;
  max-width: none;
  font-size: 16px;
}
.semester-select {
  padding: 8px 12px; border: 2px solid #dde6f0; border-radius: 10px;
  background: #fff; font-size: 14px; color: var(--text); outline: none;
}
.tbtn {
  padding: 8px 12px; border: none; border-radius: 10px;
  background: #eef4fb; color: var(--text); font-size: 14px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
}
.tbtn:hover { background: #e1ebf7; }
.tbtn.ghost { background: transparent; }
.badge-count {
  background: var(--danger); color: #fff; font-size: 11px;
  min-width: 18px; height: 18px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ----------------------------- 整体布局 ----------------------------- */
.layout {
  display: flex; min-height: 100vh;
  padding-top: var(--topbar-h);
}
.subject-nav {
  position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
  width: var(--sidebar-w); background: var(--card);
  border-right: 1px solid #e8eef5; padding: 12px 8px;
  display: flex; flex-direction: column; gap: 8px; z-index: 90;
}
.main {
  flex: 1; margin-left: var(--sidebar-w); padding: 20px;
  min-height: calc(100vh - var(--topbar-h));
}

/* ----------------------------- 左侧科导航 ----------------------------- */
.sub-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 4px; border: none; border-radius: 14px;
  background: transparent; color: var(--text); cursor: pointer;
  position: relative; transition: background .15s;
}
.sub-item:hover { background: #f1f6fc; }
.sub-item.active { background: var(--primary); color: #fff; }
.sub-item.disabled { color: var(--muted); opacity: .7; cursor: not-allowed; }
.sub-icon { font-size: 24px; }
.sub-name { font-size: 13px; }
.sub-badge {
  position: absolute; top: 6px; right: 6px;
  background: #cbd5e1; color: #fff; font-size: 10px;
  padding: 1px 5px; border-radius: 8px;
}
.sub-divider{height:1px; background:#e8f0dc; margin:10px 12px;}
.sub-extra{margin-top:4px;}
.sub-badge-count{position:absolute; top:4px; right:6px; background:#e74c3c; color:#fff; border-radius:10px; padding:1px 7px; font-size:10px; font-weight:700;}

/* ----------------------------- 页面通用 ----------------------------- */
.page { max-width: 960px; margin: 0 auto; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
h2 { margin: 0 0 16px; font-size: 22px; }
.empty {
  background: var(--card); border-radius: var(--radius); padding: 48px 24px;
  text-align: center; color: var(--muted); box-shadow: var(--shadow);
}

/* ----------------------------- Dashboard ----------------------------- */
.hero {
  background: linear-gradient(135deg, #e3f2fd 0%, #f0f7ff 100%);
  border-radius: var(--radius); padding: 24px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: var(--shadow); margin-bottom: 20px;
}
.hero-text h1 { margin: 0 0 8px; font-size: 24px; }
.hero-text p { margin: 0; color: var(--muted); }
.hero-stat { text-align: center; }
.ring {
  width: 84px; height: 84px; border-radius: 50%;
  background: conic-gradient(var(--success) calc(var(--p, 0) * 1%), #e0e7ef 0);
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.ring::after {
  content: ""; width: 66px; height: 66px; border-radius: 50%; background: #fff;
  position: absolute;
}
.ring span { position: relative; z-index: 1; font-weight: 700; font-size: 16px; }
.ring.big { width: 120px; height: 120px; }
.ring.big::after { width: 92px; height: 92px; }
.ring.big span { font-size: 22px; }
.hero-stat label { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }

.dashboard-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px;
}
.dash-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); cursor: pointer; transition: transform .15s, box-shadow .15s;
}
.dash-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(44,62,80,0.12); }
.dash-icon { font-size: 36px; margin-bottom: 8px; }
.dash-card h3 { margin: 0 0 4px; font-size: 17px; }
.dash-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; min-height: 38px; }
.dash-bars { display: flex; flex-direction: column; gap: 8px; }
.dash-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.dash-bar-name { width: 56px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dash-bar-track { flex: 1; height: 8px; background: #e8eef5; border-radius: 4px; overflow: hidden; }
.dash-bar-fill { display: block; height: 100%; border-radius: 4px; }
.dash-bar-fill.green { background: var(--success); }
.dash-bar-fill.yellow { background: var(--warn); }
.dash-bar-fill.red { background: var(--danger); }
.dash-bar-fill.none { background: #cbd5e1; }
.quick-start { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.quick-start h3 { margin: 0 0 12px; font-size: 16px; }

/* ----------------------------- Subject 模块导航 ----------------------------- */
.subject-head { margin-bottom: 12px; }
.subject-head h2 { font-size: 20px; color: var(--primary-dark); }
.module-nav {
  display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px;
  background: var(--card); padding: 10px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.mod-wrap {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 12px; border: 2px solid transparent;
}
.mod-wrap.active { background: #eaf3fd; border-color: var(--primary); }
.mod-btn {
  border: none; background: transparent; font-size: 15px; font-weight: 600;
  color: var(--text); cursor: pointer; padding: 4px 6px;
}
.mod-wrap.active .mod-btn { color: var(--primary); }
.unit-select {
  padding: 6px 8px; border: 1px solid #dde6f0; border-radius: 8px;
  background: #fff; font-size: 13px; color: var(--text); outline: none; max-width: 180px;
}

/* ----------------------------- 知识点 / 易错点 ----------------------------- */
.kp-list, .ep-list { display: flex; flex-direction: column; gap: 14px; }
.kp-card, .ep-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow); display: flex; gap: 16px;
}
.kp-img { flex: 0 0 260px; }
.kp-img img {
  width: 100%; border-radius: 12px; border: 1px solid #e8eef5;
  cursor: zoom-in; transition: transform .2s ease;
}
.kp-img img:hover { transform: scale(1.02); }
.kp-body h3 { margin: 0 0 8px; font-size: 18px; }
.kp-explain { margin: 0 0 8px; color: var(--text); }
.kp-key { margin: 0; color: var(--primary); font-size: 14px; }
.ep-icon { font-size: 28px; }
.ep-card h3 { margin: 0 0 6px; font-size: 17px; }
.ep-card p { margin: 0; color: var(--muted); font-size: 14px; }

/* ----------------------------- 每日练习 ----------------------------- */
.daily-intro {
  background: #fff8e6; border-left: 4px solid var(--accent); padding: 10px 14px;
  border-radius: 10px; margin-bottom: 14px; font-size: 14px;
}
.lvtabs { display: flex; gap: 10px; margin-bottom: 16px; }
.lvtab {
  padding: 10px 18px; border-radius: 24px; border: 2px solid #dde6f0;
  background: #fff; color: var(--text); font-size: 15px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.lvtab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.lvtab.locked { opacity: .6; }
.lock { font-size: 13px; }
.lvl-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; }
.lvl-tag.pass { background: #d4f8e4; color: #1e8449; }
.lvl-tag.fail { background: #fdebd0; color: #9c640c; }

/* ----------------------------- 练习引擎 ----------------------------- */
.quiz { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.quiz-progress { text-align: center; color: var(--muted); font-size: 15px; margin-bottom: 14px; }
.q-card { margin-bottom: 16px; }
.q-stem { font-size: 20px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }
.q-img { margin-bottom: 16px; }
.q-img img {
  display: block; max-width: 100%; max-height: 520px;
  width: auto; margin: 0 auto;
  border-radius: 12px; border: 1px solid #e8eef5;
  object-fit: contain; cursor: zoom-in;
  transition: transform .2s ease;
}
.q-img img:hover { transform: scale(1.02); }
.q-options { display: flex; flex-direction: column; gap: 10px; }
/* 大按钮选择题/判断题，适合一年级点选 */
.q-options.btn-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}
.opt-btn {
  padding: 16px 14px; border: 2px solid #e8eef5; border-radius: 14px;
  cursor: pointer; background: #fafbfc; font-size: 18px; text-align: center;
  transition: all .15s ease;
}
.opt-btn:hover { border-color: var(--primary); background: #f0f7ff; }
.opt-btn.selected {
  border-color: var(--primary); background: var(--primary); color: #fff;
  box-shadow: 0 4px 12px rgba(74,144,226,.28);
}
.q-input {
  width: 100%; padding: 14px; font-size: 24px; text-align: center;
  border: 2px solid #dde6f0; border-radius: 12px; outline: none;
}
.q-input:focus { border-color: var(--primary); }
.q-actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
.q-feedback { min-height: 60px; }
.fb { padding: 14px; border-radius: 12px; font-size: 15px; }
.fb.ok { background: #e8f8f0; color: #1e8449; }
.fb.bad { background: #fdedec; color: #c0392b; }
.an { color: var(--muted); display: block; margin-top: 6px; }
.chip {
  display: inline-block; padding: 8px 14px; background: #eef4fb;
  border-radius: 20px; margin: 4px; font-size: 15px;
}
.match-tip { color: var(--muted); font-size: 14px; }

/* ----------------------------- 按钮 ----------------------------- */
.btn {
  padding: 12px 22px; border: none; border-radius: 24px;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 600;
  cursor: pointer; transition: filter .15s;
}
.btn:hover { filter: brightness(1.05); }
.btn.primary { background: var(--primary); }
.btn.ghost { background: #eef4fb; color: var(--text); }
.btn.warn { background: var(--danger); }
.btn.small { padding: 8px 16px; font-size: 14px; }

/* ----------------------------- 结果页 ----------------------------- */
.quiz-result { text-align: center; padding: 24px; }
.result-emoji { font-size: 56px; margin-bottom: 8px; }
.result-ring { margin: 16px auto; }
.unlock-ok { color: var(--success); font-weight: 600; }
.unlock-no { color: var(--danger); }
.badge-get { color: var(--accent); font-weight: 700; }
.result-actions { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
.quiz-pet-tip{margin:8px 0 0; padding:8px 12px; background:#fff7e6; border:1px dashed #ffb967; border-radius:10px; font-size:13px; color:#a06a00; animation:quizPetPulse 2s ease-in-out infinite;}
  .quiz-pet-tip b{color:#e67e22;}
  @keyframes quizPetPulse{0%,100%{background:#fff7e6;}50%{background:#fff0d4;}}
  .pet-link{display:flex; align-items:center; gap:12px; padding:14px 16px; margin:14px 0; background:linear-gradient(135deg, #fff7e6 0%, #ffe8d6 100%); border:2px solid #ffb967; border-radius:14px; box-shadow:0 4px 12px rgba(255,159,67,0.2); animation:petLinkPop 0.5s ease-out;}
.pet-link-icon{font-size:36px; animation:bouncePet 1.2s ease-in-out infinite;}
@keyframes bouncePet{0%,100%{transform:translateY(0);}50%{transform:translateY(-4px);}}
@keyframes petLinkPop{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.pet-link-text{flex:1; line-height:1.5; font-size:14px; color:#2c3e50;}
.pet-link-text b{color:#c0392b; font-size:15px;}
.pet-link-reward{color:#e67e22; font-weight:700; font-size:14px;}

/* 激活码弹窗 */
  .lic-mask{position:fixed; inset:0; background:rgba(44,62,80,.5); z-index:9999; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lic-card{background:#fff; border-radius:20px; padding:22px; max-width:340px; width:100%; box-shadow:0 12px 40px rgba(0,0,0,.25); animation:licPop .35s cubic-bezier(.34,1.56,.64,1);}
  @keyframes licPop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
  .lic-lock{text-align:center; padding:40px 20px; background:#fff7e6; border:2px dashed #ffb967; border-radius:16px; margin:16px 0;}
  .lic-lock h2{margin:10px 0 6px; color:#c0392b;}
  .lic-lock p{color:#a06a00; margin:0 0 16px; font-size:14px;}
  /* ----------------------------- 学情看板 ----------------------------- */
.progress-tip {
  background: #e8f8f0; color: #1e8449; padding: 10px 14px;
  border-radius: 10px; margin-bottom: 14px; font-size: 14px;
}
.ov-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
}
.ov-card .sub { color: var(--muted); font-size: 14px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 10px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
.dot.green { background: var(--success); }
.dot.yellow { background: var(--warn); }
.dot.red { background: var(--danger); }
.dot.none { background: #cbd5e1; }
.unit-bars { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.ubar-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
.ubar-row:last-child { border-bottom: none; }
.ubar-name { width: 160px; font-size: 14px; }
.ubar-track { flex: 1; height: 10px; background: #e8eef5; border-radius: 5px; overflow: hidden; }
.ubar-fill { display: block; height: 100%; border-radius: 5px; }
.ubar-fill.green { background: var(--success); }
.ubar-fill.yellow { background: var(--warn); }
.ubar-fill.red { background: var(--danger); }
.ubar-pct { width: 90px; text-align: right; font-size: 13px; color: var(--muted); }
.badge-wall { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.badge-item {
  background: #fff8e6; color: #8a5a1a; padding: 8px 14px;
  border-radius: 20px; font-size: 14px;
}

/* ----------------------------- 错题本 ----------------------------- */
.mm-list { display: flex; flex-direction: column; gap: 14px; }
.mm-card {
  background: var(--card); border-radius: var(--radius); padding: 18px;
  box-shadow: var(--shadow);
}
.mm-meta { display: flex; gap: 8px; margin-bottom: 10px; }
.tag {
  background: #eef4fb; color: var(--primary); padding: 4px 10px;
  border-radius: 12px; font-size: 12px;
}
.tag.gray { background: #f1f5f9; color: var(--muted); }
.mm-stem { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.mm-img img { max-width: 220px; border-radius: 10px; }
.mm-ans { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; margin: 10px 0; }
.mm-ans .bad { color: var(--danger); }
.mm-ans .good { color: var(--success); }
.mm-an { color: var(--muted); font-size: 14px; margin-bottom: 12px; }

/* ----------------------------- 宠物 ----------------------------- */
.pet-host {
  position: fixed; right: 18px; bottom: 18px; z-index: 80;
}
.pet-page .pet-card-big {
  background: var(--card); border-radius: var(--radius); padding: 28px;
  text-align: center; box-shadow: var(--shadow); margin-bottom: 20px;
}
.pet-avatar-big { font-size: 80px; }
.hunger-bar { height: 12px; background: #e8eef5; border-radius: 6px; overflow: hidden; margin: 12px 0 18px; }
.hunger-bar span { display: block; height: 100%; background: var(--success); transition: width .3s; }

/* ----------------------------- 宠物动画（由 pet.js 注入 SVG） ----------------------------- */
.pet { position: relative; text-align: center; }
.pet-name { font-size: 12px; color: var(--muted); margin-top: 4px; }
.pet-feed {
  position: absolute; top: -8px; right: -4px;
  width: 32px; height: 32px; border-radius: 50%; border: none;
  background: #fff; box-shadow: var(--shadow); font-size: 16px; cursor: pointer;
}
.pet-svg { width: 90px; height: 90px; cursor: pointer; filter: drop-shadow(0 4px 10px rgba(0,0,0,.12)); }
.pet-bubble {

r", "analysis": "m1a_math1a_theme1_theme1_q3_analysis"}}, {"id": "theme1_q4", "type": "choice", "knowledge_point": "kp_theme1_3", "stem": "看图，用下面哪个积木能印出圆形？", "options": ["圆柱", "正方体", "长方体"], "answer": "圆柱", "analysis": "圆柱的底面是圆，可以印出圆形。", "image": "assets/images/img_fdee8f6a1c70.jpg", "audio": {"stem": "m1a_math1a_theme1_theme1_q4_stem", "answer": "m1a_math1a_theme1_theme1_q4_answer", "analysis": "m1a_math1a_theme1_theme1_q4_analysis"}}, {"id": "theme1_q5", "type": "fill", "knowledge_point": "kp_theme1_4", "stem": "套圈游戏规则：套中1个黑棋得2分，套中1个白棋得1分。小宁套中1个黑棋和1个白棋，一共得（  ）分。", "answer": "3", "analysis": "2+1=3，一共得3分。", "image": null, "audio": {"stem": "m1a_math1a_theme1_theme1_q5_stem", "answer": "m1a_math1a_theme1_theme1_q5_answer", "analysis": "m1a_math1a_theme1_theme1_q5_analysis"}}, {"id": "theme1_q6", "type": "fill", "knowledge_point": "kp_theme1_5", "stem": "看图，从起点向前跳5格到小猴卡片，现在在第（  ）格。", "answer": "5", "analysis": "从起点向前数5格，正好到小猴卡片。", "image": "assets/images/img_ccc4fcdb6245.jpg", "audio": {"stem": "m1a_math1a_theme1_theme1_q6_stem", "answer": "m1a_math1a_theme1_theme1_q6_answer", "analysis": "m1a_math1a_theme1_theme1_q6_analysis"}}], "error_prone": [{"id": "ce_theme1_1", "title": "比高矮要站在同一地面", "desc": "一个站台阶、一个站平地来比高矮是不公平的，结果不准。比高矮时，两个人要站在同一平面上再比。", "image": "assets/images/img_4866efeb1db0.jpg", "audio": {"title": "m1a_math1a_theme1_ce_theme1_1_title", "desc": "m1a_math1a_theme1_ce_theme1_1_desc"}}, {"id": "ce_theme1_2", "title": "排队“第几”要先说清从哪边数", "desc": "从前面数和从后面数，“第3”不是同一个人。数第几时一定要先说清是从哪边开始数。", "image": "assets/images/img_869df8d71d05.jpg", "audio": {"title": "m1a_math1a_theme1_ce_theme1_2_title", "desc": "m1a_math1a_theme1_ce_theme1_2_desc"}}, {"id": "ce_theme1_3", "title": "套圈得分：黑棋2分、白棋1分", "desc": "容易把分数记反，写成白棋2分。记住：黑棋得2分、白棋得1分，再把几次得分加起来比大小。", "image": null, "audio": {"title": "m1a_math1a_theme1_ce_theme1_3_title", "desc": "m1a_math1a_theme1_ce_theme1_3_desc"}}, {"id": "ce_theme1_4", "title": "球印不出图形", "desc": "球没有平平的面，滚来滚去印不出图形。只有圆柱、正方体、长方体等“有平的面”的积木，才能印出对应的平面图形。", "image": "assets/images/img_fdee8f6a1c70.jpg", "audio": {"title": "m1a_math1a_theme1_ce_theme1_4_title", "desc": "m1a_math1a_theme1_ce_theme1_4_desc"}}], "mid_test": [], "final_test": [], "pages": [{"image": "assets/math_pages/上册/p008.png", "title": "教材原页 P8", "knowledge_points": [{"title": "活动1：画一画幼儿园", "explain": "主题活动“我的幼儿园”开篇，先出示两张幼儿园实景照片，提出问题：“还记得你的幼儿园吗？你能把它画下来吗？”接着展示小朋友画的“我的幼儿园”“我画游戏区”等图画，引导学生回忆并动手画出自己幼儿园的样子。", "key": "画下我心中的幼儿园"}]}, {"image": "assets/math_pages/上册/p009.png", "title": "教材原页 P9", "knowledge_points": [{"title": "活动2：用数学语言介绍", "explain": "活动分为“我的教室”“我的户外活动区”“我的______”三块。例题中融入数学知识：教室里有18个小朋友、9张桌子，黑板面和课桌面是长方形的；4人排队从前面数排第3；比较高矮。让学生用数数、位置、形状、比较等数学语言介绍自己的画。", "key": "用数数、形状、比较介绍"}]}, {"image": "assets/math_pages/上册/p010.png", "title": "教材原页 P10", "knowledge_points": [{"title": "游戏1：积木盖章印图形", "explain": "准备圆柱、长方体、正方体、三棱柱等积木，配印泥和画有△·□○等图形的纸。玩法：先看图形找对应积木，再在纸上对应位置印出图形；2分钟内谁印对的图形多谁赢，培养立体图形与平面图形的对应感知。", "key": "看图找积木，对应印图形"}]}, {"image": "assets/math_pages/上册/p011.png", "title": "教材原页 P11", "knowledge_points": [{"title": "游戏2：套圈得分算一算", "explain": "两人一组轮流用圆环套黑白棋子，规则：套中1个●得2分，套中1个●得1分。例题“我套中2个●得2分”“我套中1个●和1个●得3分”，并用表格记录每人套中黑、白棋个数与总分，比较谁的分多谁赢，引出乘法计算。", "key": "几个几用乘法，算总分比胜负"}]}, {"image": "assets/math_pages/上册/p012.png", "title": "教材原页 P12", "knowledge_points": [{"title": "游戏3：听指令跳格子", "explain": "准备方格棋盘和5张动物卡片。两人一组，一人读指令（“向前跳5格拿小猴卡”“向前跳2格再向右跳1格拿小熊卡”），一人在格子上跳并拿对应卡。游戏后用“男生组/女生组”表格记录各自所得卡片数，多者胜，培养方向感与多少比较。", "key": "听指令辨方向，记录比多少"}]}, {"image": "assets/math_pages/上册/p013.png", "title": "教材原页 P13", "knowledge_points": [{"title": "交流反思与新游戏设计", "explain": "回顾画幼儿园和三个数学游戏的收获：用数学知识介绍幼儿园、弄清玩法记结果、遵守规则团队合作。提出拓展活动“两人掷骰子比朝上一面的数谁大谁赢”。最后自我评价四项：能画幼儿园、会用数学介绍、能按规则玩游戏、能主动表达分享。", "key": "反思收获，设计新游戏"}]}]}, {"unit_id": "math1a_u1", "unit": "第一单元 快乐的课堂——1~5数的认识和加减法", "image": "assets/images/img_e3df0c5c2ee6.jpg", "knowledge_points": [{"id": "kp_u1_1", "title": "认识1~5各数", "image": "assets/images/img_e3df0c5c2ee6.jpg", "explain": "打开学习用品箱和体育用品箱看一看，里面有什么？各有几个？学习用品箱里有1把剪刀、2个转笔刀、3个夹子、4块橡皮、5支铅笔；体育用品箱里有3个毽子、4个羽毛球……用圆点表示数量，1个圆点对应数字1，2个圆点对应数字2，一直对应到5。数物体时要一个一个地数，数到几就表示有几个。", "key": "数物体时一个一个地数，数到几就是几个；1~5各数用相应个数的圆点表示。", "audio": {"title": "m1a_math1a_u1_kp_u1_1_title", "explain": "m1a_math1a_u1_kp_u1_1_explain", "key": "m1a_math1a_u1_kp_u1_1_key"}}, {"id": "kp_u1_2", "title": "1~5的分与合", "image": "assets/images/img_a5fac4343503.jpg", "explain": "在计数器上拨一拨：1添上1是2，2添上1是3，3添上1是4，4添上1是5。这些数怎么写呢？照着样子写一写。5个圆点分成两部分，可以分成1和4、2和3、3和2、4和1；反过来，1和4合起来是5，2和3合起来也是5。想一想：4可以分成几和几？", "key": "5可以分成1和4、2和3；两部分合起来就是原来的数。", "audio": {"title": "m1a_math1a_u1_kp_u1_2_title", "explain": "m1a_math1a_u1_kp_u1_2_explain", "key": "m1a_math1a_u1_kp_u1_2_key"}}, {"id": "kp_u1_3", "title": "比大小、比多少和第几", "image": "assets/images/img_3ba0a8f72d27.jpg", "explain": "小朋友们在做游戏。一队有5人，一队有4人，5人比4人多，所以5大于4，写作5>4；4小于5，写作4<5。排队时还要注意“第几”：从前往后数，军军排第1，冬冬排第2，心心排第……“第几”说的是位置，“几个”说的是总数。", "key": "数量多的数就大；排队要说清从哪边数第几；“第几”是位置，“几个”是总数。", "audio": {"title": "m1a_math1a_u1_kp_u1_3_title", "explain": "m1a_math1a_u1_kp_u1_3_explain", "key": "m1a_math1a_u1_kp_u1_3_key"}}, {"id": "kp_u1_4", "title": "5以内的加法", "image": "assets/images/img_48870e5007e3.jpg", "explain": "乐乐折了3个纸风车，丽丽折了2个，两人一共折了几个？把3个和2个合起来，用算式表示就是3+2=5（个）。“+”叫加号，读作“3加2等于5”。还可以写成2+3=5。求一共有多少，把两个数合起来，用加法。", "key": "求一共有多少，把两个数合起来，用加法。", "audio": {"title": "m1a_math1a_u1_kp_u1_4_title", "explain": "m1a_math1a_u1_kp_u1_4_explain", "key": "m1a_math1a_u1_kp_u1_4_key"}}, {"id": "kp_u1_5", "title": "5以内的减法", "image": "assets/images/img_fed3fccafc30.jpg", "explain": "桌上一共有4个纸风车，拿走了2个，还剩几个？从4个里面去掉2个，用算式表示就是4-2=2（个）。“-”叫减号，读作“4减2等于2”。从总数里去掉一部分，求剩下多少，用减法。", "key": "从总数里去掉一部分，求剩下多少，用减法。", "audio": {"title": "m1a_math1a_u1_kp_u1_5_title", "explain": "m1a_math1a_u1_kp_u1_5_explain", "key": "m1a_math1a_u1_kp_u1_5_key"}}], "error_prone": [{"id": "ep_u1_1", "title": "第几和几个不一样", "desc": "「几个」表示一共有多少，「第几」表示排在哪个位置。看到队伍要先弄清问的是总数还是顺序，别把第3当成一共3人。", "image": null, "audio": {"title": "m1a_math1a_u1_ep_u1_1_title", "desc": "m1a_math1a_u1_ep_u1_1_desc"}}, {"id": "ep_u1_2", "title": "比大小先数清数量", "desc": "比大小时要数清两组各有多少个，哪个数量多哪个数就大，不能只看着数字样子就下结论。", "image": null, "audio": {"title": "m1a_math1a_u1_ep_u1_2_title", "desc": "m1a_math1a_u1_ep_u1_2_desc"}}, {"id": "ep_u1_3", "title": "加法要把两部分合起来", "desc": "列加法算式时，总数写在等号后面，是「两部分合起来」。别把其中一部分写在等号后面。", "image": null, "audio": {"title": "m1a_math1a_u1_ep_u1_3_title", "desc": "m1a_math1a_u1_ep_u1_3_desc"}}, {"id": "ep_u1_4", "title": "减法总数要在最前面", "desc": "减法是从总数里去掉一些，所以算式最前面一定是总数。写成「去掉的数减剩下的数」就错了。", "image": null, "audio": {"title": "m1a_math1a_u1_ep_u1_4_title", "desc": "m1a_math1a_u1_ep_u1_4_desc"}}], "daily": {"基础": [{"id": "u1_b1", "type": "choice", "knowledge_point": "kp_u1_1", "stem": "下面哪个数表示「3个」？", "options": ["2", "3", "4"], "answer": "3", "analysis": "3表示3个东西，所以选3。", "image": null, "audio": {"stem": "m1a_math1a_u1_u1_b1_stem", "answer": "m1a_math1a_u1_u1_b1_answer", "analysis": "m1a_math1a_u1_u1_b1_analysis"}}, {"id": "u1_b2", "type": "fill", "knowledge_point": "kp_u1_1", "stem": "数一数，2再添上1是（ ）。", "answer": "3", "analysis": "2后面接着数是3，所以2添上1是3。", "image": null, "audio": {"stem": "m1a_math1a_u1_u1_b2_stem", "answer": "m1a_math1a_u1_u1_b2_answer", "analysis": "m1a_math1a_u1_u1_b2_analysis"}}, {"id": "u1_b3", "type": "choice", "knowledge_point": "kp_u1_3", "stem": "3和5比，哪个大？", "options": ["3大", "5大", "一样大"], "answer": "5大", "analysis": "5比3多，所以5大。", "image": null, "audio": {"stem": "m1a_math1a_u1_u1_b3_stem", "answer": "m1a_math1a_u1_u1_b3_answer", "analysis": "m1a_math1a_u1_u1_b3_analysis"}}, {"id": "u1_b4", "type": "fill", "knowledge_point": "kp_u1_2", "stem": "5可以分成2和（ ）。", "answer": "3", "analysis": "5可以分成2和3，因为2加3等于5。", "image": null, "audio": {"stem": "m1a_math1a_u1_u1_b4_stem", "answer": "m1a_math1a_u1_u1_b4_answer", "analysis": "m1a_math1a_u1_u1_b4_analysis"}}, {"id": "u1_b5", "type": "fill", "knowledge_point": "kp_u1_4", "stem": "2加3等于（ ）。", "answer": "5", "analysis": "2和3合起来是5，所以2加3等于5。", "image": null, "audio": {"stem": "m1a_math1a_u1_u1_b5_stem", "answer": "m1a_math1a_u1_u1_b5_answer" : [{"title": "1~5的写法与分合", "explain": "用计数器拨一拨，1添上1是2、2添上1是3……认识数序；在田字格里练习1~5的写法；探索5的分与合。", "key": "1添1是2，2添1是3"}]}, {"image": "assets/math_pages/上册/p016.png", "title": "教材原页 P16", "knowledge_points": [{"title": "1~5的练习与应用", "explain": "连一连运动项目各有几人，数一数叶子写数字，说一说生活中的2只手、4个轮子、5口人。", "key": "数一数，写一写"}]}, {"image": "assets/math_pages/上册/p017.png", "title": "教材原页 P17", "knowledge_points": [{"title": "分与合和看数画珠", "explain": "根据跳绳人数填3、4、5的分与合；看数字在计数器上画珠子；数鞋子数量写出家里来了几位客人。", "key": "数的分与合"}]}, {"image": "assets/math_pages/上册/p018.png", "title": "教材原页 P18", "knowledge_points": [{"title": "数数量涂色接着画", "explain": "数每幅图中小朋友和凳子各有几个并写数；按数字给灯笼、花、苹果涂色；接着画图使数量与数字对应。", "key": "数清楚，对应好"}]}, {"image": "assets/math_pages/上册/p019.png", "title": "教材原页 P19", "knowledge_points": [{"title": "数轮子与数学游戏", "explain": "写出独轮车、自行车、三轮车、汽车的轮子数；玩转盘走格子游戏；课外下五子棋感受5个连成线。", "key": "轮子数量我认识"}]}, {"image": "assets/math_pages/上册/p020.png", "title": "教材原页 P20", "knowledge_points": [{"title": "认识第几和比大小", "explain": "在排队情境中区分第几和几人；用圆片一一对应摆一摆比较5和4，认识大于号、小于号及读写。", "key": "开口朝大数"}]}, {"image": "assets/math_pages/上册/p021.png", "title": "教材原页 P21", "knowledge_points": [{"title": "认识等号与排顺序", "explain": "两队人数都是5，认识5=5及等号；练习按顺序给彩虹条涂色、给小火车车厢按1~5重新排号。", "key": "同样多用等号"}]}, {"image": "assets/math_pages/上册/p022.png", "title": "教材原页 P22", "knowledge_points": [{"title": "比多少并练习大小", "explain": "看图比较蜜蜂与花、蝴蝶与花的多少并填＞＜＝；按要求画出同样多、比多少；做比大小练习。", "key": "一一对应比多少"}]}, {"image": "assets/math_pages/上册/p023.png", "title": "教材原页 P23", "knowledge_points": [{"title": "比大小解决生活问题", "explain": "比较鸡蛋和蛋托数量判断能否放下；解决动物滑滑梯的排队问题；课外玩保龄球比一比数量。", "key": "先数再比大小"}]}, {"image": "assets/math_pages/上册/p024.png", "title": "教材原页 P24", "knowledge_points": [{"title": "认识5以内的加法", "explain": "在折纸飞机情境中，3个纸飞机加2个一共5个，认识加号，学习3+2=5，知道交换加数位置和不变。", "key": "合起来用加法"}]}, {"image": "assets/math_pages/上册/p025.png", "title": "教材原页 P25", "knowledge_points": [{"title": "加法应用与摆一摆", "explain": "判断再做1个风车是否同样多，列3+1=4；摆小方块写加法算式；看图说算式表示的意思。", "key": "求一共用加法"}]}, {"image": "assets/math_pages/上册/p026.png", "title": "教材原页 P26", "knowledge_points": [{"title": "加法练习与交换规律", "explain": "看图写加法算式，如花瓶插花、小兔拔萝卜；画一画填数；探索两个数相加交换位置和不变。", "key": "交换位置和不变"}]}, {"image": "assets/math_pages/上册/p027.png", "title": "教材原页 P27", "knowledge_points": [{"title": "加法综合练习与游戏", "explain": "比较算式与数的大小；看图列加法算式；算一算连一连对应结果；玩数字卡片游戏凑成5。", "key": "凑成5好朋友"}]}, {"image": "assets/math_pages/上册/p028.png", "title": "教材原页 P28", "knowledge_points": [{"title": "认识5以内的减法", "explain": "4个风车拿走2个还剩2个，认识减号和4-2=2；5个纸飞机放飞2个还剩3个，学习5-2=3。", "key": "去掉用减法"}]}, {"image": "assets/math_pages/上册/p029.png", "title": "教材原页 P29", "knowledge_points": [{"title": "减法应用与看图列式", "explain": "判断放飞2个纸飞机后是否同样多，列5-2=3；根据小鸟离巢等图意说出减法算式的意思。", "key": "求剩余用减法"}]}, {"image": "assets/math_pages/上册/p030.png", "title": "教材原页 P30", "knowledge_points": [{"title": "减法综合看图列式", "explain": "看图写减法算式，如猴子吃桃、足球拿走；画一画算减法；小鸟飞走情境列式；做加减口算游戏。", "key": "想分与合算得快"}]}, {"image": "assets/math_pages/上册/p031.png", "title": "教材原页 P31", "knowledge_points": [{"title": "加减混合练习游戏", "explain": "搬椅子情境列连减算式；根据1+3、4-1等算式画一画；加减法口算对比练习；猜拳游戏列减法算式。", "key": "看清符号再计算"}]}, {"image": "assets/math_pages/上册/p032.png", "title": "教材原页 P32", "knowledge_points": [{"title": "我学会了吗综合练", "explain": "套圈游戏中区分第几和数量；根据车轮分与合填数；送小鸟回家，把算式和得数连一连。", "key": "综合运用练一练"}]}, {"image": "assets/math_pages/上册/p033.png", "title": "教材原页 P33", "knowledge_points": [{"title": "单元综合应用回顾", "explain": "钻筒筒情境填一填、比一比；看插线板图算还能插几个；丰收园回顾本单元读数、写数、加减法。", "key": "生活中的数学"}]}]}, {"unit_id": "math1a_u2", "unit": "第二单元 走进花果山——6~10数的认识和加减法", "image": "assets/images/img_108aafcd2118.jpg", "knowledge_points": [{"id": "kp_u2_g1", "title": "认识6~10各数", "image": "assets/images/img_108aafcd2118.jpg", "explain": "走进花果山啦！图中有几个小朋友？有几只小猴子？用圆点摆一摆数一数：6个小朋友对应数字6，7只小猴对应数字7。接着往下数：8、9、10。数物体时一个一个地数，数到几就表示有几个。", "key": "从6数到10；数到几就是有几个。", "audio": {"title": "m1a_math1a_u2_kp_u2_g1_title", "explain": "m1a_math1a_u2_kp_u2_g1_explain", "key": "m1a_math1a_u2_kp_u2_g1_key"}}, {"id": "kp_u2_g2", "title": "10以内数的比大小", "image": "assets/images/img_f32dae45b73e.jpg", "explain": "在计数器上拨一拨、比一比：5添上1是6，6添上1是7，7添上1是8。6比5大，写作6>5；7比6大，写作7>6。排队时，飞飞排第1，要说清从哪边数才能知道乐乐排第几。把6个方块分成两堆，可以分成1和5、2和4、3和3。", "key": "数量多的数就大；排队要说清从哪边数第几；6可以分成1和5、2和4、3和3。", "audio": {"title": "m1a_math1a_u2_kp_u2_g2_title", "explain": "m1a_math1a_u2_kp_u2_g2_explain", "key": "m1a_math1a_u2_kp_u2_g2_key"}}, {"id": "kp_u2_g3", "title": "6~10的分与合", "image": "assets/images/img_ab95ea2cc2dd.jpg", "explain": "7添上1是8，8添上1是9。把8个方块分成两堆，可以分成1和7、2和6、3和5、4和4；反过来，它们合起来都是8。把9个方块分成两堆，也有好几种分法。分与合是相反的：分是把一个数分成两部分，合是把两部分变成一个数。", "key": "8、9都可以分成两个数；分与合是相反的。", "audio": {"title": "m1a_math1a_u2_kp_u2_g3_title", "explain": "m1a_math1a_u2_kp_u2_g3_explain", "key": "m1a_math1a_u2_kp_u2_g3_key"}}, {"id": "kp_u2_g4", "title": "10以内的加法", "image": "assets/images/img_20a1f4d41998.jpg", "explain": "小兔子的故事：原来有4只兔子，先来了3只，又来了2只，现在一共有几只？把4、3、2三部分合起来，用算式表示就是4+3+2=9（只）。算连加时，先算4+3=7，再算7+2=9。求一共有多少，把几个数合起来，用加法。", "key": "求一共有多少，把几个数合起来，用加法；连加要先算前两个，再加第三个。", "audio": {"title": "m1a_math1a_u2_kp_u2_g4_title", "explain": "m1a_math1a_u2_kp_u2_g4_explain", "key": "m1a_math1a_u2_kp_u2_g4_key"}}, {"id": "kp_u2_g5", "title": "10以内的减法和0", "image": "assets/images/img_3c6b622e769b.jpg", "explain": "小猴子摘桃子，篮子里原来有3个、2个、1个，最后1个也掉了，篮子里一个桃子也没有了。一个也没有，用0表示。0表示没有。0加任何数还等于那个数，任何数减0也等于它自己。", "key": "一个也没有用0表示；0加几等于几，几减0等于几。", "audio": {"title": "m1a_math1a_u2_kp_u2_g5_title", "explain": "m1a_math1a_u2_kp_u2_g5_explain", "key": "m1a_math1a_u2_kp_u2_g5_key"}}], "error_prone": [{"id": "ep_u2_1", "title": "第几和几个不一样", "desc": "「几个」表示一共有多少，「第几」表示排在哪个位置。看到队伍要先弄清问的是总数还是顺序，别把第6当成一共6人。", "image": null, "audio": {"title": "m1a_math1a_u2_ep_u2_1_title", "desc": "m1a_math1a_u2_ep_u2_1_desc"}}, {"id": "ep_u2_2", "title": "0表示一个也没有", "desc": "盘子里一个桃子也没有，就用0表示。0加3还是3，3减0还是3，不要把0当成什么都没有意义。", "image": null, "audio": {"title": "m1a_math1a_u2_ep_u2_2_title", "desc": "m1a_math1a_u2_ep_u2_2_desc"}}, {"id": "ep_u2_3", "title": "减法总数要在最前面", "desc": "减法是从总数里去掉一些，所以算式最前面一定是总数。写成「去掉的数减剩下的数」就错了。", "image": null, "audio": 讲数学故事"}]}, {"image": "assets/math_pages/上册/p057.png", "title": "教材原页 P57", "knowledge_points": [{"title": "连加连减算法", "explain": "小兔图原来4先来3后来2，4+3+2=□；小猴图原来5跳下1再跳下2，5-1-2=□；方法都是先算前两个再加或减。", "key": "连加连减，从左往右算"}]}, {"image": "assets/math_pages/上册/p058.png", "title": "教材原页 P58", "knowledge_points": [{"title": "看图列连加连减", "explain": "筷子5+□+□=□、方块7+□+□=□；10-2-□=□、9-□-□=□；乌龟图□-□-□=□；连加连减口算；小鸟树图列式。", "key": "看图分步连加连减"}]}, {"image": "assets/math_pages/上册/p059.png", "title": "教材原页 P59", "knowledge_points": [{"title": "数轴上连加连减", "explain": "3幅自行车图列连加算式；数轴上3+()+()跳到9、()-()-()从10到3；比大小9-4-3○3等；10本书借3借5还剩几。", "key": "数轴助解连加连减"}]}, {"image": "assets/math_pages/上册/p060.png", "title": "教材原页 P60", "knowledge_points": [{"title": "青蛙跳河与涂色规律", "explain": "岸上青蛙第1次跳几只、第2次跳几只列连减；连续弹3次每次击倒2个列连减；聪明小屋按规律涂第10朵花瓣。", "key": "找规律涂色，连减三步算"}]}, {"image": "assets/math_pages/上册/p061.png", "title": "教材原页 P61", "knowledge_points": [{"title": "先减再加算法", "explain": "小猴学钓鱼图，原来5只走了3只又来了1只，5-3+1=□；方法：先算5-3=2，再算2+1=3；现在鱼缸里几条鱼列式。", "key": "先减再加，按顺序算"}]}, {"image": "assets/math_pages/上册/p062.png", "title": "教材原页 P62", "knowledge_points": [{"title": "加减混合列式与口算", "explain": "气球图□+□-□=□；天鹅图飞走飞来□○□○□=□；加减混合口算4+3-2、6-2+5等；公交车原来6人下2上4现在几人。", "key": "看清变化，先减后加或先加后减"}]}, {"image": "assets/math_pages/上册/p063.png", "title": "教材原页 P63", "knowledge_points": [{"title": "算式连结果与小马过河", "explain": "算式7-2-1连结果4等；小猫钓鱼按算式找鱼(6+3-7/8-5-1/7-4+5/8-4+4/9-4+3/4+4+2)；小马过河选得数3的石头走。", "key": "算式连结果，安全过河选对石"}]}, {"image": "assets/math_pages/上册/p064.png", "title": "教材原页 P64", "knowledge_points": [{"title": "混合运算与数阵", "explain": "摘果子我摘5你摘4送给奶奶3还剩几个□○□○□=□；猴子走后来□○□○□=□；三角形三条线三个数相加得10填数。", "key": "每条线三数相加得10"}]}, {"image": "assets/math_pages/上册/p065.png", "title": "教材原页 P65", "knowledge_points": [{"title": "0—10加法表", "explain": "整理10以内加法算式表，按得数0到10排列；认识0-10、读写、比较、10以内加减法及计数器；发现加法计算有规律。", "key": "竖看横看找规律，加法有规律"}]}, {"image": "assets/math_pages/上册/p066.png", "title": "教材原页 P66", "knowledge_points": [{"title": "0—10减法表", "explain": "整理10以内减法算式表；8-3可由5+3=8推出；找得数是5的所有减法；从小老鼠9-2-7、4+0+5等从左到右依次计算。", "key": "减法表横竖看，减法是加法的逆运算"}]}, {"image": "assets/math_pages/上册/p067.png", "title": "教材原页 P67", "knowledge_points": [{"title": "看珠子按顺序口算", "explain": "看计数器珠子写数；按顺序写数9、□、7…1和2、4、6…；10以内加减口算含连加减混合；你说我写2+6=8、6-2=4；填□5+□=7等。", "key": "看珠子写数，按规律写数"}]}, {"image": "assets/math_pages/上册/p068.png", "title": "教材原页 P68", "knowledge_points": [{"title": "推理与综合应用", "explain": "表格选√猜朵朵吃9草莓天天差不多的数；藤架豆角数算式；小动物盒子里卡片7+1、8-3、4+3组合；比大小；转盘外圈填数使3+□或10-□。", "key": "根据信息猜数，转盘填数"}]}, {"image": "assets/math_pages/上册/p069.png", "title": "教材原页 P69", "knowledge_points": [{"title": "得数7迷宫与情境", "explain": "南瓜图□○□○□=□；沿得数是7的算式走(5+2/3+6/4+3/10-3/9-2等)帮小狗找骨头；海边捕鱼捡蟹拾贝壳情境。", "key": "得数7的算式走出迷宫"}]}, {"image": "assets/math_pages/上册/p070.png", "title": "教材原页 P70", "knowledge_points": [{"title": "情境提问题与杂技", "explain": "海边图：一共有几筐鱼列□○□=□和□○□○□=□；一共有几只螃蟹列□○□○□=□；杂技演员看图提问题骑车几人、抛球比碗。", "key": "根据图意，提出多种问题"}]}, {"image": "assets/math_pages/上册/p071.png", "title": "教材原页 P71", "knowledge_points": [{"title": "多种列式与接龙算式", "explain": "鸡蛋盒几格几蛋□○□=□；8只小鸡几只进屋□○□○□=□；8只兔子列四道不同算式；接龙4+5→-6→+4→-3→+6和7-4→+6→-5→+3→+2。", "key": "一图多式，接龙连续算"}]}, {"image": "assets/math_pages/上册/p072.png", "title": "教材原页 P72", "knowledge_points": [{"title": "10以内数与加减回顾", "explain": "劳动基地一共几棵□○□=□、没拔几棵□○□=□；糖葫芦买3串买4串还剩几串□○□○□=□；回顾10以内数读写、大小、加减解决问题。", "key": "会用10以内加减法解决问题"}]}]}, {"unit_id": "math1a_u3", "unit": "第三单元 创意拼搭——认识立体图形", "image": "assets/images/img_e8247acaace5.jpg", "knowledge_points": [{"id": "kp_u3_g1", "title": "认识长方体", "image": "assets/images/img_e8247acaace5.jpg", "explain": "观察这些物体，它们的形状是长方体。长方体有6个面，每个面大都是长长的长方形。像书本、牙膏盒、文具盒这样的东西，形状接近长方体。长方体有平平的面，可以稳稳地放住。", "key": "长方体长长方方，有6个平平的长方形面。", "audio": {"title": "m1a_math1a_u3_kp_u3_g1_title", "explain": "m1a_math1a_u3_kp_u3_g1_explain", "key": "m1a_math1a_u3_kp_u3_g1_key"}}, {"id": "kp_u3_g2", "title": "认识正方体", "image": "assets/images/img_d4c3733f6134.jpg", "explain": "这些物体的形状是正方体。正方体也有6个面，而且6个面都是大小一样的正方形。像魔方、骰子这样的东西就是正方体。摸一摸，正方体的每个面都是四四方方的。", "key": "正方体四四方方，6个面都是大小一样的正方形。", "audio": {"title": "m1a_math1a_u3_kp_u3_g2_title", "explain": "m1a_math1a_u3_kp_u3_g2_explain", "key": "m1a_math1a_u3_kp_u3_g2_key"}}, {"id": "kp_u3_g3", "title": "认识圆柱", "image": "assets/images/img_8434ea5604c3.jpg", "explain": "圆柱上下两个面是圆圆的、平平的，侧面是弯弯的。像罐头盒、水杯这样的东西接近圆柱。圆柱可以像柱子一样立着放稳，躺下来还能滚动。比一比，有的圆柱高、有的矮，有的粗、有的细。", "key": "圆柱上下两面是圆，侧面弯弯的；能立着站稳，躺着能滚。", "audio": {"title": "m1a_math1a_u3_kp_u3_g3_title", "explain": "m1a_math1a_u3_kp_u3_g3_explain", "key": "m1a_math1a_u3_kp_u3_g3_key"}}, {"id": "kp_u3_g4", "title": "认识球", "image": "assets/images/img_321d022f19cc.jpg", "explain": "球是圆圆的，没有平平的面。像皮球、足球、乒乓球这样圆圆的东西就是球。球放在地上会到处滚动，因为它的表面没有平的地方，放不稳。找一找，你身边哪些东西是球？", "key": "球圆圆的，没有平平的面，会到处滚动。", "audio": {"title": "m1a_math1a_u3_kp_u3_g4_title", "explain": "m1a_math1a_u3_kp_u3_g4_explain", "key": "m1a_math1a_u3_kp_u3_g4_key"}}, {"id": "kp_u3_g5", "title": "立体图形的分类", "image": "assets/images/img_006127a6c56e.jpg", "explain": "我们一起来搭一搭吧！用长方体、正方体、圆柱和球搭出喜欢的作品。搭好后分一分：可以按形状分成方方的一类（长方体、正方体）和圆圆的一类（圆柱、球）；也可以按能不能滚动来分。分类标准不同，结果也可能不同，但都要看清楚每种图形的特点。", "key": "按形状或特点把立体图形分类。", "audio": {"title": "m1a_math1a_u3_kp_u3_g5_title", "explain": "m1a_math1a_u3_kp_u3_g5_explain", "key": "m1a_math1a_u3_kp_u3_g5_key"}}], "error_prone": [{"id": "ep_u3_1", "title": "圆柱躺着和立着不一样", "desc": "圆柱躺着放容易滚动，立着放稳稳当当。判断能不能滚动时，要先看它是怎么放的。", "image": null, "audio": {"title": "m1a_math1a_u3_ep_u3_1_title", "desc": "m1a_math1a_u3_ep_u3_1_desc"}}, {"id": "ep_u3_2", "title": "长方体和正方体要分清", "desc": "正方体6个面都是一样大的正方形；长方体6个面大都是长方形，面的大小不一定一样。", "image": null, "audio": {"title": "m1a_math1a_u3_ep_u3_2_title", "desc": "m1a_math1a_u3_ep_u3_2_desc"}}, {"id": "ep_u3_3", "title": "球没有平平的面", "desc": "球是圆圆的，没有平平的面，所以放不稳、会滚动。不要把圆片或圆柱侧面错当成球。", "image": null, "audio": {"title": "m1a_math1a_u3_ep_u3_3_title", "desc": "m1a_math1a_u3_ep_u3_3_desc"}}, {"id": "ep_u3_4", "title": "数图形时要按顺序", "desc": "数一堆立体图形时，可以一种一种地数，边数边做记号，避免重复或漏掉。", "image": null, "audio": {"title": "m1a_math1a_u3_ep_u3_4_title", "desc": "m1a_math1a_u3_ep_u3_4_desc"}}], "daily": {"基础": [{"id": "u3_b1", "type": "choice", "knowledge_point": "kp_u3_g1", "stem": "下面哪种东西的形状接近长方体？", "options": ["牙膏盒", "足球", "水杯"], "answer": "牙膏盒", "analysis": "牙膏盒长长方方，有6个长方形面，接近长方体。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b1_stem", "answer": "m1a_math1a_u3_u3_b1_answer", "analysis": "m1a_math1a_u3_u3_b1_analysis"}}, {"id": "u3_b2", "type": "choice", "knowledge_point": "kp_u3_g2", "stem": "下面哪种东西的形状接近正方体？", "options": ["魔方", "卷纸", "皮球"], "answer": "魔方", "analysis": "魔方四四方方，6个面都是正方形，接近正方体。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b2_stem", "answer": "m1a_math1a_u3_u3_b2_answer", "analysis": "m1a_math1a_u3_u3_b2_analysis"}}, {"id": "u3_b3", "type": "choice", "knowledge_point": "kp_u3_g3", "stem": "下面哪种东西的形状接近圆柱？", "options": ["罐头盒", "书本", "骰子"], "answer": "罐头盒", "analysis": "罐头盒上下两面是圆，侧面是弯的，接近圆柱。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b3_stem", "answer": "m1a_math1a_u3_u3_b3_answer", "analysis": "m1a_math1a_u3_u3_b3_analysis"}}, {"id": "u3_b4", "type": "choice", "knowledge_point": "kp_u3_g4", "stem": "下面哪种东西的形状接近球？", "options": ["皮球", "文具盒", "积木块"], "answer": "皮球", "analysis": "皮球圆圆的，没有平平的面，接近球。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b4_stem", "answer": "m1a_math1a_u3_u3_b4_answer", "analysis": "m1a_math1a_u3_u3_b4_analysis"}}, {"id": "u3_b5", "type": "judge", "knowledge_point": "kp_u3_g2", "stem": "正方体的6个面都是一样的。", "answer": "对", "analysis": "正方体6个面都是大小一样的正方形。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b5_stem", "answer": "m1a_math1a_u3_u3_b5_answer", "analysis": "m1a_math1a_u3_u3_b5_analysis"}}, {"id": "u3_b6", "type": "judge", "knowledge_point": "kp_u3_g1", "stem": "长方体的6个面一定都是长方形。", "answer": "错", "analysis": "长方体每个面大都是长方形，有时也会有相对的两个面是正方形。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b6_stem", "answer": "m1a_math1a_u3_u3_b6_answer", "analysis": "m1a_math1a_u3_u3_b6_analysis"}}, {"id": "u3_b7", "type": "choice", "knowledge_point": "kp_u3_g3", "stem": "圆柱怎样放最容易滚动？", "options": ["躺着放", "立着放", "倒着放"], "answer": "躺着放", "analysis": "圆柱躺着放时，圆圆的面着地，容易滚动。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b7_stem", "answer": "m1a_math1a_u3_u3_b7_answer", "analysis": "m1a_math1a_u3_u3_b7_analysis"}}, {"id": "u3_b8", "type": "judge", "knowledge_point": "kp_u3_g4", "stem": "球放在桌子上不会滚动。", "answer": "错", "analysis": "球圆圆的，没有平平的面，放在桌子上会滚动。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b8_stem", "answer": "m1a_math1a_u3_u3_b8_answer", "analysis": "m1a_math1a_u3_u3_b8_analysis"}}, {"id": "u3_b9", "type": "choice", "knowledge_point": "kp_u3_g5", "stem": "把立体图形分类时，下面哪种应该和长方体放在一起？", "options": ["文具盒", "足球", "易拉罐"], "answer": "文具盒", "analysis": "文具盒长长方方，和长方体是一类。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b9_stem", "answer": "m1a_math1a_u3_u3_b9_answer", "analysis": "m1a_math1a_u3_u3_b9_analysis"}}, {"id": "u3_b10", "type": "choice", "knowledge_point": "kp_u3_g5", "stem": "下面哪个图形最容易到处滚动？", "options": ["球", "正方体", "长方体"], "answer": "球", "analysis": "球没有平平的面，最容易到处滚动。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_b10_stem", "answer": "m1a_math1a_u3_u3_b10_answer", "analysis": "m1a_math1a_u3_u3_b10_analysis"}}], "提高": [{"id": "u3_g1", "type": "choice", "knowledge_point": "kp_u3_g2", "stem": "要搭一个又高又稳的塔，下面哪种图形最不适合放在最下面？", "options": ["长方体", "正方体", "球"], "answer": "球", "analysis": "球会滚动，放最下面不稳，容易倒。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g1_stem", "answer": "m1a_math1a_u3_u3_g1_answer", "analysis": "m1a_math1a_u3_u3_g1_analysis"}}, {"id": "u3_g2", "type": "judge", "knowledge_point": "kp_u3_g3", "stem": "圆柱和球都会滚动，所以它们是一类图形。", "answer": "错", "analysis": "圆柱有平平的面，球没有平平的面，它们不是同一类。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g2_stem", "answer": "m1a_math1a_u3_u3_g2_answer", "analysis": "m1a_math1a_u3_u3_g2_analysis"}}, {"id": "u3_g3", "type": "choice", "knowledge_point": "kp_u3_g1", "stem": "下面哪种物品的形状不是长方体？", "options": ["课本", "黑板擦", "篮球"], "answer": "篮球", "analysis": "篮球是球，不是长方体。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g3_stem", "answer": "m1a_math1a_u3_u3_g3_answer", "analysis": "m1a_math1a_u3_u3_g3_analysis"}}, {"id": "u3_g4", "type": "fill", "knowledge_point": "kp_u3_g5", "stem": "一个长方体有（ ）个面。", "answer": "6", "analysis": "长方体有6个面。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g4_stem", "answer": "m1a_math1a_u3_u3_g4_answer", "analysis": "m1a_math1a_u3_u3_g4_analysis"}}, {"id": "u3_g5", "type": "choice", "knowledge_point": "kp_u3_g2", "stem": "正方体的6个面都是什么形状？", "options": ["长方形", "正方形", "圆形"], "answer": "正方形", "analysis": "正方体6个面都是大小一样的正方形。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g5_stem", "answer": "m1a_math1a_u3_u3_g5_answer", "analysis": "m1a_math1a_u3_u3_g5_analysis"}}, {"id": "u3_g6", "type": "judge", "knowledge_point": "kp_u3_g4", "stem": "从哪个方向看球，看到的都是圆形。", "answer": "对", "analysis": "球无论从哪个方向看都是圆圆的。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_g6_stem", "answer": "m1a_math1a_u3_u3_g6_answer", "analysis": "m1a_math1a_u3_u3_g6_analysis"}}], "拓展": [{"id": "u3_t1", "type": "choice", "knowledge_point": "kp_u3_g5", "stem": "用下面哪种图形搭高塔最稳？", "options": ["长方体", "球", "圆柱躺着"], "answer": "长方体", "analysis": "长方体有平平的面，放上去稳当，适合搭高塔。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_t1_stem", "answer": "m1a_math1a_u3_u3_t1_answer", "analysis": "m1a_math1a_u3_u3_t1_analysis"}}, {"id": "u3_t2", "type": "judge", "knowledge_point": "kp_u3_g1", "stem": "书本可以平平地放在桌面上，因为它有平平的面。", "answer": "对", "analysis": "书本接近长方体，有平平的面，可以平放。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_t2_stem", "answer": "m1a_math1a_u3_u3_t2_answer", "analysis": "m1a_math1a_u3_u3_t2_analysis"}}, {"id": "u3_t3", "type": "choice", "knowledge_point": "kp_u3_g3", "stem": "圆柱立着放时，为什么不容易滚动？", "options": ["因为它有平平的底面", "因为它是圆的", "因为它很重"], "answer": "因为它有平平的底面", "analysis": "圆柱立着放时，平平的底面着地，所以站稳不滚动。", "image": null, "audio": {"stem": "m1a_math1a_u3_u3_t3_stem", "answer": "m1a_math1a_u3_u3_t3_answer", "analysis": "m1a_math1a_u3_u3_t3_analysis"}}, {"id": "u3_t4", "typ 76.png", "title": "教材原页 P76", "knowledge_points": [{"title": "生活中找立体图形", "explain": "引导学生从身边实物中找出正方体、球、长方体、圆柱，并通过比高矮、比粗细和搭一搭加深对图形特征的认识。", "key": "找一找比一比"}]}, {"image": "assets/math_pages/上册/p077.png", "title": "教材原页 P77", "knowledge_points": [{"title": "立体图形拼搭与数数", "explain": "通过“摆一摆、连一连”将拼搭作品与所用立体图形对应，并通过数小正方体个数发展空间观念。", "key": "拼搭对应与计数"}]}, {"image": "assets/math_pages/上册/p078.png", "title": "教材原页 P78", "knowledge_points": [{"title": "单元知识与自我检测", "explain": "通过数桌子结构中正方体、圆柱、长方体、球的个数，帮助学生回顾本单元所学，并进行自我评价。", "key": "单元总结检测"}]}, {"image": "assets/math_pages/上册/p079.png", "title": "教材原页 P79", "knowledge_points": [{"title": "简单的重叠问题", "explain": "以大雁排队为例，当一只大雁从前往后数排第6、从后往前数排第3时，学习用画图法解决重复计数问题。", "key": "重叠问题画图法"}]}, {"image": "assets/math_pages/上册/p080.png", "title": "教材原页 P80", "knowledge_points": [{"title": "重叠问题练习应用", "explain": "通过楼房、小动物、鸭子和排队上车等情境练习，巩固用画图法解决从前往后、从后往前重复计数的实际问题。", "key": "重叠问题应用"}]}]}, {"unit_id": "math1a_smart1", "unit": "智慧广场：简单的重叠问题", "image": "assets/images/img_dcfdfd25002b.jpg", "knowledge_points": [{"id": "kp_smart1_g1", "title": "认识重叠问题与画图法", "image": "assets/images/img_dcfdfd25002b.jpg", "explain": "智慧广场——简单的重叠问题。看这一行大雁：从前往后数，黑色大雁排第6；从后往前数，黑色大雁排第3。这行大雁一共有几只呢？有同学用加法算6+3=9（只），但黑色大雁被数了两次，应该再减去1只：9-1=8（只）。遇到这样的问题，可以用画图的方法来分析：先画出圆圈代表每只大雁，标出从前往后数第6只和从后往前数第3只，一眼就能看出谁被数了两次。再把两次数的位置加起来，减去重复的1次，就是正确的总数。", "key": "从前面数和从后面数，中间的人被数了两次；画图标出重复位置，总数等于两次位置数相加再减1。", "audio": {"title": "m1a_math1a_smart1_kp_smart1_g1_title", "explain": "m1a_math1a_smart1_kp_smart1_g1_explain", "key": "m1a_math1a_smart1_kp_smart1_g1_key"}}, {"id": "kp_smart1_g2", "title": "前后位置与生活重叠问题", "image": "assets/images/img_4a3198ec6e3f.jpg", "explain": "从前往后数排第6，说明黑色大雁前面有5只；从后往前数排第3，说明它后面有2只。求一共有几只，也可以想：前面的5只加上后面的2只，再加上自己1只，5+2+1=8（只）。生活中很多地方会遇到重叠问题，比如排队、数楼房、小动物排队、等公交车等。只要是从两头数、中间被重复数的情况，都要记得先加起来，再减去重复数的1次。", "key": "排第几就包括了自己；前面的人数加后面的人数，再加1（自己），就是总数。生活中两头数位置的问题，要注意有没有重复数，记得减1。", "audio": {"title": "m1a_math1a_smart1_kp_smart1_g2_title", "explain": "m1a_math1a_smart1_kp_smart1_g2_explain", "key": "m1a_math1a_smart1_kp_smart1_g2_key"}}], "error_prone": [{"id": "ep_smart1_1", "title": "重叠的人要减1", "desc": "从前往后数排第6，从后往前数排第3，把6和3相加时，中间那个人被算了两次，要再减1才是总人数。", "image": null, "audio": {"title": "m1a_math1a_smart1_ep_smart1_1_title", "desc": "m1a_math1a_smart1_ep_smart1_1_desc"}}, {"id": "ep_smart1_2", "title": "“第几”和“有几”要分清", "desc": "“排第3”说明自己前面有2个人；“前面有3个人”是不包括自己。列式时要看清楚题目说的是哪种。", "image": null, "audio": {"title": "m1a_math1a_smart1_ep_smart1_2_title", "desc": "m1a_math1a_smart1_ep_smart1_2_desc"}}, {"id": "ep_smart1_3", "title": "画图时要标出重复位置", "desc": "用画图法解决重叠问题时，要把从前往后数和从后往前数都标清楚，这样才能一眼看出谁被重复数了。", "image": null, "audio": {"title": "m1a_math1a_smart1_ep_smart1_3_title", "desc": "m1a_math1a_smart1_ep_smart1_3_desc"}}], "daily": {"基础": [{"id": "smart1_b1", "type": "choice", "knowledge_point": "kp_smart1_g1", "stem": "从前往后数小红排第4，从后往前数小红排第2，这一队一共有几人？", "options": ["5人", "6人", "7人"], "answer": "5人", "analysis": "4加2等于6，小红被数了两次，再减1，得到5人。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_b1_stem", "answer": "m1a_math1a_smart1_smart1_b1_answer", "analysis": "m1a_math1a_smart1_smart1_b1_analysis"}}, {"id": "smart1_b2", "type": "fill", "knowledge_point": "kp_smart1_g1", "stem": "从前往后数小明排第5，从后往前数小明排第3，一共有（ ）人。", "answer": "7", "analysis": "5加3等于8，小明被数了两次，再减1，得到7人。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_b2_stem", "answer": "m1a_math1a_smart1_smart1_b2_answer", "analysis": "m1a_math1a_smart1_smart1_b2_analysis"}}, {"id": "smart1_b3", "type": "choice", "knowledge_point": "kp_smart1_g2", "stem": "小华前面有3人，后面有2人，这一队一共有几人？", "options": ["5人", "6人", "7人"], "answer": "6人", "analysis": "前面的3人加后面的2人，再加小华自己1人，得到6人。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_b3_stem", "answer": "m1a_math1a_smart1_smart1_b3_answer", "analysis": "m1a_math1a_smart1_smart1_b3_analysis"}}, {"id": "smart1_b4", "type": "fill", "knowledge_point": "kp_smart1_g2", "stem": "小丽前面有4人，后面有3人，一共有（ ）人。", "answer": "8", "analysis": "4加3等于7，再加小丽自己1人，得到8人。", "imag dge", "knowledge_point": "kp_smart1_g1", "stem": "从前往后数排第5，从后往前数排第2，总人数是5加2等于7。", "answer": "错", "analysis": "5加2等于7，但重复数了1次，要减1，总人数是6。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_q5_stem", "answer": "m1a_math1a_smart1_smart1_q5_answer", "analysis": "m1a_math1a_smart1_smart1_q5_analysis"}}, {"id": "smart1_q6", "type": "choice", "knowledge_point": "kp_smart1_g1", "stem": "从前往后数小狗排第6，从后往前数小狗排第3，一共有几只小动物？", "options": ["8只", "9只", "10只"], "answer": "8只", "analysis": "6加3等于9，小狗被数了两次，再减1，得到8只。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_q6_stem", "answer": "m1a_math1a_smart1_smart1_q6_answer", "analysis": "m1a_math1a_smart1_smart1_q6_analysis"}}, {"id": "smart1_q7", "type": "judge", "knowledge_point": "kp_smart1_g1", "stem": "画图法可以帮助我们找到重叠问题里被重复数的人。", "answer": "对", "analysis": "画图能把排队情况表示清楚，方便找到重复数的位置。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_q7_stem", "answer": "m1a_math1a_smart1_smart1_q7_answer", "analysis": "m1a_math1a_smart1_smart1_q7_analysis"}}, {"id": "smart1_q8", "type": "choice", "knowledge_point": "kp_smart1_g2", "stem": "小红前面有4人，后面有2人，小红排第几？", "options": ["第4", "第5", "第7"], "answer": "第5", "analysis": "前面有4人，小红紧跟在后面，所以排第5。", "image": null, "audio": {"stem": "m1a_math1a_smart1_smart1_q8_stem", "answer": "m1a_math1a_smart1_smart1_q8_answer", "analysis": "m1a_math1a_smart1_smart1_q8_analysis"}}], "mid_test": [], "final_test": [], "pages": [{"image": "assets/math_pages/上册/p109.png", "title": "教材原页 P109", "knowledge_points": [{"title": "画图解决移多补少", "explain": "丽丽做了14朵花，心心做了10朵。通过一一对应画图发现丽丽比心心多4朵，把多出来的一半也就是2朵移给心心，两人就同样多。", "key": "移多补少问题"}]}, {"image": "assets/math_pages/上册/p110.png", "title": "教材原页 P110", "knowledge_points": [{"title": "移多补少练习应用", "explain": "练习用画图法解决小猴分桃、拔河分人和糖果分配等实际问题，包括已知移动数量倒推原来相差多少。", "key": "移多补少应用"}]}]}, {"unit_id": "math1a_u4", "unit": "第四单元 漂亮的粘贴画——11~20各数的认识", "image": "assets/images/img_36fe45773143.jpg", "knowledge_points": [{"id": "kp_u4_g1", "title": "认识11~20各数", "image": "assets/images/img_36fe45773143.jpg", "explain": "漂亮的粘贴画——一起来数一数叶子！先10片10片地圈出来，再添上剩下的。10个一是1个十，1个十和1个一合起来是十一。在计数器上拨一拨：十位上拨1颗珠子表示1个十，个位上拨1颗表示1个一，合起来就是11。", "key": "10个一是1个十；11里面有1个十和1个一。", "audio": {"title": "m1a_math1a_u4_kp_u4_g1_title", "explain": "m1a_math1a_u4_kp_u4_g1_explain", "key": "m1a_math1a_u4_kp_u4_g1_key"}}, {"id": "kp_u4_g2", "title": "11~20的组成", "image": "assets/images/img_eeaf7ba43ff9.jpg", "explain": "接着往下数：11、12、13……19再添上1就是20。十几都是由1个十和几个一组成的，比如15里面有1个十和5个一。2个十是二十，写作20，读作二十。写数时从高位写起，先写十位再写个位。", "key": "十几里面有1个十和几个一；20里面有2个十。", "audio": {"title": "m1a_math1a_u4_kp_u4_g2_title", "explain": "m1a_math1a_u4_kp_u4_g2_explain", "key": "m1a_math1a_u4_kp_u4_g2_key"}}, {"id": "kp_u4_g3", "title": "11~20的读写", "image": "assets/images/img_ac874b94a6e5.jpg", "explain": "11~20各数都是两位数。写数时，十位写在左边，个位写在右边：十位是1就写1，个位是几就写几，比如十五写作15。读数也从高位读起，15读作十五。要注意不要把十位和个位写反。", "key": "写数先写十位再写个位；十位是1、个位是几就是十几。", "audio": {"title": "m1a_math1a_u4_kp_u4_g3_title", "explain": "m1a_math1a_u4_kp_u4_g3_explain", "key": "m1a_math1a_u4_kp_u4_g3_key"}}, {"id": "kp_u4_g4", "title": "11~20的比大小", "image": "assets/images/img_b9cce15f9e16.jpg", "explain": "比一比，14和16谁大？数一数：14、15、16，16大。因为14里面有1个十和4个一，16里面有1个十和6个一，6比4多，所以16大。在数尺上，右边的数总比左边的数大。11~20的数比大小，十位相同就比个位，个位大的数就大。", "key": "十位相同比个位，个位大的数就大。", "audio": {"title": "m1a_math1a_u4_kp_u4_g4_title", "explain": "m1a_math1a_u4_kp_u4_g4_explain", "key": "m1a_math1a_u4_kp_u4_g4_key"}}, {"id": "kp_u4_g5", "title": "10加几和十几减几", "image": "assets/images/img_68f056219d3a.jpg", "explain": "大树用了10个贝壳，小树用了3个贝壳，一共用了多少个？10加3等于13，1个十和3个一合起来是13。如果一共有17个贝壳，用去5个，还剩多少个？17减5等于12。还能根据10+3=13写出两个减法算式：13-10=3和13-3=10。", "key": "10加几等于十几；十几减几等于10；十几减10等于几。", "audio": {"title": "m1a_math1a_u4_kp_u4_g5_title", "explain": "m1a_math1a_u4_kp_u4_g5_explain", "key": "m1a_math1a_u4_kp_u4_g5_key"}}], "error_prone": [{"id": "ep_u4_1", "title": "十位和个位不要写反", "desc": "写15时，左边十位写1，右边个位写5。不要写成51，51表示5个十和1个一，比15大很多。", "image": null, "audio": {"title": "m1a_math1a_u4_ep_u4_1_title", "desc": "m1a_ }, {"id": "u6_q3", "type": "choice", "knowledge_point": "kp_u6_3", "stem": "下面能滚动的是（ ）。", "answer": "球", "analysis": "球能到处滚。", "image": null, "options": ["正方体", "球", "长方体"], "audio": {"stem": "m1a_math1a_u6_u6_q3_stem", "answer": "m1a_math1a_u6_u6_q3_answer", "analysis": "m1a_math1a_u6_u6_q3_analysis"}}, {"id": "u6_q4", "type": "judge", "knowledge_point": "kp_u6_4", "stem": "按形状分类时，圆形和方形要分开。（ ）", "answer": "对", "analysis": "标准不同类分开。", "image": null, "options": ["对", "错"], "audio": {"stem": "m1a_math1a_u6_u6_q4_stem", "answer": "m1a_math1a_u6_u6_q4_answer", "analysis": "m1a_math1a_u6_u6_q4_analysis"}}, {"id": "u6_q5", "type": "fill", "knowledge_point": "kp_u6_2", "stem": "15-7=（ ）。", "answer": "8", "analysis": "15-7=8。", "image": null, "audio": {"stem": "m1a_math1a_u6_u6_q5_stem", "answer": "m1a_math1a_u6_u6_q5_answer", "analysis": "m1a_math1a_u6_u6_q5_analysis"}}, {"id": "u6_q6", "type": "choice", "knowledge_point": "kp_u6_5", "stem": "图：一共有12个，拿走4个，正确算式是（ ）。", "answer": "12-4", "analysis": "求剩余用减。", "image": null, "options": ["12+4", "12-4", "4-12"], "audio": {"stem": "m1a_math1a_u6_u6_q6_stem", "answer": "m1a_math1a_u6_u6_q6_answer", "analysis": "m1a_math1a_u6_u6_q6_analysis"}}, {"id": "u6_q7", "type": "judge", "knowledge_point": "kp_u6_1", "stem": "“8个”和“第8个”意思不同。（ ）", "answer": "对", "analysis": "数量与位置不同。", "image": null, "options": ["对", "错"], "audio": {"stem": "m1a_math1a_u6_u6_q7_stem", "answer": "m1a_math1a_u6_u6_q7_answer", "analysis": "m1a_math1a_u6_u6_q7_analysis"}}, {"id": "u6_q8", "type": "fill", "knowledge_point": "kp_u6_5", "stem": "妈妈买了10个苹果，吃了3个，还剩（ ）个。", "answer": "7", "analysis": "10-3=7。", "image": null, "audio": {"stem": "m1a_math1a_u6_u6_q8_stem", "answer": "m1a_math1a_u6_u6_q8_answer", "analysis": "m1a_math1a_u6_u6_q8_analysis"}}], "mid_test": [], "final_test": [], "pages": [{"image": "assets/math_pages/上册/p111.png", "title": "教材原页 P111", "knowledge_points": [{"title": "提出数学问题", "explain": "单元封面\"六 我爱冰雪运动——总复习\"。情境图：一共有多少只小鸟？我走到第10个台阶了；我第1名（于春）；今天来了12个同学滑雪；王飞后面还有几个同学？从图中你能知道哪些信息？能提出哪些数学问题？提示我们要综合运用上册所学。", "key": "观察·提问"}]}, {"image": "assets/math_pages/上册/p112.png", "title": "教材原页 P112", "knowledge_points": [{"title": "从情境图中提取信息", "explain": "滑冰的人真不少。滑冰的男同学有6人，女同学有7人。彩旗有9面红色的、5面绿色的。仔细观察，你有什么发现？滑雪场真漂亮，有雪人和冰雕，还有……提示我们可以用加法求总数、用减法求部分。", "key": "情境·提取信息"}]}, {"image": "assets/math_pages/上册/p113.png", "title": "教材原页 P113", "knowledge_points": [{"title": "数数方法与数的组成", "explain": "回顾·数与代数：一共有多少只小鸟？我来数一数（1,2,3……）；我会2个2个地数；一共14只；14是由1个十和4个一组成的。王飞后面还有几个同学？我们摆一摆：于春第1名，王飞第6名，王飞后面还有。提示我们学过的数数方法和数的组成。", "key": "数数·分与合"}]}, {"image": "assets/math_pages/上册/p114.png", "title": "教材原页 P114", "knowledge_points": [{"title": "凑十法+立体图形", "explain": "滑冰的一共有多少人？把男、女生的人数合起来用加法计算：7+6。计算7+6有多种方法，我喜欢用凑十法。关于数与计算你还知道哪些知识？图形与几何：我们学过的图形有哪些（水杯是圆柱；长方体；雪人头是球，底座是长方体或正方体）；用4个相同的正方体或长方体能拼出几种不同的长方体。", "key": "凑十法+长方体/正方体/圆柱/球"}]}, {"image": "assets/math_pages/上册/p115.png", "title": "教材原页 P115", "knowledge_points": [{"title": "两位数组成+看图列式", "explain": "综合应用·数与代数：练习1 16是由（1）个十和（6）个一组成的，16是两位数，十位上是1，个位上是6；练习2 连一连涂一涂（猴子15/8/20条尾巴——比8多的涂色，比15少的圈起来等）；练习3 看图列式（机器人每排5个共2排=10个；面包？片+16片=？）；练习4 球场上原有多少人/走了几人/还剩几人。", "key": "两位数组成+图式"}]}, {"image": "assets/math_pages/上册/p116.png", "title": "教材原页 P116", "knowledge_points": [{"title": "比大小+等量代换", "explain": "练习5 在○里填>、<或=（9-2○8, 4+6○12, 9+9○17, 17○8+7, 6+8○14, 13○6+9, 9+5○9+8, 15-5○8, 7-0○7+0）；练习6 填表（+4/-3顺序填，-10/+8顺序填）；练习7 中心数13/16四周填花瓣数（如8+□=13, 3+□=13等）；练习8 一个加数是6另一个加数是7和是13；被减数9减数4差是5；1,3,5,7,9…9后面应是11。", "key": "比大小·规律"}]}, {"image": "assets/math_pages/上册/p117.png", "title": "教材原页 P117", "knowledge_points": [{"title": "数量关系与开放题", "explain": "练习9 表格（篮球原有18个卖出8个还剩10个；烟花原有？卖7个还剩7个即14；跳绳原有19根卖出？根还剩9根即卖出10根）；练习10 想一想选一选（买14块蛋糕，每盒4块/5块/6块/8块，要装满一盒应选4块/6块之类）；练习11 算式填空（10+6=16, 8+□=18, □+□=10, 16-□=10, 18-□=8, 10-□=□, 16-□=6, 18-□=10, 10-□=□）；练习12 加法算式两个加数用图案遮住，3个小朋友答案对吗？", "key": "数量关系·开放题"}]}, {"image": "assets/math_pages/上册/p118.png", "title": "教材原页 P118", "knowledge_points": [{"title": "解决问题+分类", "explain": "练习13 我们两人一共用了9片绿色树叶和4片黄色树叶，一共用多少片（9+4=13 或 4+9=13）；练习14 豆豆排队上车，从前往后数第5，从后往前数第3，一共有几人（5+3-1=7）；练习15 数一数分一分（长方体/正方体/圆柱/球各多少个）；课外实践 找一找生活中形状是长方体、正方体、圆柱或球的物品。", "key": "排队·分类"}]}, {"image": "assets/math_pages/上册/p119.png", "title": "教材原页 P119", "knowledge_points": [{"title": "队列·计算·排序", "explain": "练习1 阳阳排第几（科技馆10个小朋友排成一队）？阳阳前面有几人后面有几人？练习2 算式箭头（+7: 3→10, 5→12, 7→14, 9→16；+6: 4→10, 6→12, 8→14, 9→15；-3: 5→2, 9→6, 10→7, 13→10；-5: 5→0, 8→3, 10→5, 15→10）；练习3 填一填（写出计数器上的数；1个十和6个一组成16再数4个一到20；18/20/11/9/0从大到小排序）；练习4 看图列加减。", "key": "综合应用"}]}, {"image": "assets/math_pages/上册/p120.png", "title": "教材原页 P120", "knowledge_points": [{"title": "应用题与立体辨认", "explain": "练习5 一共有多少个同学（我们有7人+我们有6人=13）；练习6 高铁16节车厢在第6节后面还有多少节（16-6=10节）；练习7 冰雪课程报名表（冰雪轮滑8人、短道速滑5人、花样滑冰17人）：冰雪轮滑和短道速滑共13人；花样滑冰女生5人男生17-5=12人；练习8 圆柱画△、正方体画○（水桶△、玻璃杯△、纸巾盒○、魔方○）。", "key": "应用·分类辨认"}]}, {"image": "assets/math_pages/上册/p121.png", "title": "教材原页 P121", "knowledge_points": [{"title": "学期收获盘点", "explain": "丰收园盘点一学期所学：我认识20以内的数，会计算20以内的加法和10以内的减法；我认识长方体、正方体……；我还了解古人的结绳记数；我会借助学具来数数，并会用学过的数表示物体的个数；我不仅会想问题，还能清楚地说出自己的想法；我会讲数学故事；我会提问题；我会用10以内/20以内的加减法解决问题；我还会用画图的方法解决问题。学习很积极，喜欢和大家交流，觉得学数学很有趣，发现生活中处处有数学。", "key": "学期总结"}]}, {"image": "assets/math_pages/上册/p122.png", "title": "教材原页 P122", "knowledge_points": [{"title": "学期结束畅所欲言", "explain": "一学期结束了，你一定有很多心里话想说吧。我想对老师说……；爸爸、妈妈，我想对您说……；我想对同学说……；我想对自己说……。这是数学书最后的情感教育板块——引导学生回顾一学期学习，感恩老师、家人、同学，鼓励自己继续努力。", "key": "回顾·感恩"}]}, {"image": "assets/math_pages/上册/p123.png", "title": "教材原页 P123", "knowledge_points": [{"title": "（空白页）", "explain": "本页为教材留白页，无教学知识点。", "key": "（空白）"}]}, {"image": "assets/math_pages/上册/p124.png", "title": "教材原页 P124", "knowledge_points": [{"title": "剪纸素材（剪刀/订书机/夹子/尺子/方块/本子/铅笔/橡皮/羽毛球/跳绳等）", "explain": "附页印刷：剪刀、订书机、夹子、尺子、小方块、本子、铅笔、橡皮、削笔器、羽毛球、火苗、口哨、跳绳等学习与体育用品图案。这是教材配套的剪纸素材页，对应课本第7页的「动手做」或「分类」活动，学生可剪下用于操作。", "key": "剪纸·操作素材"}]}, {"image": "assets/math_pages/上册/p125.png", "title": "教材原页 P125", "knowledge_points": [{"title": "（空白页）", "explain": "本页为教材留白页，无教学知识点。", "key udio": {"title": "m1b_math1b_u1_kp_u1_3_title", "explain": "m1b_math1b_u1_kp_u1_3_explain", "key": "m1b_math1b_u1_kp_u1_3_key"}}, {"id": "kp_u1_4", "title": "整理和复习", "image": "assets/images/img_a6fce229d763.jpg", "explain": "把十几减几的算式按规律排成表。横着看，被减数相同，减数越来越小，差越来越大；竖着看，减数相同，被减数越来越大，差也越来越大。找到规律，算得又对又快。", "key": "减法算式有规律：减数不变，被减数多1，差也多1；被减数不变，减数少1，差就多1。", "audio": {"title": "m1b_math1b_u1_kp_u1_4_title", "explain": "m1b_math1b_u1_kp_u1_4_explain", "key": "m1b_math1b_u1_kp_u1_4_key"}}, {"id": "kp_u1_5", "title": "我学会了吗", "image": "assets/images/img_0e1ad1f152d6.jpg", "explain": "用20以内的退位减法能解决生活中的问题：求男生有几人、还剩几只船、还剩几瓶饮料、一个数比另一个数多（少）几。计算时要注意从总数里去掉一部分，用减法。", "key": "求剩余、求一部分、求谁比谁多几或少几，都用减法；计算时可以用破十法或想加算减。", "audio": {"title": "m1b_math1b_u1_kp_u1_5_title", "explain": "m1b_math1b_u1_kp_u1_5_explain", "key": "m1b_math1b_u1_kp_u1_5_key"}}], "error_prone": [{"id": "ep_u1_1", "title": "破十后别忘加", "desc": "用破十法算15-9时，先算10-9=1，还要把1和个位上的5相加得6，不能只写1。", "image": null, "audio": {"title": "m1b_math1b_u1_ep_u1_1_title", "desc": "m1b_math1b_u1_ep_u1_1_desc"}}, {"id": "ep_u1_2", "title": "减法总数要在前", "desc": "列减法算式时，总数要写在被减数的位置，去掉的数写在减数的位置，不能把两个数写反。", "image": null, "audio": {"title": "m1b_math1b_u1_ep_u1_2_title", "desc": "m1b_math1b_u1_ep_u1_2_desc"}}, {"id": "ep_u1_3", "title": "想加算减别用错加数", "desc": "算13-8时，要想8加几等于13，因为8+5=13，所以13-8=5，不能想成8+13。", "image": null, "audio": {"title": "m1b_math1b_u1_ep_u1_3_title", "desc": "m1b_math1b_u1_ep_u1_3_desc"}}, {"id": "ep_u1_4", "title": "比多少要用减法", "desc": "求“一个数比另一个数多几”或“少几”，要用大数减小数，不是把两个数相加。", "image": null, "audio": {"title": "m1b_math1b_u1_ep_u1_4_title", "desc": "m1b_math1b_u1_ep_u1_4_desc"}}], "daily": {"基础": [{"id": "u1_b1", "type": "fill", "knowledge_point": "kp_u1_1", "stem": "13减9等于（ ）。", "answer": "4", "analysis": "13-9=4。", "image": null, "audio": {"stem": "m1b_math1b_u1_u1_b1_stem", "answer": "m1b_math1b_u1_u1_b1_answer", "analysis": "m1b_math1b_u1_u1_b1_analysis"}}, {"id": "u1_b2", "type": "choice", "knowledge_point": "kp_u1_1", "stem": "15 nowledge_points": [{"title": "11/12减2至6规律与应用", "explain": "纵向算12-2至12-6和11-2至11-6，发现差递增规律；看小猴图写四道算式；算7+6/13-6等加减对比；列式解决灰兔拔萝卜（13-5）和插蜡烛（12-7）问题；翻卡片游戏。", "key": "11/12减2-6规律与游戏"}]}, {"image": "assets/math_pages/下册/p146.png", "title": "教材原页 P146", "knowledge_points": [{"title": "结绳记数与多步解决问题", "explain": "古人结绳记数：15只兔子打了6个结还要打几个；圈数使差为7或9；无人机三个年级7+8+13架，求一二年级共几架、三年级没参加表演几架；聪明小屋金字塔数阵找数关系。", "key": "15-6结绳与多步应用"}]}, {"image": "assets/math_pages/下册/p147.png", "title": "教材原页 P147", "knowledge_points": [{"title": "综合练习：看图列式与不计算比大小", "explain": "看图求另一部分（小鸡13只、花12朵）；算11-4/14-8/17-9/15-7等八道题；不计算在每组得数大的算式后画√（如13-5与13-7）；自编十几减9/13减几/差是8的减法算式；16本连环画借8本还剩几。", "key": "不计算比大小与自编算式"}]}, {"image": "assets/math_pages/下册/p148.png", "title": "教材原页 P148", "knowledge_points": [{"title": "算式涂色分类与混合运算接力", "explain": "在鱼形图案中把得数是11的算式涂黄色、得数是9的涂红色（含10+4、15-7、6+5等20多道加减混合）；从6/12/9/3选三张写两道减法讲故事；看谁先跑到终点的加减接力（8+4-5+8-9与16-7+3-4+6）；11只瓢虫飞走6只。", "key": "算式分类与加减混合"}]}, {"image": "assets/math_pages/下册/p149.png", "title": "教材原页 P149", "knowledge_points": [{"title": "温度差、小蜗牛分类与两步应用", "explain": "今晨8℃中午14℃求升高几度（14-8）；填>、<或=比较11-6与12-6等6组算式；小蜗牛按差大于6或小于6回家对15-6/14-9/11-3/13-8等分类；松鼠哥9弟5共采几+吃了8还剩几两步问题。", "key": "温度差与两步应用题"}]}, {"image": "assets/math_pages/下册/p150.png", "title": "教材原页 P150", "knowledge_points": [{"title": "减法算式阵列规律与火柴游戏", "explain": "在阵列中补全11-9到18-9所有减法算式，说出排列规律（被减数不变/减数依次减小），算出每一列差发现差递增；聪明小屋火柴游戏：加/减/移一根火柴使1+3=10、8+9=15、6+9=13、16-8=1等算式成立。", "key": "算式阵列规律与火柴游戏"}]}, {"image": "assets/math_pages/下册/p151.png", "title": "教材原页 P151", "knowledge_points": [{"title": "看图列式、混合运算与加减关系", "explain": "看图写算式（苹果7+?=□、骨头?+?=13、方块图一图三式）；算11-9/12-4等和17-9-2/12-5+8等连加连减混合运算；填加数+加数=和与被减数-减数=差；找与6+8、7+6得数相等的叶子和花上的数。", "key": "混合运算与加减互逆"}]}, {"image": "assets/math_pages/下册/p152.png", "title": "教材原页 P152", "knowledge_points": [{"title": "破十法图示、解决问题与单元回顾", "explain": "林林算12-8用10-8=2,2+2=4的破十法，选正确图示；13架飞机飞走5架剩几；看燕子图讲数学故事再列式；收获园回顾：我会算十几减9、能用减9方法推出减8、退位减法可解决很多问题。", "key": "破十法图示与单元总结"}]}]}, {"unit_id": "math1b_u2", "unit": "第二单元 丰收了——100以内数的认识", "image": "assets/images/img_f0d009f59a55.jpg", "knowledge_points": [{"id": "kp_u2_1", "title": "数数与21的认识", "image": "assets/images/img_f0d009f59a55.jpg", "explain": "地里丰收了，有很多胡萝卜。数一数：一、二、三……二十，再添1是二十一。21里面2在十位，表示2个十；1在个位，表示1个一。写作21，读作二十一。", "key": "几十几里面有几个十和几个一；十位上是几就表示几个十，个位上是几就表示几个一。", "audio": {"title": "m1b_math1b_u2_kp_u2_1_title", "explain": "m1b_math1b_u2_kp_u2_1_explain", "key": "m1b_math1b_u2_kp_u2_1_key"}}, {"id": "kp_u2_2", "title": "认识100", "image": "assets/images/img_88a3f9eded81.jpg", "explain": "二十九再添1是三十；九十九再添1是一百。10个十是一百。100是三位数，百位上是1，表示1个百，十位和个位都是0。一百一百地数：一百、二百……", "key": "10个十是一百；100里面有10个十，100里面有100个一。", "audio": {"title": "m1b_math1b_u2_kp_u2_2_title", "explain": "m1b_math1b_u2_kp_u2_2_explain", "key": "m1b_math1b_u2_kp_u2_2_key"}}, {"id": "kp_u2_3", "title": "比较100以内数的大小", "image": "assets/images/img_60537413dfec.jpg", "explain": "丽丽摘了42个南瓜，心心摘了35个，谁摘得多？42>35。比大小可以先比十位：42里面有4个十，35里面有3个十，4个十比3个十多，所以42大。也可以在数线上找一找，右边的数大。", "key": "两位数比大小，先比十位，十位大的数就大；十位相同再比个位。", "audio": {"title": "m1b_math1b_u2_kp_u2_3_title", "explain": "m1b_math1b_u2_kp_u2_3_explain", "key": "m1b_math1b_u2_kp_u2_3_key"}}, {"id": "kp_u2_4", "title": "整十数加减与两位数加一位数", "image": "assets/images/img_8e05f1b71c95.jpg", "explain": "爸爸摘了40个石榴，妈妈摘了30个，一共摘了多少个？40+30=70。4个十加3个十是7个十。妈妈摘了30个，阳阳摘了6个，一共摘了多少？30+6=36，3个十和6个一合起来是36。", "key": "整十数加减，只把十位上的数相加减；两位数加一位数（不进位），十位不变，个位相加。", "audio": {"title": "m1b_math1b_u2_kp_u2_4_title", "explain": "m1b_math1b_u2_kp_u2_4_explain", "key": "m1b_math1b_u2_kp_u2_4_key"}}, {"id": "kp_u2_5", "title": "百数表", "image": "assets/images/img_5b3a7edc51a1.jpg", "explain": "百数表把1到100按顺序排列。横着看，从第2行起，除最后一列，同一行十位上的数都相同；竖着看，每一列个位上的数都相同。利用这些规律可以填出空格里的数。", "key": "百数表中，左右相邻差1，上下相邻差10；横看十位有规律，竖看个位有规律。", "audio": {"title": "m1b_math1b_u2_kp_u2_5_title", "explain": "m1b_math1b_u2_kp_u2_5_explain", "key": "m1b_math1b_u2_kp_u2_5_key"}}], "error_prone": [{"id": "ep_u2_1", "title": "九十九再添1是一百", "desc": "数到九十九时，再往后数一个不是九十十，而是一百。10个十合起来就是100。", "image": null, "audio": {"title": "m1b_math1b_u2_ep_u2_1_title", "desc": "m1b_math1b_u2_ep_u2_1_desc"}}, {"id": "ep_u2_2", "title": "比大小要先看十位", "desc": "两个两位数比大小，不要只看个位。要先比十位，十位大的那个数就大；十位相同再比个位。", "image": null, "audio": {"title": "m1b_math1b_u2_ep_u2_2_title", "desc": "m1b_math1b_u2_ep_u2_2_desc"}}, {"id": "ep_u2_3", "title": "整十数加减别加个位", "desc": "40+30不是70个一，而是7个十，写作70。计算时只在十位上4+3=7，个位写0。", "image": null, "audio": {"title": "m1b_math1b_u2_ep_u2_3_title", "desc": "m1b_math1b_u2_ep_u2_3_desc"}}, {"id": "ep_u2_4", "title": "几十几的组成", "desc": "35里面有3个十和5个一，不是5个十和3个一。十位和个位表示的意思不一样。", "image": null, "audio": {"title": "m1b_math1b_u2_ep_u2_4_title", "desc": "m1b_math1b_u2_ep_u2_4_desc"}}], "daily": {"基础": [{"id": "u2_b1", "type": "fill", "knowledge_point": "kp_u2_1", "stem": "36的十位上是3，表示（ ）个十。", "answer": "3", "analysis": "36=30+6，十位3表示3个十。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_b1_stem", "answer": "m1b_math1b_u2_u2_b1_answer", "analysis": "m1b_math1b_u2_u2_b1_analysis"}}, {"id": "u2_b2", "type": "fill", "knowledge_point": "kp_u2_1", "stem": "58里面有5个十和（ ）个一。", "answer": "8", "analysis": "58=50+8。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_b2_stem", "answer": "m1b_math1b_u2_u2_b2_answer", "analysis": "m1b_math1b_u2_u2_b2_analysis"}}, {"id": "u2_b3", "type": "choice", "knowledge_point": "kp_u2_2", "stem": "九十九再添1是（ ）。", "answer": "100", "analysis": "99+1=100。", "image": null, "options": ["90", "99", "100"], "audio": {"stem": "m1b_math1b_u2_u2_b3_stem", "answer": "m1b_math1b_u2_u2_b3_answer", "analysis": "m1b_math1b_u2_u2_b3_analysis"}}, {"id": "u2_b4", "type": "judge", "knowledge_point": "kp_u2_2", "stem": "10个十是一百。", "answer": "对", "analysis": "10个十是100。", "image": null, "audio": {"stem": "m1b_math1b_u2_u2_b4_stem", "answer": "m1b_math1b_u2_u2_b4_answer", "analysis": "m1b_math1b_u2_u2_b4_analysis"}}, {"id": "u2_b5", "type": "choice", "knowledge_point": "kp_u2_3", "stem": "42和35比，哪个大？", "answer": "42", "analysis": "42>35。", "image": null, "options": ["35", "42
